(function(){
"use strict";
var app=document.getElementById("app");
var navEl=document.getElementById("nav");
var KEY="magicmath5";
var store={name:"",best:{},coins:0,bonus:{},own:{c:["princess"],p:[],a:[]},eq:{char:"princess",pet:null,hat:null,face:null,back:null,hand:null}};
try{
  var raw=localStorage.getItem(KEY);
  if(raw){
    var o=JSON.parse(raw);
    if(o&&typeof o==="object"){
      store.name=String(o.name||"");
      if(o.v===2&&o.best&&typeof o.best==="object")store.best=o.best;
      store.coins=Number(o.coins)||0;
      if(o.v===2&&o.bonus&&typeof o.bonus==="object")store.bonus=o.bonus;
      if(o.own&&Array.isArray(o.own.c)&&Array.isArray(o.own.p)&&Array.isArray(o.own.a))store.own=o.own;
      if(o.eq&&typeof o.eq==="object")store.eq=Object.assign(store.eq,o.eq);
    }
  }
}catch(e){}
function save(){try{store.v=2;localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmt(s){return String(s).replace(/(\d*)\{(\d+)\/(\d+)\}/g,function(m,w,a,b){return w+'<span class="fr"><i>'+a+'</i><i>'+b+'</i></span>';});}
function starSvg(on){return '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#'+(on?"star":"starOff")+'"/></svg>';}
function coinSvg(){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#coin"/></svg>';}
function stars(n,total){var h="";for(var i=0;i<total;i++)h+=starSvg(i<n);return '<span class="stars" role="img" aria-label="Звёзд: '+n+' из '+total+'">'+h+'</span>';}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pl(n,a,b,c){var m=n%100,d=n%10;if(m>10&&m<20)return c;if(d===1)return a;if(d>=2&&d<=4)return b;return c;}
var LETTERS=["А","Б","В","Г"];
var HEAD_VIEW="2 -5.5 12 14.5";

var CASTLE='<svg class="castle" viewBox="0 -20 600 190" preserveAspectRatio="xMidYMax meet" aria-hidden="true">'
 +'<g fill="#fff0f8" stroke="#12303f" stroke-width="3" stroke-linejoin="round">'
 +'<rect x="60" y="130" width="480" height="40"/><rect x="230" y="90" width="140" height="80"/><rect x="272" y="50" width="56" height="120"/>'
 +'<rect x="180" y="70" width="40" height="100"/><rect x="380" y="70" width="40" height="100"/><rect x="110" y="110" width="36" height="60"/><rect x="454" y="110" width="36" height="60"/></g>'
 +'<g fill="#5aa9ff" stroke="#12303f" stroke-width="3" stroke-linejoin="round"><polygon points="266,52 300,8 334,52"/><polygon points="174,72 200,34 226,72"/><polygon points="374,72 400,34 426,72"/><polygon points="104,112 128,80 152,112"/><polygon points="448,112 472,80 496,112"/></g>'
 +'<line x1="300" y1="8" x2="300" y2="-14" stroke="#12303f" stroke-width="3"/><polygon points="300,-14 322,-8 300,-2" fill="#ff6b57" stroke="#12303f" stroke-width="2"/>'
 +'<g fill="#ffcf3f" stroke="#12303f" stroke-width="2"><rect x="296" y="72" width="8" height="14" rx="4"/><rect x="196" y="92" width="8" height="14" rx="4"/><rect x="396" y="92" width="8" height="14" rx="4"/>'
 +'<rect x="124" y="128" width="8" height="12" rx="4"/><rect x="468" y="128" width="8" height="12" rx="4"/><rect x="250" y="108" width="8" height="12" rx="4"/><rect x="342" y="108" width="8" height="12" rx="4"/>'
 +'<path d="M292 170v-18a8 8 0 0 1 16 0v18z"/></g></svg>';

function topicStars(t){var s=0;for(var i=0;i<t.tasks.length;i++){s+=store.best[t.id+"-"+i]||0;}return s;}
function totals(){
  var max=0,got=0,done=0,all=0;
  TOPICS.forEach(function(t){max+=t.tasks.length*3;got+=topicStars(t);all+=t.tasks.length;t.tasks.forEach(function(_,i){if((t.id+"-"+i) in store.best)done++;});});
  return {max:max,got:got,done:done,all:all};
}

/* ---------- общие части ---------- */
var view="home",shopTab="c";
function hud(){
  return '<div class="hud"><div class="me">'+charSVG(store.eq,{cls:"avatar",nopet:true,view:HEAD_VIEW})+'<b>'+esc(store.name||"Путешественница")+'</b></div>'
   +'<div class="pills"><span class="pill">'+coinSvg()+'<b id="coinN">'+store.coins+'</b></span><span class="pill">'+starSvg(true)+'<b>'+totals().got+'</b></span></div></div>';
}
var NAVS=[
  ["home","Игра",'<path d="M12 2l2.9 6.6 7.1.7-5.4 4.8 1.6 7L12 17.8 5.8 21.1l1.6-7L2 9.3l7.1-.7z"/>'],
  ["shop","Магазин",'<path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="2"/>'],
  ["hero","Мой герой",'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7z"/>']
];
function setNav(active){
  if(!active){navEl.hidden=true;navEl.innerHTML="";return;}
  navEl.hidden=false;
  navEl.innerHTML='<div class="navin">'+NAVS.map(function(n){
    return '<button data-n="'+n[0]+'" class="'+(n[0]===active?"on":"")+'"'+(n[0]===active?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+n[2]+'</svg>'+n[1]+'</button>';
  }).join("")+'</div>';
}
function has(kind,id){return store.own[kind].indexOf(id)>=0;}
function go(name){view=name;render(false);}

  if(view==="shop")shop(keep);else if(view==="hero")heroScreen(keep);else home();
}

/* ---------- главная ---------- */
function home(){
  view="home";setNav("home");
  var T=totals(),pct=T.max?Math.round(T.got/T.max*100):0;
  var bubble=store.name
    ?'<p>Привет, '+esc(store.name)+'! Выбирай башню и отправляйся решать задачи. За звёзды дают монеты.</p><button class="linkbtn" data-a="chname">Сменить имя</button>'
    :'<p>Привет! Как тебя зовут?</p><div class="row"><input id="nm" maxlength="20" autocomplete="off" placeholder="Твоё имя"><button class="btn" data-a="savename">Готово</button></div>';

    }
    return '<button class="tile" data-t="'+t.id+'"><span class="glyph" style="--c:'+t.color+'" aria-hidden="true">'+fmt(t.glyph)+'</span><h3>'+t.title+'</h3><p>'+t.sub+'</p><span class="dots">'+dots+'</span><small>Звёзд: '+got+' из '+max+'</small></button>';
  }).join("");
  app.innerHTML=hud()
    +'<section class="hero"><div><h1>Волшебная математика</h1><p class="lead">5 класс. Решай задачи, зарабатывай монеты и наряжай своего героя.</p></div>'
    
    +'<div class="stagebox"><div class="bubble">'+bubble+'</div>'+charSVG(store.eq,{cls:"herochar"})+'</div>'+CASTLE+'</section>'
    +'<div class="stats"><span>Собрано звёзд: <b>'+T.got+'</b> из '+T.max+'</span><div class="meter" role="img" aria-label="Прогресс '+pct+'%"><i style="width:'+pct+'%"></i></div><span>Решено задач: <b>'+T.done+'</b> из '+T.all+'</span></div>'
    +'<h2 class="sect">Выбери башню</h2><div class="grid">'+tiles+'</div>';
  window.scrollTo(0,0);
}

/* ---------- магазин ---------- */
var shopNote="";
function itemCard(kind,slot,it,prev){
  var owned=has(kind,it.id);
  var eqd=kind==="c"?store.eq.char===it.id:kind==="p"?store.eq.pet===it.id:store.eq[slot]===it.id;
  var btn;
  if(owned){
    btn=eqd?'<button class="btn on" disabled>Надето</button>':'<button class="btn soft" data-a="equip" data-k="'+kind+'" data-s="'+slot+'" data-i="'+it.id+'">Надеть</button>';
  }else{
    var can=store.coins>=it.price;
    btn='<button class="btn'+(can?'':' lack')+'" data-a="buy" data-k="'+kind+'" data-s="'+slot+'" data-i="'+it.id+'">'+coinSvg()+it.price+'</button>';
  }
  return '<div class="item'+(owned?' have':'')+'">'+charSVG(prev,{cls:"pv"})+'<b>'+it.name+'</b>'+btn+'</div>';
}
function shop(keep){
  view="shop";setNav("shop");
  var tabs=[["c","Герои"],["p","Питомцы"],["a","Наряды"]];
  var html=hud()+'<h2 class="sect" style="margin-top:14px">Магазин</h2>'
   +'<div class="tabs" role="tablist">'+tabs.map(function(t){return '<button class="tab'+(shopTab===t[0]?' on':'')+'" role="tab" aria-selected="'+(shopTab===t[0])+'" data-tab="'+t[0]+'">'+t[1]+'</button>';}).join("")+'</div>'
   +'<p class="note" id="note" role="status">'+esc(shopNote)+'</p>';
  var base={char:store.eq.char};
  if(shopTab==="c"){
    html+='<div class="shopgrid">'+CHARS.map(function(c){return itemCard("c","",c,{char:c.id});}).join("")+'</div>';
  }else if(shopTab==="p"){
    html+='<div class="shopgrid">'+PETS.map(function(p){return itemCard("p","",p,{char:store.eq.char,pet:p.id});}).join("")+'</div>';
  }else{
    SLOTS.forEach(function(s){
      html+='<h3 class="slot">'+s.title+'</h3><div class="shopgrid">'+s.items.map(function(it){var pv={char:store.eq.char};pv[s.key]=it.id;return itemCard("a",s.key,it,pv);}).join("")+'</div>';
    });
  }
  app.innerHTML=html;
  if(!keep)window.scrollTo(0,0);
}
function equip(kind,slot,id){
  if(kind==="c")store.eq.char=id;
  else if(kind==="p")store.eq.pet=id||null;
  else store.eq[slot]=id||null;
  save();
}
function buy(kind,slot,id){
  var list=kind==="c"?CHARS:kind==="p"?PETS:(SLOTS.filter(function(s){return s.key===slot;})[0]||{items:[]}).items;
  var it=findIn(list,id);
  if(!it||has(kind,id))return;
  if(store.coins<it.price){
    shopNote="Не хватает "+(it.price-store.coins)+" "+pl(it.price-store.coins,"монеты","монет","монет")+". Решай задачи, и монеты появятся.";
    shop(true);return;
  }
  store.coins-=it.price;
  store.own[kind].push(id);
  equip(kind,slot,id);

  shop(true);
  burst(document.querySelector(".avatar"));

  html+='<div class="slotrow"><h3>Герой</h3><div class="chips">'+store.own.c.map(function(id){var x=findIn(CHARS,id);return chip(store.eq.char===id,"c","",id,x.name,{char:id});}).join("")+'</div></div>';
  html+='<div class="slotrow"><h3>Питомец</h3><div class="chips">'+chip(!store.eq.pet,"p","","","Без питомца",null,true)
    +store.own.p.map(function(id){var x=findIn(PETS,id);return chip(store.eq.pet===id,"p","",id,x.name,{char:store.eq.char,pet:id});}).join("")+'</div></div>';
  SLOTS.forEach(function(s){
    html+='<div class="slotrow"><h3>'+s.title+'</h3><div class="chips">'+chip(!store.eq[s.key],"a",s.key,"","Без наряда",null,true)

}

/* ---------- прохождение темы ---------- */
var S=null;
function pos(i,n){return ((i+0.5)/n*100).toFixed(2);}
function openTopic(id,fromStart){
  var t=TOPICS.filter(function(x){return x.id===id;})[0];
  if(!t)return;
  var first=0;
  if(!fromStart){
    for(var j=0;j<t.tasks.length;j++){if(!((t.id+"-"+j) in store.best)){first=j;break;}}
  }
  S={t:t,i:first,prev:first,run:0,coinsRun:0,bonus:0};
  startTask();
}
function startTask(){
  var t=S.t,task=t.tasks[S.i],n=t.tasks.length;
  var k={tries:0,hints:0,done:false,revealed:false,wrongs:{},msgs:[],opts:null,earned:0,val:""};
  if(task.o){
    k.opts=task.o.map(function(text,idx){return {text:text,idx:idx,ok:idx===task.a,ex:(task.e&&task.e[idx])||""};});
    if(!task.fix)shuffle(k.opts);
  }
  S.tk=k;
  setNav(null);
  var stones=t.tasks.map(function(_,j){return '<i class="'+(((t.id+"-"+j) in store.best)&&j!==S.i?'done':j===S.i?'now':'')+'">'+(n<=12?(j+1):'')+'</i>';}).join("");
  var theory=t.theory.map(function(x){return '<li>'+fmt(x)+'</li>';}).join("");
  app.innerHTML=
    '<div class="bar"><button class="btn ghost" data-a="leave">← На карту</button><h2>'+t.title+'</h2><span class="pill">'+coinSvg()+'<b id="coinN">'+store.coins+'</b></span></div>'
    +'<div class="lane" aria-hidden="true"><div class="stones">'+stones+'</div><div class="hopper" id="hopper" style="left:'+pos(S.prev,n)+'%">'+charSVG(store.eq,{cls:"mini",nopet:true})+'</div></div>'
    +'<details class="cheat"'+(S.i===0?' open':'')+'><summary>Волшебная шпаргалка</summary><ul>'+theory+'</ul></details>'
    +'<section class="card" id="card"></section>';
  renderCard();
  var hp=document.getElementById("hopper");
  if(hp&&S.prev!==S.i){
    requestAnimationFrame(function(){requestAnimationFrame(function(){hp.style.left=pos(S.i,n)+"%";hp.classList.add("hop");});});
  }
  window.scrollTo(0,0);
}
function setMsg(cls,title,text){
  var k=S.tk;
  if(cls==="bad"){k.msgs=k.msgs.filter(function(m){return m.cls!=="bad";});}
  k.msgs.push({cls:cls,title:title,text:text});
}
function renderCard(){
  var t=S.t,task=t.tasks[S.i],k=S.tk,n=t.tasks.length;
  var finished=k.done||k.revealed;
  var prev=document.getElementById("ans");
  if(prev)k.val=prev.value;
  var body="";
  if(k.opts){
    body='<div class="opts">'+k.opts.map(function(o,j){
      var cls=k.wrongs[o.idx]?" wrong":((finished&&o.ok)?" right":"");
      var dis=(k.wrongs[o.idx]||finished)?" disabled":"";
      return '<button class="opt'+cls+'" data-o="'+o.idx+'"'+dis+'><span class="k">'+LETTERS[j]+'</span><span>'+fmt(o.text)+'</span></button>';
    }).join("")+'</div>';
  }else{
    body='<div class="ansrow"><input id="ans" inputmode="decimal" autocomplete="off" placeholder="Твой ответ" value="'+esc(finished?String(task.n):k.val)+'"'+(finished?' disabled':'')+'><button class="btn" data-a="check"'+(finished?' disabled':'')+'>Проверить</button></div>';
  }
  var av=charSVG(store.eq,{cls:"av",nopet:true,view:HEAD_VIEW});
  var msgs=k.msgs.map(function(m){
    return '<div class="say '+m.cls+'">'+av+'<div><b>'+m.title+'</b><p>'+fmt(m.text)+'</p></div></div>';
  }).join("");
  var hl=task.h.length,acts="";
  if(!finished){
    acts+='<button class="btn soft" data-a="hint"'+(k.hints>=hl?' disabled':'')+'>'+(k.hints>=hl?'Подсказки закончились':'Подсказка '+(k.hints+1)+' из '+hl)+'</button>';
    if(k.tries>=2)acts+='<button class="btn soft" data-a="reveal">Показать решение</button>';
  }else{
    acts+='<span class="spacer"></span>'+stars(k.earned,3)+'<button class="btn" data-a="next">'+(S.i<n-1?'Дальше →':'Готово')+'</button>';
  }
  document.getElementById("card").innerHTML=
    '<div class="no">Задача '+(S.i+1)+' из '+n+'</div><p class="q">'+fmt(task.q)+'</p>'+body+msgs+'<div class="acts">'+acts+'</div>';
  if(!k.opts&&!finished&&k.tries>0){var a=document.getElementById("ans");if(a)a.focus();}
}
function updateCoins(){
  var c=document.getElementById("coinN");
  if(!c)return;
  c.textContent=store.coins;
  var p=c.parentNode;p.classList.remove("pulse");void p.offsetWidth;p.classList.add("pulse");
}
function markStone(){var el=document.querySelectorAll(".stones i")[S.i];if(el)el.className="done";}
function record(id,v){var old=store.best[id];if(old===undefined||v>old){store.best[id]=v;}save();}
function solved(){
  var t=S.t,task=t.tasks[S.i],k=S.tk,id=t.id+"-"+S.i;
  k.done=true;
  k.earned=Math.max(1,3-k.hints-(k.tries-1));
  S.run+=k.earned;
  var old=store.best[id]||0;
  var coins=Math.max(0,k.earned-old)*(t.royal?30:15);
  store.coins+=coins;S.coinsRun+=coins;
  record(id,k.earned);
  k.msgs=k.msgs.filter(function(m){return m.cls!=="bad";});
  var praise=k.earned===3?"Блестяще, без единой подсказки!":k.earned===2?"Отлично!":"Ты дошла до ответа сама.";
  var gain=coins>0?"+"+coins+" "+pl(coins,"монета","монеты","монет"):"монеты за эту задачу уже получены раньше";
  setMsg("ok","Верно! +"+k.earned+" "+pl(k.earned,"звезда","звезды","звёзд")+", "+gain,praise);
  setMsg("sol","Как это решается",task.s);
}
function burst(el){
  try{
    if(!el||window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
    var r=el.getBoundingClientRect();
    for(var i=0;i<14;i++){
      var s=document.createElement("span");s.className="spark";
      s.style.left=(r.left+r.width*Math.random())+"px";
      s.style.top=(r.top+r.height/2)+"px";
      s.style.setProperty("--x",(Math.random()*140-70)+"px");
      s.style.setProperty("--y",(-30-Math.random()*80)+"px");
      document.body.appendChild(s);
      (function(x){setTimeout(function(){x.remove();},950);})(s);
    }
  }catch(e){}
}
function pick(idx){
  var k=S.tk;
  if(k.done||k.revealed)return;
  var o=k.opts.filter(function(x){return x.idx===idx;})[0];
  if(!o||k.wrongs[idx])return;
  k.tries++;
  if(o.ok){solved();}
  else{
    k.wrongs[idx]=true;
    setMsg("bad","Почему так не получится",o.ex||"Это неверный ответ. Прочитай условие ещё раз и возьми подсказку.");
  }
  renderCard();
  if(o.ok){updateCoins();markStone();burst(document.querySelector(".opt.right"));}
}
function check(){
  var task=S.t.tasks[S.i],k=S.tk;
  if(k.done||k.revealed)return;
  var inp=document.getElementById("ans");
  var raw=(inp?inp.value:"").trim();
  k.val=raw;
  var norm=raw.replace(/\s+/g,"").replace(",",".");
  if(!/^-?\d+(\.\d+)?$/.test(norm)){
    setMsg("hint","Впиши число","Напиши ответ цифрами, без слов, и нажми «Проверить».");
    renderCard();return;
  }
  k.tries++;
  if(Number(norm)===task.n){
    solved();renderCard();updateCoins();markStone();burst(document.getElementById("ans"));
  }else{
    var key=String(Number(norm));
    var mm=task.m&&(task.m[norm]||task.m[key]);
    setMsg("bad","Почему так не получится",mm||task.w||"Это неверный ответ. Проверь вычисления.");
    renderCard();
  }
}
function hint(){
  var task=S.t.tasks[S.i],k=S.tk;
  if(k.done||k.revealed||k.hints>=task.h.length)return;
  k.msgs=k.msgs.filter(function(m){return m.cls!=="hint"||m.title.indexOf("Подсказка")===0;});
  setMsg("hint","Подсказка "+(k.hints+1)+" из "+task.h.length,task.h[k.hints]);
  k.hints++;
  renderCard();
}
function reveal(){
  var t=S.t,task=t.tasks[S.i],k=S.tk;
  if(k.done||k.revealed)return;
  k.revealed=true;k.earned=0;
  record(t.id+"-"+S.i,0);
  var ans=task.o?task.o[task.a]:String(task.n);
  k.msgs=k.msgs.filter(function(m){return m.cls!=="bad";});
  setMsg("sol","Разберём вместе. Ответ: "+ans,task.s);
  renderCard();markStone();
}
function next(){
  if(S.i<S.t.tasks.length-1){S.prev=S.i;S.i++;startTask();}
  else finish();
}
function finish(){
  var t=S.t,n=t.tasks.length,max=n*3,tot=topicStars(t),pct=tot/max;
  if(!store.bonus[t.id]){store.bonus[t.id]=1;S.bonus=100;store.coins+=100;save();}
  var title=pct>=0.85?"Блестяще!":pct>=0.5?"Отлично!":"Хорошее начало!";
  var msg=pct>=0.85?"Башня покорена. Ты почти не пользовалась подсказками.":
          pct>=0.5?"Башня покорена. Пройди её ещё раз и попробуй собрать все звёзды.":
          "Подсказки и разборы ждут тебя. Пройди башню ещё раз, и звёзд станет больше.";
  var idx=TOPICS.indexOf(t),nt=TOPICS[idx+1];
  var count=pct>=0.85?3:pct>=0.5?2:1;
  var got=S.coinsRun+S.bonus;
  app.innerHTML='<div class="bar"><button class="btn ghost" data-a="leave">← На карту</button><h2>'+t.title+'</h2><span class="pill">'+coinSvg()+'<b id="coinN">'+store.coins+'</b></span></div>'
    +'<section class="card result"><h2>'+title+'</h2>'+charSVG(store.eq,{cls:"pv"})+stars(count,3)
    +'<div class="rewards"><span class="pill">'+starSvg(true)+'<b>'+tot+'</b> из '+max+'</span><span class="pill">'+coinSvg()+'<b>+'+got+'</b></span></div>'
    +'<p>'+msg+(S.bonus?' Бонус за покорённую башню: +100 монет.':'')+'</p>'
    +'<div class="acts"><button class="btn soft" data-a="again">Пройти ещё раз</button><button class="btn soft" data-n="shop">В магазин</button>'
    +(nt?'<button class="btn" data-a="nexttopic">Дальше: '+nt.title+'</button>':'<button class="btn" data-a="leave">На карту</button>')+'</div></section>';
  window.scrollTo(0,0);
}

/* ---------- события ---------- */
function saveName(){
  var v=document.getElementById("nm");
  var name=v?v.value.trim():"";
  if(!name)return;
  store.name=name.slice(0,20);save();home();
}
app.addEventListener("click",function(e){
  var el=e.target.closest("[data-a],[data-o],[data-t],[data-tab],[data-n]");
  if(!el||el.disabled)return;
  if(el.hasAttribute("data-o")){pick(Number(el.getAttribute("data-o")));return;}
  if(el.hasAttribute("data-t")){openTopic(el.getAttribute("data-t"));return;}
  if(el.hasAttribute("data-tab")){shopTab=el.getAttribute("data-tab");shopNote="";shop(false);return;}
  if(el.hasAttribute("data-n")){go(el.getAttribute("data-n"));return;}
  var a=el.getAttribute("data-a");
  if(a==="leave")home();
  else if(a==="savename")saveName();
  else if(a==="chname"){store.name="";save();home();}
  else if(a==="check")check();
  else if(a==="hint")hint();
  else if(a==="reveal")reveal();
  else if(a==="next")next();
  else if(a==="again")openTopic(S.t.id,true);
  else if(a==="nexttopic"){var nt=TOPICS[TOPICS.indexOf(S.t)+1];if(nt)openTopic(nt.id);}
  else if(a==="equip"){equip(el.getAttribute("data-k"),el.getAttribute("data-s"),el.getAttribute("data-i"));render(true);}
  else if(a==="buy"){buy(el.getAttribute("data-k"),el.getAttribute("data-s"),el.getAttribute("data-i"));}
});
navEl.addEventListener("click",function(e){
  var b=e.target.closest("[data-n]");
  if(b){shopNote="";go(b.getAttribute("data-n"));}
});
app.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  if(e.target&&e.target.id==="ans"){e.preventDefault();check();}
  else if(e.target&&e.target.id==="nm"){e.preventDefault();saveName();}
});
home();
})();
</script>
</body>
</html>
