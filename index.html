     m:{"369.6":"Вычтено расстояние, которое поезда сближаются за 1 час (78,5 + 64,3 = 142,8 км). Но прошло 3 часа, поэтому 142,8 нужно умножить на 3.","428.4":"428,4 км — расстояние, на которое поезда сблизились за 3 часа (142,8 × 3). А вопрос про то, сколько км ещё осталось между ними: 512,4 − 428,4.","276.9":"Здесь учтён только первый поезд: 78,5 × 3 = 235,5 и 512,4 − 235,5 = 276,9. Второй поезд тоже едет навстречу и сокращает расстояние."},
     w:"Оба поезда едут навстречу друг другу, поэтому расстояние между ними сокращается сразу за счёт обоих. Найди, на сколько км оно сокращается за один час.",
     h:["Скорость сближения: 78,5 + 64,3 км/ч. Умножь её на 3 часа — узнаешь, на сколько километров поезда сблизились.","Осталось вычесть это число из начального расстояния 512,4 км."],
     s:"1) Скорость сближения: 78,5 + 64,3 = 142,8 км/ч. 2) За 3 часа поезда сблизятся на 142,8 × 3 = 428,4 км. 3) Останется между ними: 512,4 − 428,4 = 84 км. Ответ: 84. Проверка: 78,5 × 3 + 64,3 × 3 = 235,5 + 192,9 = 428,4, и 428,4 + 84 = 512,4."},

    {q:"Рыцарь Артём вышел из замка по дороге к деревне со скоростью 4,5 км/ч. Через 0,4 ч навстречу ему из деревни вышла Лена со скоростью 3,8 км/ч. Они встретились через 2 ч после выхода Лены. Чему равно расстояние от замка до деревни?",
     o:["18,4 км","16,6 км","19,92 км","20,2 км"], a:0,
     e:["","Здесь Артём шёл тоже 2 ч (4,5 × 2 = 9 км). Но он вышел на 0,4 ч раньше Лены, поэтому был в пути 2 + 0,4 = 2,4 ч.","Здесь оба считаны по 2,4 ч, в том числе Лена (3,8 × 2,4 = 9,12 км). Но Лена шла только 2 ч, а лишние 0,4 ч относятся лишь к Артёму.","Так получится, если время Артёма взять 2 + 0,4 + 0,4 = 2,8 ч (4,5 × 2,8 = 12,6 км): добавка 0,4 ч учтена дважды. Артём шёл 2 + 0,4 = 2,4 ч."],
     h:["Сколько часов был в пути Артём к моменту встречи? Он вышел раньше Лены, поэтому ко времени Лены нужно прибавить его «фору».","Найди путь Артёма и путь Лены отдельно (скорость × своё время). Расстояние между замком и деревней — сумма этих путей."],
     s:"1) Время Артёма: 2 + 0,4 = 2,4 ч. 2) Путь Артёма: 4,5 × 2,4 = 10,8 км. 3) Путь Лены: 3,8 × 2 = 7,6 км. 4) Расстояние: 10,8 + 7,6 = 18,4 км. Ответ: 18,4 км. Проверка: за 0,4 ч Артём прошёл 1,8 км, далее вдвоём они сближались со скоростью 8,3 км/ч: 1,8 + 8,3 × 2 = 18,4."},

    {q:"Юная волшебница Аня купила на рынке 3 кг волшебных яблок по 82 руб. 50 коп. за килограмм, 1,5 кг груш по 96 руб. 40 коп. за килограмм и 2 буханки хлеба по 37 руб. 80 коп. Она заплатила 500 руб. На сдачу Аня купила 3 булочки по 8 руб. 50 коп. Сколько денег у неё осталось?",
     o:["32,30 руб.","44,60 руб.","8,15 руб.","6,80 руб."], a:3,
     e:["32,30 руб. — это сдача с 500 руб. после первой покупки. Аня потом ещё купила 3 булочки по 8,5 руб., и их стоимость нужно вычесть.","Так получится, если засчитана одна буханка хлеба (37,8 руб.) вместо двух: сдача 70,1 руб., и 70,1 − 25,5 = 44,6. Но буханок куплено 2, их стоимость 75,6 руб.","Здесь цена булочки записана как 8,05 руб. (8 руб. 5 коп.) вместо 8,5 руб. (8 руб. 50 коп.): 3 × 8,05 = 24,15. Но 50 коп. = 0,5 руб., и 3 × 8,5 = 25,5 руб.",""],
     h:["Найди стоимость яблок, груш и хлеба отдельно, сложи их — это первая покупка. Затем найди сдачу с 500 руб.","Из полученной сдачи вычти стоимость 3 булочек (цену 8 руб. 50 коп. запиши как 8,5 руб.)."],
     s:"1) Яблоки: 82,5 × 3 = 247,5 руб. 2) Груши: 96,4 × 1,5 = 144,6 руб. 3) Хлеб: 37,8 × 2 = 75,6 руб. 4) Первая покупка: 247,5 + 144,6 + 75,6 = 467,7 руб. 5) Сдача: 500 − 467,7 = 32,3 руб. 6) Булочки: 8,5 × 3 = 25,5 руб., осталось 32,3 − 25,5 = 6,8 руб. Ответ: 6,80 руб. Проверка: 467,7 + 25,5 + 6,8 = 500."},

    {q:"В походе у восьми туристов средняя масса рюкзака была 12,5 кг. Когда к ним присоединился девятый турист, средняя масса рюкзака стала 12,2 кг. Сколько килограммов весит рюкзак девятого туриста?", n:9.8,
     m:{"12.2":"12,2 кг — это новая средняя масса всех девяти рюкзаков, а не масса рюкзака новичка. Нужно найти общую массу девяти рюкзаков и вычесть массу первых восьми.","10.1":"Так получится, если считать, что среднее изменилось у 8 туристов: 12,5 − 8 × 0,3 = 10,1. Но новое среднее 12,2 считается по 9 рюкзакам, значит, их общая масса 9 × 12,2 = 109,8 кг.","2.7":"Число 2,7 (9 × 0,3) показывает, на сколько рюкзак новичка легче прежней средней массы. Масса самого рюкзака: 12,5 − 2,7."},
     w:"Среднее арифметическое, умноженное на число рюкзаков, даёт их общую массу. Найди общую массу до прихода девятого туриста и после.",
     h:["Общая масса первых восьми рюкзаков: 12,5 × 8. Общая масса девяти рюкзаков: 12,2 × 9.","Масса рюкзака девятого туриста равна разности этих двух общих масс."],
     s:"1) Масса восьми рюкзаков: 12,5 × 8 = 100 кг. 2) Масса девяти рюкзаков: 12,2 × 9 = 109,8 кг. 3) Рюкзак девятого туриста: 109,8 − 100 = 9,8 кг. Ответ: 9,8. Проверка: (100 + 9,8) ÷ 9 = 109,8 ÷ 9 = 12,2."},

    {q:"Запятую в десятичной дроби перенесли на один знак вправо, и дробь увеличилась на 31,05. Найди исходную дробь.", n:3.45,
     m:{"3.105":"Здесь 31,05 разделено на 10. Но 31,05 — это не новая дробь, а прирост. Новая дробь больше исходной в 10 раз, значит, прирост равен 9 исходным дробям.","34.5":"34,5 — это новая дробь (в 10 раз больше исходной), а спрашивается исходная. Новую дробь нужно ещё разделить на 10.","31.05":"Здесь выписан сам прирост. Он равен новой дроби минус исходная, то есть 10 исходных минус 1 исходная = 9 исходных."},
     w:"Если запятая сдвинулась вправо на один знак, дробь стала в 10 раз больше. Изобрази исходную дробь как 1 часть, а новую — как 10 таких частей.",
     h:["На сколько частей новая дробь больше исходной? Это и есть 31,05.","Раздели 31,05 на число частей, чтобы найти одну часть — исходную дробь."],
     s:"1) Исходная дробь — 1 часть, новая — 10 частей. 2) Прирост: 10 − 1 = 9 частей, и эти 9 частей равны 31,05. 3) Одна часть: 31,05 ÷ 9 = 3,45. Ответ: 3,45. Проверка: 3,45 × 10 = 34,5, и 34,5 − 3,45 = 31,05."},

    {q:"Из цифр 0, 3, 5 и 8, используя каждую ровно один раз, составляют десятичные дроби вида a,bcd (целая часть — одна цифра, она может быть равна 0). Чему равна разность между наибольшей и наименьшей такими дробями?",
     o:["5,472","8,172","7,947","8,145"], a:1,
     e:["Так получится, если считать наименьшей дробью 3,058 (8,53 − 3,058). Но целая часть может быть равна 0, и тогда дробь 0,358 меньше.","","Здесь наибольшей дробью взято 8,305. Но после целой части 8 цифры нужно ставить по убыванию, получается 8,530, и это больше 8,305.","Здесь наименьшей дробью взято 0,385. Но цифры после запятой нужно ставить по возрастанию, и наименьшая дробь — 0,358."],
     h:["Чтобы составить наибольшую дробь, ставь цифры по убыванию, начиная с целой части. А для наименьшей — наоборот, по возрастанию.","Наименьшую цифру 0 можно поставить в целую часть. Запиши обе дроби и вычти их, запятая под запятой."],
     s:"1) Наибольшая: цифры по убыванию, 8,530. 2) Наименьшая: цифры по возрастанию, 0,358 (целая часть может быть 0). 3) Разность: 8,530 − 0,358 = 8,172. Ответ: 8,172. Проверка: 0,358 + 8,172 = 8,530."},

    {q:"Волшебник сложил все числа от 0,1 до 2,0 с шагом 0,1: 0,1 + 0,2 + 0,3 + … + 1,9 + 2,0. Какое число у него получилось? Складывать числа по порядку необязательно: попробуй сгруппировать слагаемые.", n:21,
     m:{"42":"Так получится, если взять 2,1 и умножить на 20 (число всех слагаемых). Но в одну пару входят сразу два слагаемых, поэтому пар только 10.","18.9":"Так получится, если взять 9 пар по 2,1. Всего слагаемых 20, значит, пар 10: 0,1 + 2,0; 0,2 + 1,9; … 1,0 + 1,1.","2.1":"Число 2,1 — это сумма одной пары (0,1 + 2,0). Таких пар нужно взять 10."},
     w:"Сложи первое слагаемое с последним, второе — с предпоследним. Что получится у всех пар?",
     h:["Все пары дают одну и ту же сумму 2,1. Сколько всего слагаемых и сколько из них получится пар?","Умножь сумму одной пары на число пар."],
     s:"1) Слагаемых всего 20 (от 0,1 до 2,0 с шагом 0,1). 2) Группируем: 0,1 + 2,0 = 2,1; 0,2 + 1,9 = 2,1; … ; 1,0 + 1,1 = 2,1. Все пары дают 2,1. 3) Пар: 20 ÷ 2 = 10. 4) Сумма: 2,1 × 10 = 21. Ответ: 21. Проверка: 0,1 × (1 + 2 + … + 20) = 0,1 × 210 = 21."}
  ]
});
TOPICS.push({
  id:"pct", title:"Поляна Процентов", sub:"Проценты, скидки, доли", glyph:"%", color:"#ff7eb6",
  theory:[
    "Процент — это одна сотая часть: 1% = {1/100}. Всё целое — это 100%, а 200% — это два целых.",
    "Запомни пары: 50% = {1/2}, 25% = {1/4}, 75% = {3/4}, 10% = {1/10}, 20% = {1/5}. Чтобы найти 25%, делят на 4, а чтобы найти 10% — на 10.",
    "Процент от числа: раздели число на 100 (это 1%) и умножь на число процентов. Например, 35% от 200 = 200 ÷ 100 × 35 = 70.",
    "Число по его проценту: найди, сколько приходится на 1% (раздели на число процентов), и умножь на 100. Если 35% — это 70, то 1% — это 2, а 100% — это 200. Проценты берутся от определённого числа: 20% от 100 и 20% от 150 — разные величины."
  ],
  tasks:[
    {q:"Лена пришла в спортивный магазин. Кроссовки стоили 3 200 руб., на них действовала скидка 25%. Спортивная сумка стоила 1 800 руб., скидка на неё была 10%. Сколько рублей заплатила Лена за обе покупки?",
     o:["3 250 руб.","4 020 руб.","980 руб.","4 230 руб."], a:1,
     e:["Так получится, если сложить проценты скидок (25% + 10% = 35%) и применить их к общей стоимости 5 000 руб.: 5 000 × 0,65 = 3 250. Но скидки действуют на разные товары, и каждую нужно считать от цены своего товара.",
        "",
        "Здесь найдена только общая сумма скидок: 800 + 180 = 980 руб. Но вопрос про то, сколько Лена заплатила, поэтому скидки нужно вычесть из полной стоимости 5 000 руб.",
        "Так получится, если скидки перепутать: 25% от 1 800 руб. (450 руб.) и 10% от 3 200 руб. (320 руб.), всего 770 руб., и 5 000 − 770 = 4 230. Скидка в 25% относится к кроссовкам, а скидка в 10% — к сумке."],
     h:["Найди отдельно цену кроссовок и цену сумки после скидки. Каждую скидку считай от цены именно того товара, на который она действует.",
        "25% — это {1/4} цены, поэтому для кроссовок нужно вычесть четверть от 3 200 руб. А 10% — это {1/10} цены, и для сумки вычитают десятую часть от 1 800 руб. Затем сложи цены со скидкой."],
     s:"1) Кроссовки: скидка 3 200 ÷ 4 = 800 руб., цена 3 200 − 800 = 2 400 руб. 2) Сумка: скидка 1 800 ÷ 10 = 180 руб., цена 1 800 − 180 = 1 620 руб. 3) Всего: 2 400 + 1 620 = 4 020 руб. Ответ: 4 020 руб. Проверка: полная цена 3 200 + 1 800 = 5 000 руб., скидки 800 + 180 = 980 руб., 5 000 − 980 = 4 020 руб."},

    {q:"Миша с папой прошёл по горной тропе длиной 150 км за три дня. В первый день они прошли 30% всего маршрута, во второй день — 40% того, что осталось после первого дня, а в третий день прошли остаток пути. Сколько километров они прошли в третий день?",
     o:["63 км","45 км","42 км","105 км"], a:0,
     e:["",
        "Так получится, если 40% взять от всего маршрута (60 км), а не от остатка: 150 − 45 − 60 = 45 км. Но во второй день 40% относятся к остатку 105 км.",
        "Здесь найдено только, сколько пройдено во второй день: 40% от 105 км — это 42 км. Чтобы найти третий день, эти 42 км ещё нужно вычесть из остатка.",
        "105 км — это остаток пути после первого дня. Во второй день из него пройдено ещё 42 км, и это не учтено."],
     h:["Найди, сколько километров пройдено в первый день и сколько пути осталось после него.",
        "Во второй день 40% берётся от остатка, а не от всех 150 км. Найди эту часть остатка, а затем вычти её из остатка."],
     s:"1) В первый день: 150 ÷ 100 × 30 = 45 км. 2) После первого дня осталось 150 − 45 = 105 км. 3) Во второй день: 105 ÷ 10 × 4 = 42 км. 4) В третий день: 105 − 42 = 63 км. Ответ: 63 км. Проверка: 45 + 42 + 63 = 150 км."},

    {q:"В классе 30 человек. На кружок шахмат записались все, причём девочек оказалось на 6 больше, чем мальчиков. Сколько процентов записавшихся составляют мальчики? Ответ запиши числом, без знака %.",
     n:40, m:{"20":"Так получится, если 6 принять за число мальчиков: 6 ÷ 30 = 20%. Но 6 — это на сколько девочек больше, чем мальчиков. Число мальчиков нужно найти отдельно.",
              "60":"60% — это доля девочек (18 человек из 30). А спрашивается про мальчиков, их доля меньше.",
              "50":"Так получится, если разделить класс поровну: 15 мальчиков и 15 девочек, 15 ÷ 30 = 50%. Но девочек на 6 больше, значит, поровну быть не может."},
     w:"Сначала нужно найти число мальчиков: 30 − 6 = 24, 24 ÷ 2 = 12. Потом найти, какую часть класса они составляют: 12 ÷ 30 = 0,4 = 40%.",
     h:["Сначала найди, сколько в классе мальчиков и сколько девочек. Если убрать «лишних» 6 девочек, останется поровну тех и других.",
        "Запиши долю мальчиков дробью: число мальчиков в числителе, число 30 в знаменателе. Сократи дробь и приведи её к знаменателю 100."],
     s:"1) Если убрать «лишних» 6 девочек, останется 30 − 6 = 24 человека, поровну мальчиков и девочек. 2) Мальчиков 24 ÷ 2 = 12, девочек 12 + 6 = 18. 3) Доля мальчиков: 12 ÷ 30 = {2/5} = 40%. Ответ: 40. Проверка: 12 + 18 = 30, 18 − 12 = 6, а 40% от 30 = 12."},

    {q:"Книга в магазине стоила 2 000 руб. Сначала цену повысили на 20%, а на распродаже новую цену снизили на 25%. Сколько рублей стала стоить книга после распродажи?",
     o:["1 900 руб.","2 400 руб.","1 800 руб.","1 500 руб."], a:2,
     e:["Так получится, если сложить изменения: +20% − 25% = −5%, и 5% от 2 000 руб. — это 100 руб. Но снижение на 25% считается от новой цены 2 400 руб., а не от прежней 2 000 руб.",
        "2 400 руб. — это цена после повышения. Затем на распродаже её ещё снизили на 25%.",
        "",
        "Так получится, если 25% вычесть из прежней цены: 2 000 − 500 = 1 500. Но повышение на 20% не учтено, и распродажа снижает уже новую цену."],
     h:["Сначала найди цену после повышения на 20%. Процент повышения считай от 2 000 руб.",
        "Распродажа снижает уже новую цену, а не прежнюю. Найди 25% от новой цены (это {1/4}) и вычти."],
     s:"1) 20% от 2 000 руб. = 2 000 ÷ 5 = 400 руб., новая цена 2 000 + 400 = 2 400 руб. 2) 25% от 2 400 руб. = 2 400 ÷ 4 = 600 руб. 3) После распродажи: 2 400 − 600 = 1 800 руб. Ответ: 1 800 руб. Проверка: 2 000 × 1,2 × 0,75 = 1 800."},

    {q:"Королевский повар приготовил 2 кг салата. Огурцы составляют 45% массы салата, помидоров на 200 г меньше, чем огурцов, а всё остальное — зелень. Сколько граммов зелени в салате?",
     o:["1 100 г","900 г","200 г","400 г"], a:3,
     e:["Так получится, если вычесть только огурцы: 2 000 − 900 = 1 100 г. Но кроме огурцов в салате есть помидоры, и их масса тоже вычитается.",
        "Так получится, если считать, что помидоров 200 г: 2 000 − 900 − 200 = 900 г. Но 200 г — это на сколько помидоров меньше, чем огурцов: помидоров 900 − 200 = 700 г.",
        "Так получится, если считать, что помидоров столько же, сколько огурцов: 2 000 − 900 − 900 = 200 г. Но помидоров на 200 г меньше, чем огурцов, то есть 700 г.",
        ""],
     h:["Переведи 2 кг в граммы и найди массу огурцов: 45% от 2 000 г.",
        "Масса помидоров — это масса огурцов без 200 г. Зелень — то, что остаётся от всего салата после огурцов и помидоров."],
     s:"1) 2 кг = 2 000 г. Огурцы: 2 000 ÷ 100 × 45 = 900 г. 2) Помидоры: 900 − 200 = 700 г. 3) Зелень: 2 000 − 900 − 700 = 400 г. Ответ: 400 г. Проверка: 900 + 700 + 400 = 2 000 г."},

    {q:"Артём читает сборник сказок. Он прочитал 35% всех страниц, и ему осталось прочитать ещё 130 страниц. Сколько страниц в сборнике? Ответ запиши числом.",
     n:200, m:{"70":"Так получится, если найти только уже прочитанные страницы: 130 ÷ 65 × 35 = 70. А вопрос про весь сборник, значит, нужно прибавить ещё 130 непрочитанных страниц.",
               "165":"Так получится, если прибавить 35 к 130. Но 35 — это проценты, а 130 — страницы: складывать их нельзя.",
               "130":"130 страниц — это только непрочитанная часть сборника (65%), а не весь сборник."},
     w:"Непрочитанные страницы составляют 100% − 35% = 65% сборника. Значит, 65% — это 130 страниц, 1% — это 130 ÷ 65 = 2 страницы, а весь сборник — 2 × 100 = 200 страниц.",
     h:["Остаток тоже можно записать в процентах. Сколько процентов страниц ещё не прочитано?",
        "Найди, сколько страниц приходится на 1% сборника, разделив 130 на найденное число процентов. Потом найди 100%."],
     s:"1) Осталось 100% − 35% = 65% страниц. 2) 65% — это 130 страниц, значит, 1% — это 130 ÷ 65 = 2 страницы. 3) Весь сборник: 2 × 100 = 200 страниц. Ответ: 200. Проверка: 35% от 200 = 70 страниц, 70 + 130 = 200."},

    {q:"Магазин закупил 50 шапок по 300 руб. и назначил наценку 60% к закупочной цене. 40 шапок продали по этой цене, а оставшиеся 10 — со скидкой 50% от цены продажи. Какую прибыль получил магазин?",
     o:["6 600 руб.","21 600 руб.","9 000 руб.","5 700 руб."], a:0,
     e:["",
        "21 600 руб. — это выручка, то есть все деньги от продажи. Прибыль — это выручка минус затраты на закупку (50 × 300 = 15 000 руб.).",
        "Так получится, если все 50 шапок продали с наценкой: 50 × 480 = 24 000, 24 000 − 15 000 = 9 000. Но 10 шапок продали со скидкой 50%, и они принесли меньше.",
        "Так получится, если скидку 50% взять от закупочной цены (150 руб.): 40 × 480 + 10 × 150 = 20 700, и 20 700 − 15 000 = 5 700. Скидка же считается от цены продажи 480 руб. (это 240 руб.)."],
     h:["Найди цену продажи одной шапки с наценкой, а затем цену шапки со скидкой 50%.",
        "Выручка — это деньги от продажи всех 50 шапок. Чтобы найти прибыль, вычти из выручки то, что магазин заплатил за закупку."],
     s:"1) Наценка: 300 ÷ 100 × 60 = 180 руб., цена продажи 300 + 180 = 480 руб. 2) Со скидкой 50%: 480 ÷ 2 = 240 руб. 3) Выручка: 40 × 480 + 10 × 240 = 19 200 + 2 400 = 21 600 руб. 4) Затраты: 50 × 300 = 15 000 руб. 5) Прибыль: 21 600 − 15 000 = 6 600 руб. Ответ: 6 600 руб. Проверка: 40 шапок дали по 180 руб. прибыли (7 200 руб.), а на 10 шапках потеряно по 60 руб. (600 руб.), 7 200 − 600 = 6 600."},

    {q:"Хоккейная команда за осенний круг сыграла 20 матчей и выиграла 55% из них. За зимний круг она сыграла ещё 30 матчей и выиграла 60% из них. Сколько процентов всех матчей за оба круга выиграла команда?",
     o:["57,5%","58%","60%","29%"], a:1,
     e:["Так получится, если сложить проценты и разделить пополам: (55 + 60) ÷ 2 = 57,5. Но матчей в кругах было разное количество (20 и 30), поэтому среднее арифметическое процентов не подходит. Нужно сравнивать число побед с числом всех матчей.",
        "",
        "60% — это доля побед только за зимний круг. Осенний круг, в котором побед было меньше, тоже нужно учесть.",
        "29 — это число выигранных матчей (11 + 18), а не процент. Процент — это число побед, делённое на число всех матчей, то есть на 50."],
     h:["Найди, сколько матчей команда выиграла осенью и сколько зимой. Проценты брать от числа матчей своего круга.",
        "Сложи победы за оба круга и сравни с общим числом матчей: найди, какую часть и сколько процентов составляют победы."],
     s:"1) Осенью: 20 ÷ 100 × 55 = 11 побед. 2) Зимой: 30 ÷ 100 × 60 = 18 побед. 3) За два круга: 11 + 18 = 29 побед из 20 + 30 = 50 матчей. 4) 29 ÷ 50 = 58 ÷ 100 = 58%. Ответ: 58%. Проверка: 58% от 50 матчей = 50 ÷ 100 × 58 = 29."},

    {q:"Мастер красит забор из досок. В понедельник он покрасил 25% всех досок, во вторник — {2/5} тех досок, что остались, а в среду докрасил последние 90 досок. Сколько всего досок в заборе? Ответ запиши числом.",
     n:200, m:{"150":"Так получится, если считать, что во вторник покрасили {2/5} = 40% всех досок, и забыть про понедельник: 90 досок — это 100% − 40% = 60%, 90 ÷ 60 × 100 = 150. Но {2/5} берётся только от досок, оставшихся после понедельника.",
               "120":"Так получится, если учесть только понедельник: 90 досок — это 75%, 90 ÷ 75 × 100 = 120. Но во вторник тоже красили, и 90 досок — только то, что осталось после вторника.",
               "90":"90 досок — это только то, что покрасили в среду, а не весь забор."},
     w:"Весь забор — 100%. После понедельника остаётся 75%, во вторник красят {2/5} от 75%, то есть 30%. Остаётся 45%, и это 90 досок. Значит, 1% — это 2 доски, а весь забор — 200 досок.",
     h:["Весь забор — это 100%. Найди, сколько процентов осталось после понедельника, и сколько процентов составляют {2/5} этого остатка.",
        "После вторника остаётся некоторая часть забора в процентах, и она равна 90 доскам. Найди, сколько досок приходится на 1%, а потом на 100%."],
     s:"1) После понедельника осталось 100% − 25% = 75%. 2) Во вторник: {2/5} от 75% = 75 ÷ 5 × 2 = 30%. 3) На среду осталось 75% − 30% = 45%. 4) 45% — это 90 досок, значит, 1% — это 90 ÷ 45 = 2 доски. 5) Весь забор: 2 × 100 = 200 досок. Ответ: 200. Проверка: понедельник 50 досок, вторник {2/5} от 150 = 60 досок, среда 90 досок, 50 + 60 + 90 = 200."},

    {q:"У Миши было 150 рублей. У Ани оказалось на 20% больше, чем у Миши, а у Лены — на 20% меньше, чем у Ани. На сколько процентов у Лены меньше, чем у Миши? Ответ запиши числом.",
     n:4, m:{"0":"Так получится, если считать, что «на 20% больше» и «на 20% меньше» уничтожают друг друга. Но 20% берутся от разных сумм: сначала от 150 руб., а потом от 180 руб.",
             "6":"6 — это разница в рублях (150 − 144). А вопрос про проценты: нужно узнать, какую часть от 150 руб. составляют эти 6 руб.",
             "20":"20% — это изменение суммы на каждом шаге, а вопрос про итог. Нужно найти суммы Ани и Лены и сравнить Лену с Мишей."},
     w:"У Ани 150 + 30 = 180 руб. (20% от 150 = 30). У Лены 180 − 36 = 144 руб. (20% от 180 = 36). Разница с Мишей 150 − 144 = 6 руб., и 6 ÷ 150 = 4%.",
     h:["Найди, сколько рублей у Ани, а затем сколько у Лены. Для Лены 20% берётся от суммы Ани, а не от суммы Миши.",
        "Найди разницу между суммами Миши и Лены в рублях. Затем выясни, какую часть от суммы Миши (150 руб.) она составляет."],
     s:"1) 20% от 150 руб. = 150 ÷ 5 = 30 руб., у Ани 150 + 30 = 180 руб. 2) 20% от 180 руб. = 180 ÷ 5 = 36 руб., у Лены 180 − 36 = 144 руб. 3) У Лены меньше, чем у Миши, на 150 − 144 = 6 руб. 4) 6 ÷ 150 = 4 ÷ 100 = 4%. Ответ: 4. Проверка: 4% от 150 руб. = 6 руб., 150 − 6 = 144."},

    {q:"Две бригады укладывают плитку на аллее. Первая бригада за день укладывает 10% аллеи, а вторая — 15%. Первые два дня они работали вместе, потом вторую бригаду отправили на другой объект, и остаток аллеи первая бригада укладывала одна. Сколько всего дней заняла работа?",
     o:["4 дня","5 дней","7 дней","10 дней"], a:2,
     e:["Так получится, если считать, что обе бригады работали вместе всё время: 100 ÷ 25 = 4 дня. Но через два дня вторая бригада ушла, и скорость упала до 10% в день.",
        "5 дней — это только время работы одной первой бригады (50 ÷ 10). Два первых дня совместной работы тоже входят в общий срок.",
        "",
        "10 дней потребовалось бы первой бригаде, если бы она делала всю работу одна (100 ÷ 10). Но первые два дня обе бригады работали вместе и успели сделать больше."],
     h:["Сколько процентов аллеи обе бригады укладывают за один день вместе? Сколько процентов будет готово за два дня?",
        "Найди, сколько процентов аллеи осталось после двух дней. Узнай, за сколько дней это сделает одна первая бригада, и не забудь прибавить первые два дня."],
     s:"1) Вместе за день: 10% + 15% = 25% аллеи. 2) За два дня: 25% × 2 = 50%. 3) Осталось 100% − 50% = 50%. 4) Первая бригада делает 10% в день: 50 ÷ 10 = 5 дней. 5) Всего 2 + 5 = 7 дней. Ответ: 7 дней. Проверка: 2 × 25% + 5 × 10% = 50% + 50% = 100%."},

    {q:"В секции плавания занимаются 25 человек, из них девочек 60%. Недавно в секцию пришли несколько новых мальчиков, после чего девочек стало ровно 50% всех занимающихся. Сколько мальчиков пришло?",
     o:["10 мальчиков","15 мальчиков","30 мальчиков","5 мальчиков"], a:3,
     e:["10 — это разность процентов (60 − 50). Но проценты и люди — разные величины: 10% от 25 человек — это не 10 человек.",
        "15 — это число девочек (60% от 25). Оно не менялось, но это не ответ: нужно найти, сколько мальчиков пришло.",
        "30 — это общее число занимающихся после прихода новых мальчиков. А пришли только те, кто сверх прежних 25 человек.",
        ""],
     h:["Число девочек не изменилось. Найди, сколько их, ведь после прихода мальчиков они составляют половину секции.",
        "Если девочки составляют половину всех занимающихся, то занимающихся вдвое больше, чем девочек. Сравни получившееся число с прежними 25 человеками."],
     s:"1) Девочек: 25 ÷ 100 × 60 = 15. 2) Теперь они составляют 50% = {1/2} секции, значит, всех занимающихся стало 15 × 2 = 30. 3) Пришло мальчиков: 30 − 25 = 5. Ответ: 5 мальчиков. Проверка: девочек 15 из 30, это 50%."},

    {q:"Корабль принцессы плыл к далёкому острову три дня. В первый день он прошёл 40% всего пути, во второй — 20% пути, а в третий день прошёл остаток, который оказался на 90 миль меньше, чем он прошёл за первые два дня вместе. Сколько миль от порта до острова?",
     o:["450 миль","225 миль","150 миль","180 миль"], a:0,
     e:["",
        "Так получится, если 90 миль принять за 40% пути (третий день): 90 ÷ 40 × 100 = 225. Но 90 миль — это не весь третий день, а разница между третьим днём и первыми двумя вместе.",
        "Так получится, если 90 миль принять за 60% пути (первые два дня): 90 ÷ 60 × 100 = 150. Но 90 миль — это разница между 60% и остатком пути.",
        "180 миль — это длина пути за третий день (40% от 450 миль). А вопрос про весь путь от порта до острова."],
     h:["Найди, сколько процентов пути прошёл корабль за первые два дня и сколько процентов осталось на третий день.",
        "Сравни доли первых двух дней и третьего дня. На сколько процентов они отличаются? Эта разница в процентах равна 90 милям."],
     s:"1) За первые два дня: 40% + 20% = 60%. 2) На третий день: 100% − 60% = 40%. 3) Разница: 60% − 40% = 20%, и это 90 миль. 4) 1% — это 90 ÷ 20 = 4,5 мили, весь путь 4,5 × 100 = 450 миль. Ответ: 450 миль. Проверка: за первые два дня 180 + 90 = 270 миль, в третий день 180 миль, 270 − 180 = 90."},

    {q:"Куртка стоила 5 000 руб. В пятницу на неё объявили скидку 20%, а в субботу к уже сниженной цене применили ещё одну скидку 10%. Кроме того, у Артёма был купон, который давал право вычесть 400 руб. из цены после всех скидок. Сколько рублей заплатил Артём за куртку?",
     o:["3 100 руб.","3 200 руб.","3 600 руб.","3 500 руб."], a:1,
     e:["Так получится, если сложить скидки (20% + 10% = 30%) и применить их к 5 000 руб.: 5 000 × 0,7 = 3 500, потом вычесть купон: 3 500 − 400 = 3 100. Но вторая скидка в 10% считается от сниженной цены 4 000 руб., а не от 5 000 руб.",
        "",
        "3 600 руб. — это цена после двух скидок. Купон на 400 руб. остался не учтённым.",
        "Здесь скидки сложены в одну (30% от 5 000 руб.), а купон не учтён. Так получились сразу две ошибки: скидки считаются по очереди, а купон ещё вычитается."],
     h:["Скидки действуют по очереди: вторая считается от цены, уже сниженной первой скидкой.",
        "Сначала найди цену после двух скидок. Купон вычитают в самом конце, из цены после скидок."],
     s:"1) Скидка 20%: 5 000 ÷ 5 = 1 000 руб., цена 5 000 − 1 000 = 4 000 руб. 2) Скидка 10% от 4 000 руб. = 400 руб., цена 4 000 − 400 = 3 600 руб. 3) Купон: 3 600 − 400 = 3 200 руб. Ответ: 3 200 руб. Проверка: 5 000 × 0,8 × 0,9 = 3 600, 3 600 − 400 = 3 200. Две скидки вместе дают 28%, а не 30%: 1 400 руб. из 5 000 руб."},

    {q:"Волшебник сварил 400 г зелья, в котором 25% составляет сушёный корень светлячка. Чтобы доля корня в зелье стала 20%, он решил долить воды. Сколько граммов воды нужно долить?",
     o:["80 г","20 г","100 г","500 г"], a:2,
     e:["80 г — это 20% от 400 г. Но долить нужно столько воды, чтобы корень стал составлять 20% от нового зелья, а не от прежнего.",
        "Так получится, если разность долей 25% − 20% = 5% взять от 400 г: 400 ÷ 100 × 5 = 20 г. Но после доливания масса зелья растёт, и 20% считаются уже от новой массы.",
        "",
        "500 г — это масса зелья после доливания. А спрашивается, сколько воды долить, то есть на сколько новая масса больше прежней."],
     h:["Масса корня при доливании воды не меняется. Найди, сколько граммов корня в зелье.",
        "Эта масса корня должна стать 20% = {1/5} нового зелья. Найди массу нового зелья и сравни её с прежними 400 г."],
     s:"1) Корня: 400 ÷ 4 = 100 г (25% — это {1/4}). 2) После доливания воды те же 100 г корня должны составлять 20% = {1/5} зелья. 3) Масса нового зелья: 100 × 5 = 500 г. 4) Воды нужно долить: 500 − 400 = 100 г. Ответ: 100 г. Проверка: 100 ÷ 500 = 20%."},

    {q:"Цена килограмма яблок выросла на 25% и стала 150 руб. На сколько процентов теперь нужно снизить эту цену, чтобы килограмм снова стоил как раньше? Ответ запиши числом.",
     n:20, m:{"25":"Так получится, если считать, что рост на 25% и снижение на 25% возвращают прежнюю цену. Но снижение считается от новой цены 150 руб.: 25% от неё — это 37,5 руб., и цена станет 112,5 руб., а не 120 руб.",
              "30":"30 — это разница в рублях (150 − 120). А вопрос про проценты: нужно узнать, какую часть цены 150 руб. составляют эти 30 руб.",
              "80":"80% — это доля, которую прежняя цена составляет от новой (120 ÷ 150). А спрашивается, на сколько процентов цену нужно снизить: 100% − 80%."},
     w:"Прежняя цена: 150 руб. — это 125%, значит, 1% — это 1,2 руб., а прежняя цена 120 руб. Снижать нужно на 150 − 120 = 30 руб., а это 30 ÷ 150 = 20% от новой цены.",
     h:["Цена 150 руб. — это 125% прежней цены. Найди прежнюю цену.",
        "Найди, на сколько рублей нужно снизить цену 150 руб. Затем узнай, какую часть от 150 руб. составляет эта сумма."],
     s:"1) 125% — это 150 руб., значит, 1% — это 150 ÷ 125 = 1,2 руб. 2) Прежняя цена: 1,2 × 100 = 120 руб. 3) Нужно снизить на 150 − 120 = 30 руб. 4) 30 ÷ 150 = {1/5} = 20%. Ответ: 20. Проверка: 20% от 150 руб. = 30 руб., 150 − 30 = 120 руб."},

    {q:"Аня и Миша положили деньги в банк на два года. Аня вложила 20 000 руб. под 10% в год, причём в конце первого года проценты прибавляются ко вкладу и на второй год начисляются уже на новую сумму. Миша вложил 25 000 руб. под 8% в год, но ему проценты каждый год начисляются только на первоначальную сумму. У кого начисленных процентов за два года больше и на сколько?",
     o:["Поровну","Аня, на 40 руб.","Миша, на 4 800 руб.","Аня, на 200 руб."], a:3,
     e:["Так получится, если Ане тоже начислять проценты каждый год от 20 000 руб.: 2 000 + 2 000 = 4 000 руб., как у Миши. Но на второй год Ане проценты начисляют на 22 000 руб., и это 2 200 руб.",
        "Так получится, если и Мише начислять проценты на проценты: 25 000 × 1,08 × 1,08 = 29 160 руб., то есть 4 160 руб. процентов, и 4 200 − 4 160 = 40. Но по условию Мише проценты начисляют только на первоначальную сумму.",
        "Так получится, если сравнивать итоговые суммы на счетах: у Миши 29 000 руб., у Ани 24 200 руб., разница 4 800 руб. Но сравнивать нужно только начисленные проценты, а не вклады вместе с ними.",
        ""],
     h:["Найди проценты Ани отдельно за каждый год. На второй год они начисляются уже на увеличенную сумму.",
        "Проценты Миши — одна и та же сумма каждый год. Найди её за год, затем за два года и сравни результаты вкладчиков."],
     s:"1) Аня, первый год: 10% от 20 000 руб. = 2 000 руб., на счёте 22 000 руб. 2) Аня, второй год: 10% от 22 000 руб. = 2 200 руб. Всего процентов 2 000 + 2 200 = 4 200 руб. 3) Миша: 8% от 25 000 руб. = 2 000 руб. в год, за два года 4 000 руб. 4) 4 200 − 4 000 = 200 руб. Ответ: у Ани больше на 200 руб. Проверка: на счёте Ани 20 000 + 4 200 = 24 200 руб., а 22 000 × 1,1 = 24 200."},

    {q:"Садовник привёз с поля арбуз массой 10 кг, и в нём было 99% воды. За неделю арбуз подсох, и воды в нём стало 98%. Сколько килограммов стал весить арбуз? Ответ запиши числом.",
     n:5, m:{"9.9":"Так получится, если считать, что масса арбуза упала на 1%, потому что доля воды уменьшилась на 1%: 10 − 0,1 = 9,9. Но процент воды считается от новой массы арбуза, а не от прежней, поэтому из-за 1% масса уменьшается гораздо сильнее: сухого вещества стало в новом арбузе уже 2%.",
             "9.8":"Так получится, если считать, что арбуз просто стал 98% от прежней массы: 10 ÷ 100 × 98 = 9,8. Но 98% — это доля воды в новом арбузе, а не доля от прежней массы.",
             "0.1":"0,1 кг — это масса сухого вещества (1% от 10 кг). Но в новом арбузе эти 0,1 кг составляют уже 2%, а весь арбуз — 100%."},
     w:"Сухое вещество не испаряется: его 1% от 10 кг, то есть 0,1 кг. После подсыхания оно составляет 100% − 98% = 2% арбуза, значит, 1% — это 0,05 кг, а весь арбуз — 5 кг.",
     h:["Что не изменилось при подсыхании — вода или сухое вещество? Найди массу того, что не испаряется.",
        "Теперь эта масса составляет 100% − 98% = 2% нового арбуза. Найди, сколько килограммов приходится на 1%, а затем на 100%."],
     s:"1) Сухого вещества сначала 100% − 99% = 1% от 10 кг: 10 ÷ 100 = 0,1 кг. 2) При подсыхании испаряется только вода, а 0,1 кг сухого вещества остаётся. 3) Теперь сухое вещество составляет 100% − 98% = 2% нового арбуза. 4) 2% — это 0,1 кг, значит, 1% — это 0,05 кг, а весь арбуз — 0,05 × 100 = 5 кг. Ответ: 5. Проверка: воды 5 − 0,1 = 4,9 кг, а 4,9 ÷ 5 = 98%."},

    {q:"Добрый дракон опросил 30 жителей долины. Оказалось, что 60% любят золото, 70% любят драгоценные камни, а 10% не любят ни золото, ни камни. Сколько жителей любят и золото, и камни?",
     o:["12 жителей","3 жителя","27 жителей","18 жителей"], a:0,
     e:["",
        "3 жителя — это те, кто не любит ни золото, ни камни (10% от 30). К ответу они отношения не имеют.",
        "27 жителей — это те, кто любит хотя бы что-то одно (90% от 30). Среди них есть и любители только золота, и любители только камней.",
        "18 жителей — это все любители золота (60% от 30). Но часть из них не любит камни, а часть любителей камней не любит золото."],
     h:["Сколько процентов жителей любят хотя бы что-то одно? Сколько процентов получится, если просто сложить 60% и 70%?",
        "Те, кто любит и золото, и камни, при сложении посчитаны дважды. На сколько процентов сумма 60% + 70% больше, чем 90%?"],
     s:"1) Любят хотя бы что-то: 100% − 10% = 90% жителей. 2) 60% + 70% = 130%: любителей обоих посчитали дважды. 3) Любят обоих: 130% − 90% = 40%. 4) 30 ÷ 100 × 40 = 12 жителей. Ответ: 12 жителей. Проверка: любителей золота 18, камней 21, 18 + 21 − 12 = 27, и ещё 3 не любят ничего: 27 + 3 = 30."},

    {q:"Магазин посуды закупил чайные сервизы по 800 руб. за штуку. Продавец поставил цену на 25% выше закупочной, но сервизы почти не покупали, и цену снизили на 10%. На сколько процентов цена, по которой сервизы стали продавать, выше закупочной? Ответ запиши числом.",
     n:12.5, m:{"15":"Так получится, если вычесть проценты: 25 − 10 = 15. Но 10% берутся от новой цены 1 000 руб., а не от закупочной 800 руб., поэтому проценты вычитать нельзя.",
                "100":"100 — это на сколько рублей цена выше закупочной (900 − 800). А вопрос про проценты: нужно найти, какую часть от закупочной цены составляют эти 100 руб.",
                "11.1":"Так получится, если разницу 100 руб. сравнить с итоговой ценой 900 руб. Но в вопросе сравнение идёт с закупочной ценой 800 руб."},
     w:"После наценки цена 800 + 200 = 1 000 руб., после снижения 1 000 − 100 = 900 руб. Она выше закупочной на 100 руб., а это 100 ÷ 800 = {1/8} = 12,5% от закупочной цены.",
     h:["Найди цену после наценки 25%, затем цену после снижения на 10%. Процент снижения считай от новой цены.",
        "Найди, на сколько рублей итоговая цена выше закупочной, и вырази это в процентах закупочной цены (800 руб.)."],
     s:"1) Наценка: 800 ÷ 4 = 200 руб., цена 800 + 200 = 1 000 руб. 2) Снижение: 1 000 ÷ 10 = 100 руб., цена 1 000 − 100 = 900 руб. 3) Выше закупочной на 900 − 800 = 100 руб. 4) 100 ÷ 800 = {1/8} = 12,5%. Ответ: 12.5. Проверка: 12,5% от 800 руб. = 100 руб., 800 + 100 = 900 руб."}
  ]
});
TOPICS.push({
  id:"geo", title:"Королевство Фигур", sub:"Периметр, площадь, объём, углы", glyph:"△", color:"#c3a6ff",
  theory:[
    "Прямоугольник: периметр P = 2·(a + b), площадь S = a·b. Квадрат: P = 4·a, S = a·a = a². Составную фигуру можно разрезать на прямоугольники или дополнить до большого прямоугольника и вычесть лишнее. Рамка (дорожка) вокруг фигуры = площадь внешней фигуры − площадь внутренней.",
    "Если все стороны увеличить в k раз, периметр вырастет в k раз, а площадь — в k·k раз. Если одну сторону увеличить в 2 раза, а другую в 3 раза, площадь вырастет в 2·3 = 6 раз, а периметр надо пересчитывать по новым сторонам.",
    "Единицы: 1 дм² = 100 см², 1 м² = 100 дм² = 10 000 см². Объём прямоугольного параллелепипеда V = a·b·c, куба V = a·a·a. 1 дм³ = 1 л = 1000 см³, 1 м³ = 1000 дм³ = 1000 л. Сколько предметов войдёт в коробку: по каждому ребру считать целое число штук (остаток отбрасывается), потом перемножить.",
    "Углы: сумма углов треугольника 180°, развёрнутый угол 180°, прямой угол 90°, смежные углы вместе дают 180°, биссектриса делит угол пополам. Часы: минутная стрелка проходит 6° в минуту, часовая — 30° в час (0,5° в минуту). Разрезание прямоугольника на равные квадраты связано с наибольшим общим делителем сторон."
  ],
  tasks:[
    {q:"Участок прямоугольной формы имеет длину 18 м и ширину 12 м. Его нужно обнести сеткой по всему периметру, но в одном месте будут ворота шириной 3 м, там сетка не нужна. Один метр сетки стоит 150 рублей. Сколько рублей придётся заплатить за сетку?",
     o:["9000 рублей","4050 рублей","8550 рублей","32400 рублей"], a:2,
     e:["Так получится, если сетку считать на весь периметр 60 м. Ворота шириной 3 м сеткой не закрываются, эти 3 м нужно вычесть.","Здесь взят полупериметр: (18 + 12) − 3 = 27 м. Но забор идёт вокруг всего участка, то есть по всем четырём сторонам, поэтому берётся периметр 2·(18 + 12) = 60 м.","","Так получится, если умножить на цену площадь участка 18·12 = 216 м². Сетка покупается на длину забора (периметр), а не на площадь."],
     h:["Сетка нужна на длину границы участка. Какая величина описывает длину границы фигуры?","Найди периметр, вычти ворота, и только потом умножай на цену одного метра."],
     s:"1) Периметр участка: 2·(18 + 12) = 60 м. 2) Сетка нужна без ворот: 60 − 3 = 57 м. 3) Стоимость: 57·150 = 8550 рублей. Ответ: 8550 рублей. Проверка: 57·100 = 5700, 57·50 = 2850, 5700 + 2850 = 8550."},

    {q:"Пол кухни — прямоугольник 6 м на 4 м. Его выкладывают квадратной плиткой со стороной 40 см. Плитку продают только упаковками по 12 штук, одна упаковка стоит 1000 рублей. Сколько рублей придётся заплатить за плитку, если взять наименьшее число упаковок, которого хватит? Ответ запиши в рублях.",
     n:13000, m:{"12500":"Так получится, если 150 : 12 = 12,5 оставить дробным и купить «полторы упаковки». Упаковки продаются только целиком, поэтому нужно округлить вверх до 13.","12000":"Здесь 12,5 упаковки округлено вниз до 12. Тогда плиток будет 12·12 = 144, а нужно 150, не хватит. Округлять нужно вверх.","3000":"Так получится, если число плиток считать по сумме сторон: 15 + 10 = 25. Плитки покрывают площадь, поэтому по длине помещается 15 штук, по ширине 10, а всего 15·10 = 150 штук."},
     w:"Проверь: сторона плитки переведена в метры или длина пола в сантиметры? Сколько плиток помещается вдоль каждой стороны и сколько их всего? Сколько упаковок нужно, если их можно брать только целыми?",
     h:["Переведи размеры пола в сантиметры и узнай, сколько плиток укладывается вдоль длины и сколько вдоль ширины.","Умножь два числа плиток, получишь все плитки. Дальше разделить на 12 и подумать, можно ли купить часть упаковки."],
     s:"1) 6 м = 600 см, 600 : 40 = 15 плиток вдоль длины. 2) 4 м = 400 см, 400 : 40 = 10 плиток вдоль ширины. 3) Всего плиток: 15·10 = 150. 4) 150 : 12 = 12 и остаток 6, значит, 12 упаковок мало, нужно 13 упаковок (156 плиток). 5) Стоимость: 13·1000 = 13000 рублей. Ответ: 13000. Проверка: 12 упаковок дают 144 плитки < 150, а 13 упаковок дают 156 ≥ 150."},

    {q:"Участок имеет форму Г: это прямоугольник 20 м на 15 м, у которого в одном из углов вырезан прямоугольный кусок 8 м на 6 м (вырез примыкает к двум сторонам большого прямоугольника). На каждые 12 м² участка уходит один мешок удобрения. Сколько мешков нужно, чтобы удобрить весь участок?",
     o:["21","25","29","17"], a:0,
     e:["","Так получится, если считать площадь всего прямоугольника 20·15 = 300 м² (300 : 12 = 25). Вырезанный кусок не относится к участку, его площадь 8·6 = 48 м² нужно вычесть.","Здесь вырез 48 м² не вычтен, а прибавлен: 300 + 48 = 348, 348 : 12 = 29. Вырезанная часть участку не принадлежит, поэтому она вычитается.","Здесь вырез вычтен дважды: 300 − 48 − 48 = 204, 204 : 12 = 17. Вычитать 48 м² нужно один раз."],
     h:["Достроить Г-образную фигуру до целого прямоугольника проще всего. Чему равна площадь целого прямоугольника и площадь выреза?","Из площади большого прямоугольника вычти вырез один раз, потом разделить на площадь, которую удобряет один мешок."],
     s:"1) Площадь большого прямоугольника: 20·15 = 300 м². 2) Площадь выреза: 8·6 = 48 м². 3) Площадь участка: 300 − 48 = 252 м². 4) Мешков: 252 : 12 = 21. Ответ: 21. Проверка: 21·12 = 252."},

    {q:"Прямоугольная клумба имеет размеры 5 м на 3 м. Вокруг неё со всех сторон проложили дорожку шириной 1 м и выложили её плиткой. Один квадратный метр плитки с укладкой стоит 450 рублей. Сколько рублей стоит вся дорожка?",
     o:["7200 рублей","15750 рублей","4050 рублей","9000 рублей"], a:3,
     e:["Так получится, если площадь дорожки считать как периметр клумбы на ширину: 16·1 = 16 м². Не учтены 4 угловых квадрата 1 м на 1 м, всего 20 м².","Здесь умножена на цену площадь всего большого прямоугольника вместе с клумбой: 7·5 = 35 м². Площадь клумбы 15 м² плиткой не покрывается и вычитается.","Так получится, если дорожка есть лишь с одной длинной и одной короткой стороны: (5 + 1)·(3 + 1) − 15 = 9 м². Но дорожка идёт вокруг клумбы со всех сторон, и каждая сторона большого прямоугольника на 2 м больше.",""],
     h:["Дорожка вместе с клумбой образует большой прямоугольник. Какие у него стороны, если дорожка есть с обеих сторон каждой стороны клумбы?","Найди площадь большого прямоугольника, вычти площадь клумбы — получится площадь дорожки. Затем умножь на цену за 1 м²."],
     s:"1) Размеры клумбы вместе с дорожкой: длина 5 + 1 + 1 = 7 м, ширина 3 + 1 + 1 = 5 м. 2) Площадь большого прямоугольника: 7·5 = 35 м². 3) Площадь клумбы: 5·3 = 15 м². 4) Площадь дорожки: 35 − 15 = 20 м². 5) Стоимость: 20·450 = 9000 рублей. Ответ: 9000 рублей. Проверка: 4 прямоугольника по бокам 5·1 + 5·1 + 3·1 + 3·1 = 16 м² и 4 угла по 1 м²: 16 + 4 = 20."},

    {q:"Прямоугольник имеет стороны 6 см и 4 см. Его длину 6 см увеличили в 2 раза, а ширину 4 см увеличили в 3 раза. На сколько увеличились периметр и площадь?",
     o:["на 100 см и на 120 см²","на 28 см и на 120 см²","на 28 см и на 144 см²","на 48 см и на 144 см²"], a:1,
     e:["Периметр здесь умножен на 6 (2·3), получилось 20·6 = 120 см, и увеличение 100 см. Но периметр не растёт во столько раз: нужно сложить новые стороны. Новый периметр 2·(12 + 12) = 48 см, увеличение 28 см.","","Площадь 144 см² — это новая площадь, а спрашивается, на сколько она увеличилась: 144 − 24 = 120 см².","Здесь названы новые значения (периметр 48 см, площадь 144 см²), а нужно найти увеличение: 48 − 20 = 28 см и 144 − 24 = 120 см²."],
     h:["Найди старые периметр и площадь, потом новые стороны. Какими станут стороны прямоугольника?","Сравни старые и новые величины вычитанием. Вопрос про то, на сколько увеличились, а не про то, чему равны."],
     s:"1) Старый прямоугольник: P = 2·(6 + 4) = 20 см, S = 6·4 = 24 см². 2) Новые стороны: 6·2 = 12 см и 4·3 = 12 см (получился квадрат). 3) P = 2·(12 + 12) = 48 см, S = 12·12 = 144 см². 4) Периметр вырос на 48 − 20 = 28 см, площадь выросла на 144 − 24 = 120 см². Ответ: на 28 см и на 120 см². Проверка: площадь выросла в 2·3 = 6 раз: 24·6 = 144."},

    {q:"Аквариум имеет форму прямоугольного параллелепипеда: длина 50 см, ширина 30 см, высота 40 см. Воду налили до высоты 30 см, принося её трёхлитровой банкой и каждый раз наливая банку полностью. Сколько банок воды понадобилось? (1 л = 1 дм³ = 1000 см³)",
     n:15, m:{"20":"Так получится, если считать объём всего аквариума: 50·30·40 = 60000 см³ = 60 л, 60 : 3 = 20. Но вода налита лишь до высоты 30 см, а не 40 см.","15000":"Здесь объём 45000 см³ разделён на 3 без перевода в литры. 45000 см³ = 45 дм³ = 45 л (в 1 л 1000 см³), и только потом делить на 3.","45":"Так получится, если остановиться на объёме воды 45 л. Нужно ещё узнать, сколько трёхлитровых банок в 45 литрах: 45 : 3."},
     w:"Проверь: высота слоя воды взята 30 см, а не 40 см? Объём в см³ переведён в литры (1000 см³ = 1 л)? Литры разделены на 3, ведь банка трёхлитровая?",
     h:["Вода занимает такой же параллелепипед, но меньшей высоты. Найди его объём в кубических сантиметрах.","Переведи кубические сантиметры в литры, а потом узнай, сколько раз по 3 литра помещается в этом объёме."],
     s:"1) Объём воды: 50·30·30 = 45000 см³. 2) 1000 см³ = 1 л, поэтому 45000 см³ = 45 л. 3) Банок: 45 : 3 = 15. Ответ: 15. Проверка: 15·3 = 45 л = 45000 см³ = 50·30·30."},

    {q:"Комната — прямоугольник 6 м на 4 м. В центре лежит ковёр 3 м на 2 м, под ним паркет не нужен. Всю остальную часть пола покрывают паркетными досками размером 50 см на 20 см. Сколько досок потребуется?",
     o:["240","190","180","1800"], a:2,
     e:["Так получится, если не вычесть ковёр: 24 м² = 240000 см², 240000 : 1000 = 240. Под ковром паркет не нужен, его площадь 6 м² нужно вычесть.","Здесь площадь ковра принята за сумму сторон 3 + 2 = 5 м². Площадь прямоугольника равна произведению: 3·2 = 6 м². Правильно 24 − 6 = 18 м².","","Так получится, если площадь одной доски принять за 0,01 м² вместо 0,1 м². 50 см·20 см = 1000 см², а в 1 м² 10000 см², поэтому доска занимает 0,1 м²."],
     h:["Площадь, которую нужно покрыть, — это пол без ковра. Найди её, а площадь доски посчитай в тех же единицах (в см² или в м²).","Переведи всё в см²: 1 м² = 10000 см². Разделить площадь пола без ковра на площадь одной доски."],
     s:"1) Площадь комнаты: 6·4 = 24 м². 2) Площадь ковра: 3·2 = 6 м². 3) Площадь под паркет: 24 − 6 = 18 м² = 180000 см². 4) Площадь доски: 50·20 = 1000 см². 5) Досок: 180000 : 1000 = 180. Ответ: 180. Проверка: 180 досок по 0,1 м² дают 18 м²."},

    {q:"В комнате длиной 5 м, шириной 4 м и высотой 3 м красят стены (потолок и пол не красят). В стенах есть окно 2 м на 1,5 м и дверь 2 м на 1 м, их не красят. Красить нужно в два слоя. Одной банки краски хватает на 10 м² одного слоя, банка стоит 700 рублей. Банки продают только целиком. Сколько рублей заплатят за краску? Ответ запиши в рублях.",
     n:7000, m:{"3500":"Так получится, если красить в один слой: 49 м² требуют 5 банок. Но слоя два, поэтому краски нужно на 98 м², то есть 10 банок.","6300":"Здесь 98 : 10 = 9,8 округлено вниз до 9 банок. Краски на 90 м² не хватит на 98 м², поэтому берётся 10 банок.","7700":"Так получится, если не вычесть окно и дверь: площадь стен 54 м², в два слоя 108 м², это 11 банок. Окно и дверь не красят, их 3 + 2 = 5 м² вычитаются."},
     w:"Проверь: площадь четырёх стен найдена как периметр комнаты на высоту? Вычтены окно (3 м²) и дверь (2 м²)? Учтены два слоя и целое число банок?",
     h:["Площадь стен — это периметр пола, умноженный на высоту. Не забудь вычесть окно и дверь.","Умножь площадь на число слоёв, раздели на 10 и подумай, можно ли купить 9,8 банки."],
     s:"1) Периметр комнаты: 2·(5 + 4) = 18 м. 2) Площадь четырёх стен: 18·3 = 54 м². 3) Окно: 2·1,5 = 3 м², дверь: 2·1 = 2 м². Красить нужно 54 − 3 − 2 = 49 м². 4) Два слоя: 49·2 = 98 м². 5) Банок: 98 : 10 = 9,8, значит, нужно 10 банок. 6) Стоимость: 10·700 = 7000 рублей. Ответ: 7000. Проверка: 10 банок покрывают 100 м² ≥ 98 м², а 9 банок только 90 м²."},

    {q:"Участок 24 м на 18 м огорожен забором по всему периметру. Столбы стоят через каждые 3 м, считая и все четыре угла. Часть забора между двумя соседними столбами называют пролётом. В каждом пролёте прибито по 10 досок, кроме одного пролёта, где сделана калитка без досок. Сколько всего досок на заборе?",
     o:["270","280","290","140"], a:0,
     e:["","Так получится, если калитку не учесть: все 28 пролётов по 10 досок. Но в одном пролёте досок нет, поэтому 27·10.","Здесь пролётов насчитано 29: к 28 добавлена единица, как на прямой изгороди. У замкнутого забора, где начало совпадает с концом, пролётов столько же, сколько столбов, а вычесть ещё нужно калитку.","Так получится, если взят полупериметр: (24 + 18) : 3 = 14 пролётов. Но забор идёт вокруг всего участка, и периметр 2·(24 + 18) = 84 м."],
     h:["Сначала узнай, какова длина забора и сколько пролётов по 3 м в ней помещается. Забор замкнутый.","Вычти пролёт с калиткой и умножь на число досок в одном пролёте."],
     s:"1) Периметр: 2·(24 + 18) = 84 м. 2) Пролётов по 3 м: 84 : 3 = 28 (забор замкнут, поэтому пролётов столько же, сколько столбов). 3) Пролётов с досками: 28 − 1 = 27. 4) Досок: 27·10 = 270. Ответ: 270. Проверка: на каждой стороне 24 : 3 = 8 и 18 : 3 = 6 пролётов, всего 8 + 6 + 8 + 6 = 28."},

    {q:"Стены комнаты (прямоугольник 6 м на 4 м, высота 2,6 м) оклеивают обоями. Одну из коротких стен (длиной 4 м) красят, а остальные три стены оклеивают. Рулон имеет ширину 1 м и длину 10 м. Обои клеят вертикальными полосами высотой в стену (по 2,6 м), шириной 1 м. Остаток рулона короче 2,6 м выбрасывают. Один рулон стоит 800 рублей. Сколько рублей стоят обои?",
     o:["3200 рублей","4000 рублей","5600 рублей","4800 рублей"], a:3,
     e:["Так получится, если из рулона получается 4 полосы (10 : 2,5 = 4): 16 : 4 = 4 рулона. Но высота стены 2,6 м, и из 10 м выходит только 3 целые полосы (10 : 2,6 = 3 и остаток).","Так получится, если считать по площади: 16·2,6 = 41,6 м², 41,6 : 10 → 5 рулонов. Но полосы нельзя склеивать из обрезков, поэтому из каждого рулона выходит лишь 3 полосы, и рулонов нужно больше.","Так получится, если оклеить все четыре стены: 20 полос, 20 : 3 → 7 рулонов. Но одна короткая стена не оклеивается, полос нужно 16.",""],
     h:["Сколько полос шириной 1 м нужно на три стены? Потом выясни, сколько целых полос по 2,6 м получится из одного рулона длиной 10 м.","Узнай, сколько целых полос даёт один рулон. Раздели нужное число полос на это число и округли вверх."],
     s:"1) Длина трёх стен: 6 + 6 + 4 = 16 м, ширина полосы 1 м, значит нужно 16 полос. 2) Из рулона: 10 : 2,6 = 3 целых полосы (3·2,6 = 7,8 м, остаток 2,2 м выбрасывают). 3) Рулонов: 16 : 3 = 5 и остаток 1, поэтому нужно 6 рулонов. 4) Стоимость: 6·800 = 4800 рублей. Ответ: 4800 рублей. Проверка: 5 рулонов дают 15 полос, не хватает одной, 6 рулонов дают 18 полос."},

    {q:"Секция забора имеет длину 5 м 95 см. Её набирают из досок шириной 10 см. Между соседними досками оставляют зазор 5 см, а крайние доски стоят вплотную к краям секции. Сколько досок нужно на одну секцию?",
     n:40, m:{"39":"Так получится, если 595 : 15 = 39 и остаток 10 отбросить. Но остаток 10 см как раз и есть последняя доска: после последнего зазора нужна ещё доска, а зазора после неё нет.","59":"Так получится, если делить 595 см на 10 см, то есть не учитывать зазоры. Но 5 см между соседними досками тоже занимают место.","60":"Здесь 600 : 10 = 60: длина округлена и зазоры не учтены. Каждая доска, кроме последней, занимает вместе со своим зазором 15 см."},
     w:"Проверь: каждая доска вместе с зазором после неё занимает 10 + 5 = 15 см, а у последней доски зазора нет. Если добавить воображаемый зазор в конце, получится 595 + 5 = 600 см.",
     h:["Представь, что после каждой доски идёт зазор 5 см, в том числе и после последней. Какая получится длина?","Добавь 5 см к длине секции и раздели на то, сколько места занимают доска и её зазор вместе."],
     s:"1) Доска с зазором занимает 10 + 5 = 15 см. 2) Если добавить зазор после последней доски, длина станет 595 + 5 = 600 см. 3) Досок: 600 : 15 = 40. Ответ: 40. Проверка: 40 досок по 10 см = 400 см, зазоров на один меньше, 39 по 5 см = 195 см, 400 + 195 = 595 см."},

    {q:"Площадь прямоугольника равна 7 дм² 20 см². Одна из его сторон равна 8 см. Найди периметр этого прямоугольника. Ответ запиши в сантиметрах.",
     n:196, m:{"90":"Здесь найдена вторая сторона: 720 : 8 = 90 см. Но спрашивается периметр, то есть сумма всех сторон: 2·(90 + 8).","98":"Так получится, если найти полупериметр 90 + 8 = 98 см. Периметр — сумма всех четырёх сторон, поэтому полученное число нужно ещё умножить на 2.","1771":"Здесь принято 1 дм² = 1000 см², и площадь вышла 7020 см². Но в дециметре 10 см, а в квадратном дециметре 10·10 = 100 см², поэтому 7 дм² = 700 см²."},
     w:"Проверь: 1 дм² = 100 см²? Площадь переведена в см² (7 дм² 20 см² = 720 см²)? Найдена вторая сторона, потом периметр по формуле 2·(a + b)?",
     h:["Сначала запиши площадь в одних единицах — в квадратных сантиметрах. Сколько см² в 1 дм²?","Зная площадь и одну сторону, найди другую сторону делением. Потом посчитай периметр."],
     s:"1) 1 дм² = 10·10 = 100 см², значит 7 дм² 20 см² = 700 + 20 = 720 см². 2) Вторая сторона: 720 : 8 = 90 см. 3) Периметр: 2·(90 + 8) = 196 см. Ответ: 196. Проверка: 90·8 = 720 см²."},

    {q:"Коробка изнутри имеет размеры 40 см, 30 см и 20 см. В неё укладывают ровными рядами целые кубики с ребром 6 см (резать и ломать кубики нельзя, наклонять нельзя). Сколько кубиков поместится в коробке?",
     o:["111","90","140","120"], a:1,
     e:["Так получится, если объём коробки 24000 см³ разделить на объём кубика 216 см³: 24000 : 216 ≈ 111. Но кубики укладываются целыми рядами, и у каждой стены остаётся пустое место, в которое кубик не входит.","","Так получится, если у каждого ребра остаток округлён вверх: 7·5·4 = 140. Но если остаётся меньше 6 см, ещё один кубик не помещается, остаток нужно отбрасывать.","Здесь высота округлена вверх: 20 : 6 = 3 и остаток 2, поэтому по высоте помещается 3 кубика, а не 4. Получилось бы 6·5·4 = 120, но 4 кубика высотой 6 см составят 24 см > 20 см."],
     h:["Узнай, сколько кубиков с ребром 6 см укладывается вдоль каждого из трёх измерений коробки. Остаток меньше 6 см кубиком не заполнить.","Перемножь три найденных числа. Это число кубиков в одном слое, умноженное на число слоёв."],
     s:"1) Вдоль 40 см: 40 : 6 = 6 и остаток 4, значит 6 кубиков. 2) Вдоль 30 см: 30 : 6 = 5 кубиков. 3) Вдоль 20 см: 20 : 6 = 3 и остаток 2, значит 3 кубика. 4) Всего: 6·5·3 = 90. Ответ: 90. Проверка: 90 кубиков занимают 90·216 = 19440 см³ < 24000 см³, а 91-й кубик в остатки (4 см, 0 см, 2 см) не помещается."},

    {q:"Бассейн имеет форму прямоугольного параллелепипеда: длина 6 м, ширина 4 м, глубина 2 м. Его нужно наполнить водой до уровня на 20 см ниже верхнего края. Насос подаёт 1200 литров воды в час. Сколько часов он должен работать? (1 м³ = 1000 л)",
     n:36, m:{"40":"Так получится, если наполнить бассейн до самого верха: 6·4·2 = 48 м³ = 48000 л, 48000 : 1200 = 40 ч. Но уровень ниже края на 20 см, то есть вода занимает глубину 1 м 80 см.","43200":"Так получится, если остановиться на объёме воды 43200 л. Это количество воды, а время работы насоса — это 43200 : 1200.","43.2":"Здесь указан объём воды 43,2 м³ вместо времени. Нужно перевести в литры (43200 л) и разделить на подачу насоса 1200 л в час."},
     w:"Проверь: глубина воды 2 м − 20 см = 1 м 80 см? Объём в м³ переведён в литры? Литры разделены на 1200 л в час?",
     h:["Какая глубина у воды, если уровень на 20 см ниже верхнего края? Выразить её в метрах: 20 см = 0,2 м.","Найди объём воды как объём параллелепипеда с этой глубиной, переведи в литры и раздели на подачу насоса."],
     s:"1) Глубина воды: 2 − 0,2 = 1,8 м. 2) Объём воды: 6·4·1,8 = 43,2 м³. 3) 43,2 м³ = 43200 л. 4) Время: 43200 : 1200 = 36 ч. Ответ: 36. Проверка: 36·1200 = 43200 л = 43,2 м³."},

    {q:"В треугольнике ABC угол A равен 50°, а угол B на 30° больше угла C. Из вершины C проведена биссектриса CD (она делит угол C пополам), точка D лежит на стороне AB. Чему равен угол ADC?",
     o:["75°","80°","105°","155°"], a:2,
     e:["Так получится, если найден угол BDC: 180° − 80° − 25° = 75°. Но спрашивается угол ADC, который вместе с BDC составляет развёрнутый угол 180°, поэтому ADC = 180° − 75°.","Здесь взят угол B = 80°. Угол ADC — другой угол, он лежит в треугольнике ADC: его находят вычитанием из 180° углов A и ACD.","","Так получится, если из 180° вычтена только половина угла C (25°). В треугольнике ADC есть ещё угол A = 50°, его тоже нужно вычесть."],
     h:["Сначала найди углы B и C из суммы углов треугольника и разности 30°. Потом угол ACD — половина угла C.","Рассмотри треугольник ADC: в нём известны два угла, третий найдётся из суммы 180°."],
     s:"1) Сумма углов B и C: 180° − 50° = 130°. 2) Угол B на 30° больше C: 130° − 30° = 100°, 100° : 2 = 50°, значит C = 50°, B = 80°. 3) Угол ACD = 50° : 2 = 25°. 4) В треугольнике ADC: ADC = 180° − 50° − 25° = 105°. Ответ: 105°. Проверка: угол BDC = 180° − 80° − 25° = 75°, а 105° + 75° = 180° (развёрнутый угол)."},

    {q:"Сколько градусов составляет меньший угол между часовой и минутной стрелками в 3 часа 40 минут? Полный оборот стрелки — 360°, на циферблате 12 часов. Ответ запиши числом градусов.",
     n:130, m:{"150":"Так получится, если часовую стрелку считать стоящей ровно на цифре 3 (90°). За 40 минут она ещё продвинулась: 40·0,5° = 20°, и стоит на 110°.","230":"Здесь найден больший угол: 360° − 130° = 230°. Спрашивается меньший из двух углов между стрелками.","110":"Так получится, если ответом назвать положение часовой стрелки (3·30° + 20° = 110°). Нужен угол между стрелками, то есть разность положений минутной (240°) и часовой (110°)."},
     w:"Проверь: минутная стрелка на 40 мин стоит в 40·6° = 240° от цифры 12; часовая в 3 ч 40 мин в 3·30° + 40·0,5° = 110°; разность этих чисел — это угол между стрелками, но нужен меньший из двух.",
     h:["Отсчитай положение каждой стрелки в градусах от цифры 12: минутная — по 6° за минуту, часовая — по 30° за час и ещё по 0,5° за минуту.","Найди разность положений. Если она больше 180°, то меньший угол — это 360° минус разность."],
     s:"1) Минутная стрелка: 40·6° = 240°. 2) Часовая стрелка: 3·30° + 40·0,5° = 90° + 20° = 110°. 3) Разность: 240° − 110° = 130°. 4) 130° < 180°, значит это и есть меньший угол (больший 360° − 130° = 230°). Ответ: 130. Проверка: 130° + 230° = 360°."},

    {q:"Прямоугольник 36 см на 20 см режут так: отрезают от него наибольший возможный квадрат, затем от оставшегося прямоугольника снова отрезают наибольший возможный квадрат, и так до тех пор, пока весь прямоугольник не будет разрезан на квадраты. Найди сумму периметров всех получившихся квадратов в сантиметрах.",
     n:208, m:{"52":"Здесь найдена сумма сторон всех квадратов: 20 + 16 + 4 + 4 + 4 + 4 = 52 см. Периметр квадрата — это 4 стороны, поэтому сумму нужно умножить на 4.","144":"Так получится, если учтены только два больших квадрата: 4·(20 + 16) = 144. Остаток 4 см на 16 см тоже режется на квадраты: из него выходят ещё четыре квадрата 4 см на 4 см.","160":"Здесь периметры двух больших квадратов 80 и 64 сложены с периметром одного маленького 16: 80 + 64 + 16 = 160. Но маленьких квадратов четыре, а не один."},
     w:"Проверь: сначала отрезается квадрат 20 на 20, остаётся 16 на 20; потом квадрат 16 на 16, остаётся 4 на 16; потом сколько квадратов 4 на 4 помещается в 4 на 16? Затем периметр = 4 · сторона.",
     h:["Выполни разрезание по шагам и каждый раз записывай остаток. Первый квадрат — со стороной 20 см (меньшая сторона).","Когда остаток станет узким, посмотри, сколько одинаковых квадратов в него помещается. Потом сложи стороны всех квадратов и умножь на 4."],
     s:"1) Из 36 × 20 отрезаем квадрат 20 × 20, остаётся 16 × 20. 2) Из 16 × 20 отрезаем квадрат 16 × 16, остаётся 4 × 16. 3) Из 4 × 16 получается 16 : 4 = 4 квадрата 4 × 4, остатка нет. 4) Всего 6 квадратов, стороны 20, 16, 4, 4, 4, 4: их сумма 52 см. 5) Периметры: 4·52 = 208 см. Ответ: 208. Проверка: площади 400 + 256 + 4·16 = 720 = 36·20."},

    {q:"Деревянный куб с ребром 5 см покрасили снаружи со всех шести сторон, а затем распилили на маленькие кубики с ребром 1 см. Сколько среди них кубиков, у которых окрашено не более одной грани (то есть вовсе не окрашенных и с одной окрашенной гранью)?",

    {q:"Развёрнутый угол AOB (стороны OA и OB лежат на одной прямой, угол равен 180°) разделён лучом OC на два угла: AOC и COB. Угол AOC на 36° больше угла COB. Проведены биссектрисы углов AOC и COB: лучи OM и ON. Найди угол MON.",

     h:["Сначала найди углы AOC и COB: их сумма 180°, а разница 36°. Потом найди, какую часть образуют их половины.","Угол MON составлен из MOC и CON, это половины двух углов AOC и COB. Сложи их."],
     s:"1) AOC + COB = 180°, AOC − COB = 36°. Меньший угол: (180° − 36°) : 2 = 72° (COB), больший 72° + 36° = 108° (AOC). 2) MOC = 108° : 2 = 54°, CON = 72° : 2 = 36°. 3) MON = 54° + 36° = 90°. Ответ: 90°. Идея-проверка: MON — половина AOC плюс половина COB, то есть половина от 180°, и значит 90° при любой разности."}
  ]

        "Три взвешивания различают не больше 27 монет. Сравни это число с 28 и подумай, хватит ли четырёх. Как разделить 28 монет на три кучки при первом взвешивании?"],
     s:"У взвешивания три исхода: перевесила левая, перевесила правая или равенство. За 3 взвешивания можно различить не более 3 × 3 × 3 = 27 случаев, а монет 28, значит, трёх мало. Четырёх достаточно: разложим монеты на кучки 9, 9 и 10 и взвесим две по 9. Фальшивая окажется в лёгкой кучке или в отложенной (не больше 10 монет). Из 10 монет за три взвешивания находим фальшивую: 3 × 3 × 3 = 27 больше 10. Ответ: 4."},
    {q:"Волшебнику нужно отмерить ровно 4 литра зелья для дракона. У него есть два пустых сосуда без делений на 5 и на 3 литра и котёл, в котором зелья сколько угодно. Разрешённые действия: наполнить сосуд из котла до краёв, вылить всё из сосуда обратно в котёл, перелить из одного сосуда в другой (пока второй не наполнится или первый не опустеет). Какое наименьшее число действий нужно, чтобы в одном из сосудов оказалось ровно 4 литра?",
     n:6, m:{"8":"Это количество действий в более длинном пути, который начинается с наполнения малого сосуда. Есть путь короче: начни с большого сосуда.","4":"Это число литров зелья, а спрашивается число действий.","7":"Это больше, чем нужно: найдётся путь из 6 действий. Наполни большой сосуд, а малый используй для отмеривания."},
     w:"Выписывай по порядку состояния сосудов (сколько литров в большом и в малом) после каждого действия и ищи самый короткий путь до 4 литров.",
     h:["Запиши состояние в виде пары (литров в большом; литров в малом). Начни с наполнения большого сосуда, потом перелей из него в малый.",
        "После первого переливания будет пара (2; 3). Дальше вылей малый сосуд и перелей остаток. Как получить в большом ровно 4?"],
     s:"Пары (большой; малый): начало (0; 0). 1) Наполнили большой: (5; 0). 2) Перелили в малый: (2; 3). 3) Вылили малый: (2; 0). 4) Перелили 2 литра в малый: (0; 2). 5) Снова наполнили большой: (5; 2). 6) Доливаем малый до 3 литров, берём из большого 1 литр: (4; 3). В большом ровно 4 литра. Перебор всех состояний показывает, что быстрее нельзя. Ответ: 6 действий."},
    {q:"Столяр склеил куб 5 × 5 × 5 из одинаковых маленьких кубиков и покрасил весь большой куб снаружи. Потом куб разобрали на маленькие кубики. Сколько маленьких кубиков оказались покрашены ровно с одной стороны?",
     n:54, m:{"150":"Так посчитаны все кубики на гранях: 6 × 25. Но среди них есть кубики на рёбрах и в углах, у них покрашено две и три стороны.","96":"Здесь на каждой грани взят квадрат 4 × 4 (число 5 − 1 вместо 5 − 2). Кубики не должны находиться на краю грани: убирать надо и первый, и последний ряд.","36":"Это число кубиков с двумя покрашенными сторонами (12 рёбер × 3 средних кубика). А нужны кубики ровно с одной покрашенной стороной."},
     w:"Кубик с одной покрашенной стороной лежит на грани, но не на её краю. Найди, сколько таких на одной грани, и умножь на число граней.",
     h:["На одной грани 5 × 5 кубиков. Какие из них касаются ребра и потому покрашены ещё с одной стороны?",
        "Крайние ряды убираем со всех четырёх сторон грани. Какой квадрат останется? Потом умножь на число граней куба."],
     s:"На каждой грани 5 × 5 = 25 кубиков. Кубики первого и последнего ряда лежат на рёбрах, у них покрашено две или три стороны. Остаётся квадрат (5 − 2) × (5 − 2) = 3 × 3 = 9 кубиков с одной покрашенной стороной. Граней 6: 6 × 9 = 54. Проверка: всего 125 кубиков = 54 + 36 (две стороны) + 8 (три стороны) + 27 (не покрашены). Ответ: 54."},
    {q:"В кабинете принцессы разбили вазу. Виноват ровно один из четырёх: Аня, Боря, Вика или Гена. Аня сказала: «Вазу разбил Боря». Боря сказал: «Вазу разбила Вика». Вика сказала: «Боря говорит неправду». Гена сказал: «Это не я». Известно, что правдивым оказалось ровно одно высказывание. Кто разбил вазу?",
     o:["Аня","Боря","Вика","Гена"], a:3,
     e:["Если виновата Аня, то правдивы слова Вики (Боря сказал неправду) и Гены («Это не я»). Получаются два правдивых высказывания, а должно быть одно.",
        "Если виноват Боря, то правдивы слова Ани, Вики (Боря соврал, его слова о Вике ложны) и Гены. Это три правдивых высказывания, а должно быть одно.",
        "Если виновата Вика, то правдивы слова Бори и Гены. Получаются два правдивых высказывания, а должно быть одно.",
        ""],
     h:["Предположи, что виновата Аня, и посчитай, сколько из четырёх высказываний при этом правдивы. Потом так же проверь Борю, Вику и Гену.",
        "Заметь: если слова Бори правдивы, то слова Вики ложны, и наоборот. Подсчитывай правдивые высказывания в каждом из четырёх случаев."],
     s:"Проверим виновных по очереди. Аня: правдивы Вика и Гена (2). Боря: правдивы Аня, Вика, Гена (3). Вика: правдивы Боря и Гена (2). Гена: слова Ани ложны, слова Бори ложны, Вика говорит правду (Боря соврал), Гена соврал, значит правдиво только одно высказывание. Условие выполняется только в этом случае. Ответ: Гена."},
    {q:"Из карточек с цифрами 0, 1, 2, 3, 4 составляют трёхзначные числа так, чтобы цифры в числе не повторялись (каждую карточку берут не более одного раза). Сколько среди таких чисел чётных?",
     n:30, m:{"48":"Это количество всех таких трёхзначных чисел (4 × 4 × 3), а не только чётных.","36":"Здесь выбраны три варианта последней цифры (0, 2, 4), а затем 4 × 3 для остальных. Но тогда в счёт попали числа, начинающиеся с нуля, вроде 012. Они не трёхзначные.","12":"Здесь учтены только числа, оканчивающиеся на 0. Но чётными бывают и числа на 2 и на 4."},
     w:"Раздели числа по последней цифре: 0, 2 или 4. Для каждого случая посчитай, сколько вариантов у первой и средней цифры (первая не нуль).",
     h:["Число чётное, если оканчивается на 0, 2 или 4. Разбери эти три случая отдельно.",
        "Если последняя цифра 0, остальные две выбираются из 1, 2, 3, 4. Если последняя 2 или 4, то первая цифра не нуль и не последняя. Сколько вариантов у каждой цифры?"],
     s:"Последняя цифра 0: на первое место 4 цифры (1, 2, 3, 4), на второе 3 оставшиеся, всего 4 × 3 = 12. Последняя 2: первая цифра не нуль и не 2, значит 3 варианта (1, 3, 4); вторая цифра из трёх оставшихся (с нулём) тоже 3 варианта, всего 3 × 3 = 9. Последняя 4: аналогично 9. Итого 12 + 9 + 9 = 30. Ответ: 30."},
    {q:"Код от сундука с сокровищами — натуральное число. Все цифры кода различны, а их сумма равна 30. Волшебник знает, что это наименьшее число, которое подходит под такие условия. Найди код.",
     n:6789, m:{"9876":"Цифры подходят (9 + 8 + 7 + 6 = 30), но это наибольшее число из этих цифр. Нужно наименьшее.","6798":"Цифры верные, но расположены не лучшим образом. Чем меньше число, тем меньше цифра в старшем разряде и дальше по порядку.","3999":"Сумма цифр 30, но цифра 9 повторяется три раза, а по условию цифры различны."},
     w:"Сначала выясни, сколько цифр должно быть в числе: у числа из меньшего числа цифр значение меньше. Затем упорядочи цифры по возрастанию.",
     h:["Чем меньше цифр в числе, тем оно меньше. Какую наибольшую сумму дают три различные цифры?",
        "Три различные цифры дают не больше 9 + 8 + 7. Проверь, хватит ли этого для суммы 30, и подумай, какие четыре различные цифры дадут 30."],
     s:"Три различные цифры дают не больше 9 + 8 + 7 = 24, поэтому цифр не меньше четырёх. Четыре различные цифры дают не больше 9 + 8 + 7 + 6 = 30, поэтому должны быть именно цифры 6, 7, 8, 9. Наименьшее число из этих цифр: 6789. Проверка: 6 + 7 + 8 + 9 = 30. Ответ: 6789."},
    {q:"В некотором месяце три воскресенья пришлись на чётные числа. Каким днём недели было 20-е число этого месяца?",
     o:["Среда","Четверг","Пятница","Суббота"], a:1,
     e:["Среда была 19-го числа. До 20-го ещё один день: 16-е воскресенье, 17-е понедельник, 18-е вторник, 19-е среда, 20-е четверг.",
        "",
        "Пятница приходится на 21-е число, а не на 20-е. От воскресенья 16-го числа считай: понедельник 17-е, вторник 18-е, среда 19-е, четверг 20-е.",
        "Суббота приходится на 22-е число. От воскресенья 16-го числа 20-е число наступает через 4 дня."],
     h:["Воскресенья идут через 7 дней, значит, чётные и нечётные числа в них чередуются. Подумай, какое самое раннее воскресенье может быть при трёх чётных.",
        "Чтобы воскресений было три чётных, они должны быть числами 2, 16 и 30. Теперь посчитай, сколько дней от воскресенья 16-го до 20-го."],
     s:"Воскресенья отстоят друг от друга на 7 дней, поэтому их числа по очереди чётные и нечётные. Три чётных воскресенья возможны только при воскресеньях 2, 9, 16, 23 и 30 числа: чётные 2, 16, 30. Если первое воскресенье было 4-го, то в месяце только 4, 11, 18, 25 и чётных воскресений два. 16-е воскресенье, 17-е понедельник, 18-е вторник, 19-е среда, 20-е четверг. Ответ: четверг."},
    {q:"Дракон хранит клад: монет в нём не больше 100. Если раскладывать их в мешочки по 3 монеты, останется 2 монеты. Если раскладывать по 4, останется 3 монеты. Если раскладывать по 5, останется 4 монеты. Сколько монет в кладе?",
     n:59, m:{"119":"Это следующее подходящее число (59 + 60), но по условию монет не больше 100.","60":"Это число делится на 3, 4 и 5 без остатка. А по условию остатки 2, 3 и 4, на 1 меньше делителя: нужно число на 1 меньше.","11":"11 подходит для мешочков по 3 (остаток 2) и по 4 (остаток 3), но при делении на 5 остаток равен 1, а нужен 4."},
     w:"Заметь, что остаток всегда на 1 меньше делителя: если добавить одну монету, всё разделится без остатка.",
     h:["Какой остаток при делении на 3 даёт 2, на 4 даёт 3, на 5 даёт 4? Сравни остаток с делителем.",
        "Если к числу добавить 1, то оно разделится нацело на 3, на 4 и на 5. Найди наименьшее такое число, а потом вычти 1."],
     s:"Остаток всегда на 1 меньше делителя, значит, если добавить к кладу одну монету, число разделится нацело на 3, на 4 и на 5. Наименьшее общее кратное 3, 4 и 5 равно 60, следующее 120. Тогда монет 60 − 1 = 59 (или 119, что больше 100). Проверка: 59 = 3 × 19 + 2 = 4 × 14 + 3 = 5 × 11 + 4. Ответ: 59."},
    {q:"Между двумя сёлами 60 км. Одновременно навстречу друг другу выехали два велосипедиста: один со скоростью 12 км/ч, другой 18 км/ч. Вместе с первым вылетела пчела со скоростью 35 км/ч. Она летит ко второму велосипедисту, долетает, разворачивается и летит обратно к первому, потом снова ко второму, и так до тех пор, пока велосипедисты не встретятся. Сколько километров всего пролетела пчела?",
     n:70, m:{"2":"Это время в часах, через которое велосипедисты встретятся. А спрашивается путь пчелы: время нужно умножить на скорость пчелы.","60":"Это всё расстояние между сёлами. Пчела летит быстрее велосипедистов, но летает туда-обратно, и её путь зависит от скорости и времени.","350":"Здесь время получено делением расстояния на разность скоростей (60 : 6 = 10 ч), но велосипедисты едут навстречу друг другу, и скорости надо складывать."},
     w:"Не пытайся считать каждый перелёт пчелы. Найди, сколько времени велосипедисты едут до встречи, и столько же времени летит пчела.",
     h:["Пчела летает всё время, пока велосипедисты едут. Значит, нужно знать только время до их встречи.",
        "Велосипедисты едут навстречу, поэтому скорость сближения равна сумме скоростей. Найди время встречи, потом умножь на скорость пчелы."],
     s:"Скорость сближения велосипедистов: 12 + 18 = 30 км/ч. До встречи проходит 60 : 30 = 2 часа. Всё это время пчела летит со скоростью 35 км/ч: 35 × 2 = 70 км. Считать отдельные перелёты не нужно. Ответ: 70."},
    {q:"Королевский математик перемножил 2026 чисел, каждое из которых равно 7: 7 × 7 × 7 × … × 7. На какую цифру оканчивается это произведение? Ответ запиши цифрой.",
     n:9, m:{"7":"Так будет, если взять только первую степень. Цифры на конце повторяются по кругу: 7, 9, 3, 1, и нужно определить место 2026-й степени в этом круге.","3":"Это цифра 3-й степени (7 × 7 × 7 = 343). А 2026 при делении на 4 даёт остаток 2, то есть вторая цифра в круге.","1":"Это цифра при остатке 0, то есть для 4-й, 8-й степени. Но 2026 при делении на 4 даёт остаток 2, а не 0."},
     w:"Выпиши последние цифры первых степеней числа 7 и найди закономерность. Дальше определи, на каком месте в этом ряду стоит 2026-я степень.",
     h:["Последняя цифра произведения зависит только от последних цифр множителей. Выпиши последние цифры у 7, 7 × 7, 7 × 7 × 7 и так далее.",
        "Последние цифры идут по кругу из четырёх. Найди остаток от деления 2026 на 4 и определи, какая цифра на этом месте."],
     s:"Последние цифры степеней числа 7: 7¹ = 7, 7² = 49 (9), 7³ = 343 (3), 7⁴ = 2401 (1), 7⁵ оканчивается на 7, и дальше всё повторяется по кругу из 4 цифр: 7, 9, 3, 1. 2026 : 4 = 506 и остаток 2, значит, последняя цифра такая же, как у второй степени: 9. Ответ: 9."},
    {q:"На доске написаны числа 1, 2, 3, …, 10. За один ход можно стереть любые два числа и записать вместо них модуль (положительную величину) их разности, например 7 и 3 заменяются на 4, а два равных числа на 0. После 9 ходов на доске останется одно число. Какое из чисел может оказаться последним?",
     o:["7","0","4","10"], a:0,
     e:["",
        "При замене двух чисел a и b на их разность чётность суммы всех чисел не меняется (a + b и a − b одной чётности). Сумма 1 + … + 10 = 55 нечётная, поэтому последнее число нечётное, а 0 чётное.",
        "Число 4 чётное, а чётность суммы после каждого хода сохраняется: исходная сумма 55 нечётная, значит, последнее число нечётное.",
        "Число 10 чётное. Сумма всех чисел меняется на чётную величину при каждом ходе, исходная сумма 55 нечётная, поэтому последнее число нечётное."],
     h:["Посмотри, как меняется чётность суммы всех чисел на доске, когда два числа a и b заменяются на их разность. Сравни a + b и a − b.",
        "Чётность суммы не меняется. Какая чётность у суммы 1 + … + 10, значит, какое число может остаться? Потом из нечётных вариантов проверь, получится ли он на деле."],
     s:"Замена a и b на разность a − b меняет сумму на 2b, то есть на чётное число, поэтому чётность суммы остаётся. Вначале 1 + 2 + … + 10 = 55 нечётно, значит, последнее число нечётное. Чётные 0, 4 и 10 исключены. Число 7 получить можно: 2−1=1, 3−1=2, 4−2=2, 5−2=3, 6−3=3, 7−3=4, 9−4=5, 8−5=3, 10−3=7. Ответ: 7."},
    {q:"На острове живут рыцари (всегда говорят правду) и лжецы (всегда лгут). Двенадцать жителей стоят в ряд. Первый сказал: «Среди нас ровно 1 лжец». Второй сказал: «Среди нас ровно 2 лжеца». Третий сказал: «Среди нас ровно 3 лжеца». И так далее: двенадцатый сказал: «Среди нас ровно 12 лжецов». Сколько среди них лжецов?",
     n:11, m:{"12":"Если лжецов 12, то двенадцатое высказывание правдиво. Но тогда двенадцатый рыцарь, а лжецов не 12. Противоречие.","1":"Если лжец один, то рыцарей 11, но правдивым при этом может быть только одно высказывание (первое). Остальные 10 рыцарей говорили бы неправду. Противоречие.","6":"Если лжецов 6, то правдиво только шестое высказывание и рыцарь один, а все остальные 11 лжецы. Но тогда лжецов 11, а не 6. Противоречие."},
     w:"Все высказывания противоречат друг другу, поэтому не больше одного из них правдиво. Подумай, может ли быть правдивых ноль, и сколько тогда лжецов.",
     h:["Двенадцать высказываний говорят о разном числе лжецов, поэтому два из них не могут быть правдивыми одновременно. Сколько рыцарей может быть?",
        "Допусти, что правдивых нет, и получи противоречие. Тогда рыцарь один, и остальные 11 лжецы. Проверь, что тогда его слова верны."],
     s:"Числа лжецов в высказываниях все разные, поэтому правдивым может быть не больше одного. Если все лгут, то лжецов 12, но тогда двенадцатое высказывание правдиво. Противоречие. Значит, правдиво ровно одно высказывание, рыцарь один, а лжецов 11. Тогда правдиво одиннадцатое высказывание: его сказал рыцарь, а остальные 11 лгут, что и должно быть. Ответ: 11."},
    {q:"Какое наибольшее число королей можно поставить на шахматную доску 8 × 8 так, чтобы никакие два не били друг друга? Король бьёт все соседние клетки, в том числе по диагонали. Ответ запиши числом.",

     h:["Раскрась доску как шахматную. Какого цвета вырезанные угловые клетки? Сколько клеток каждого цвета осталось?",

     s:"Клетки a1 и h8 одного цвета (углы по диагонали). Остаётся 30 клеток этого цвета и 32 другого. Каждая кость закрывает по одной клетке каждого цвета, значит, костей не больше 30. Пример на 30: строки со 2-й по 7-ю укладываем горизонтальными костями (6 × 4 = 24 кости); в первой строке (без a1) кладём кости на b1–c1, d1–e1, f1–g1; в восьмой (без h8) кладём на a8–b8, c8–d8, e8–f8. Итого 24 + 3 + 3 = 30. Ответ: 30."}
