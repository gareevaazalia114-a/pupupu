<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Волшебная математика</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Макет «Солнечный остров»: голубое небо, зелёные холмы, толстые контуры и жёсткие тени; сверху панель героя, внизу меню */
:root{
  --sky1:#7fd6ff; --sky2:#dff7ff; --grass:#5ccf6e; --grass2:#3db25a;
  --ink:#12303f; --soft:#4b6a7a; --card:#fff; --line:#12303f;
  --sun:#ffcf3f; --sun-ink:#3a2a00; --coral:#ff6b57; --mint:#2bb673; --bad:#e0435f; --lilac:#8c7bff;
  --ok-bg:#d6f6e4; --bad-bg:#ffdde3; --hint-bg:#dff3ff; --sol-bg:#eee8ff;
  --bw:3px; --rad:18px; --shadow:4px 4px 0 var(--line);
  --font:"Rubik","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 60%,#cdf3d2 100%) fixed,var(--sky1);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;font-weight:500}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
h1,h2,h3{font-family:var(--font);font-weight:800;margin:0;line-height:1.1;text-wrap:balance}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(circle at 93% 7%,#ffe46b 0 44px,transparent 45px),
   radial-gradient(ellipse 60% 120px at 8% 104%,var(--grass) 0 97%,transparent 100%),
   radial-gradient(ellipse 70% 150px at 92% 106%,var(--grass2) 0 97%,transparent 100%)}
.sky.two{background:
   radial-gradient(ellipse 90px 24px at 14% 12%,#fff 0 60%,transparent 62%),
   radial-gradient(ellipse 70px 20px at 20% 14.5%,#fff 0 60%,transparent 62%),
   radial-gradient(ellipse 110px 28px at 58% 9%,#fff 0 60%,transparent 62%),
   radial-gradient(ellipse 80px 22px at 66% 11.5%,#fff 0 60%,transparent 62%);
  animation:drift 40s linear infinite alternate}
@keyframes drift{to{transform:translateX(5vw)}}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* кнопки и плашки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:var(--bw) solid var(--line);border-radius:999px;padding:8px 20px;min-height:46px;font-weight:800;background:var(--sun);color:var(--sun-ink);box-shadow:var(--shadow);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--line)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.btn.ghost{background:rgba(255,255,255,.85);color:var(--ink)}
.btn.soft{background:#fff;color:var(--ink)}
.btn.lack{background:#dbe6ec;color:#5b7a8a}
.btn.on{background:var(--mint);color:#fff}
.btn[disabled]{opacity:.6;cursor:default;transform:none}
.linkbtn{background:none;border:0;color:var(--soft);text-decoration:underline;padding:4px 0;font-size:.85rem}
.ic{width:18px;height:18px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:var(--bw) solid var(--line);border-radius:999px;padding:3px 14px 3px 8px;font-weight:800;box-shadow:var(--shadow);color:var(--ink)}
.pill svg{width:22px;height:22px;flex:none}
.pill b{font-variant-numeric:tabular-nums}
.pill.pulse{animation:pulse .5s}
@keyframes pulse{50%{transform:scale(1.18)}}

/* верхняя панель */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.me{display:flex;align-items:center;gap:10px;font-weight:800;min-width:0}
.me b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.avatar{width:52px;height:auto;border:var(--bw) solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow)}
.pills{display:flex;gap:10px;flex-wrap:wrap}

/* нижнее меню */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:var(--bw) solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav[hidden]{display:none}
.navin{max-width:980px;margin:0 auto;display:flex;gap:8px}
.nav button{flex:1;min-width:0;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:var(--bw) solid transparent;border-radius:16px;background:transparent;color:var(--soft);font-weight:800;font-size:.8rem}
.nav button svg{width:26px;height:26px;fill:currentColor}
.nav button.on{background:var(--coral);color:#fff;border-color:var(--line)}

/* главная */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:end;padding-top:8px;padding-bottom:150px}
.hero>div{position:relative;z-index:1}
.hero h1{font-size:clamp(2.4rem,7.5vw,4.4rem);color:#fff;-webkit-text-stroke:2px var(--line);paint-order:stroke fill;text-shadow:4px 4px 0 var(--line)}
.hero .lead{margin:12px 0 0;font-weight:700;max-width:34ch}
.castle{position:absolute;left:0;right:0;bottom:0;width:100%;height:160px;pointer-events:none}
.stagebox{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:0}
.bubble{background:#fff;border:var(--bw) solid var(--line);border-radius:var(--rad) var(--rad) 4px var(--rad);box-shadow:var(--shadow);padding:10px 14px;font-weight:700;max-width:340px}
.bubble p{margin:0}
.bubble .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.bubble input{flex:1 1 120px;min-width:0;min-height:44px;border:var(--bw) solid var(--line);border-radius:12px;padding:6px 10px;background:#fff}
.herochar{width:min(44vw,180px);height:auto;filter:drop-shadow(0 8px 6px rgba(18,48,63,.35));animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%;margin-right:8px}
@keyframes bob{50%{transform:translateY(-6px)}}
.bob{animation:fly 2s ease-in-out infinite alternate}
@keyframes fly{to{transform:translate(.6px,-1.2px)}}
.stats{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:#fff;border:var(--bw) solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);padding:10px 16px;margin-bottom:22px;position:relative;z-index:1}
.stats b{color:var(--coral)}
.meter{flex:1 1 180px;height:16px;border:var(--bw) solid var(--line);border-radius:99px;background:#e8f1f5;overflow:hidden}
.meter i{display:block;height:100%;background:var(--sun);border-right:var(--bw) solid var(--line);transition:width .6s}
.sect{font-size:1.7rem;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,225px),1fr));gap:16px}
.tile{text-align:left;border:var(--bw) solid var(--line);border-radius:var(--rad);background:#fff;color:var(--ink);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
.tile:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--line)}
.glyph{width:58px;height:58px;border-radius:50%;border:var(--bw) solid var(--line);display:grid;place-items:center;font-weight:800;font-size:1.25rem;color:#fff;background:var(--c,var(--lilac));text-shadow:0 2px 0 rgba(0,0,0,.25)}
.tile h3{font-size:1.2rem}
.tile p{margin:0;font-size:.9rem;color:var(--soft);font-weight:500}
.dots{display:flex;gap:4px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.dots i{width:11px;height:11px;border-radius:3px;border:2px solid var(--line);background:#fff}
.dots i.s1{background:#ffb4a8}.dots i.s2{background:var(--sun)}.dots i.s3{background:var(--mint)}
.tile small{font-weight:700;color:var(--soft)}
.tile.royal{grid-column:1/-1;flex-direction:row;align-items:center;gap:16px;background:var(--sun);flex-wrap:wrap}
.tile.royal .glyph{background:var(--lilac);width:68px;height:68px;font-size:1.8rem}
.tile.royal .txt{flex:1 1 220px;min-width:0}
.tile.royal p,.tile.royal small{color:var(--sun-ink)}
.tile.royal .dots{margin:0 0 4px}

/* задачи */
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.bar h2{font-size:clamp(1.4rem,4.5vw,2rem);flex:1 1 200px;min-width:0}
.lane{position:relative;margin:4px 0 16px;padding-top:56px}
.stones{display:flex;gap:4px}
.stones i{flex:1;min-width:0;height:24px;border:2px solid var(--line);border-radius:7px;background:#fff;box-shadow:0 3px 0 var(--line);font-style:normal;font-weight:800;font-size:.75rem;display:grid;place-items:center;color:var(--soft)}
.stones i.done{background:var(--sun);color:var(--sun-ink)}
.stones i.now{background:var(--coral);color:#fff}
.hopper{position:absolute;top:0;width:58px;transform:translateX(-50%);transition:left .55s cubic-bezier(.3,1.35,.5,1);pointer-events:none}
.hopper svg{width:100%;height:auto;display:block}
.hopper.hop svg{animation:hop .55s}
@keyframes hop{35%{transform:translateY(-26px)}}
details.cheat{background:#fff;border:var(--bw) solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);padding:10px 14px;margin-bottom:16px}
details.cheat summary{font-weight:800;cursor:pointer}
details.cheat ul{margin:8px 0 2px;padding-left:20px}
details.cheat li{margin:4px 0}
.card{background:#fff;border:var(--bw) solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);padding:20px}
.card .no{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.q{font-size:1.12rem;font-weight:600;margin:6px 0 16px;max-width:62ch}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:52px;padding:8px 14px;border:var(--bw) solid var(--line);border-radius:14px;background:#fff;font-weight:700;transition:transform .1s,background .1s}
.opt:hover:not([disabled]){background:#fff6d6;transform:translateX(3px)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--sun);color:var(--sun-ink);font-weight:800;font-size:.85rem}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.right{background:var(--ok-bg);border-color:var(--mint)}
.opt[disabled]{cursor:default}
.ansrow{display:flex;gap:10px;flex-wrap:wrap}
.ansrow input{flex:1 1 160px;min-width:0;min-height:52px;border:var(--bw) solid var(--line);border-radius:14px;padding:6px 14px;font-size:1.2rem;font-weight:800;background:#fff}
.say{display:flex;gap:10px;align-items:flex-start;margin-top:14px;border:2px dashed var(--line);border-radius:14px;padding:10px 12px}
.say svg{flex:none;width:42px;height:auto;border:2px solid var(--line);border-radius:10px;background:#fff}
.say b{display:block;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase}
.say p{margin:2px 0 0;font-weight:500}
.say.hint{background:var(--hint-bg)}.say.bad{background:var(--bad-bg)}.say.bad b{color:var(--bad)}
.say.ok{background:var(--ok-bg)}.say.ok b{color:#0d7a4c}.say.sol{background:var(--sol-bg)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.acts .spacer{flex:1}
.stars{display:inline-flex;gap:3px;vertical-align:middle}
.stars svg{width:24px;height:24px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;margin:0 .15em;font-size:.9em}
.fr i{font-style:normal;padding:0 .25em}
.fr i:first-child{border-bottom:.09em solid currentColor}
.spark{position:fixed;width:13px;height:13px;pointer-events:none;z-index:50;background:var(--sun);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:pop .9s ease-out forwards}
@keyframes pop{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) scale(.2) rotate(160deg);opacity:0}}
.result{text-align:center;display:grid;gap:12px;justify-items:center}
.result h2{font-size:2.2rem}
.result .pv{width:150px;height:auto}
.result .stars svg{width:44px;height:44px}
.result .acts{justify-content:center}
.rewards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* магазин и мой герой */
.tabs{display:flex;gap:8px;margin:12px 0 14px}
.tab{flex:1;min-height:46px;border:var(--bw) solid var(--line);border-radius:14px;background:#fff;font-weight:800;box-shadow:var(--shadow)}
.tab.on{background:var(--sun);color:var(--sun-ink)}
.note{min-height:1.6em;margin:0 0 8px;font-weight:800}
.slot{font-size:1.3rem;margin:18px 0 8px}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px}
.item{background:#fff;border:var(--bw) solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;min-width:0}
.item.have{box-shadow:4px 4px 0 var(--mint)}
.item .pv,.bigpv{width:100%;height:auto;background:linear-gradient(180deg,#bfe9ff,#eafcff 70%,#a9e6a0 70%);border-radius:12px}
.item .pv{max-width:136px}
.item b{font-size:.95rem;line-height:1.2;min-height:2.4em;display:flex;align-items:center}
.item .btn{width:100%;padding:6px 10px;font-size:.9rem;min-height:42px}
.stagecard{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:16px;align-items:center;background:#fff;border:var(--bw) solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);padding:16px;margin:12px 0 4px}
.stagecard h2{font-size:2rem}
.stagecard p{margin:6px 0 12px;color:var(--soft)}
.slotrow h3{font-size:.85rem;letter-spacing:.07em;text-transform:uppercase;margin:14px 0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 10px}
.chip{flex:none;width:96px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;border:var(--bw) solid var(--line);border-radius:14px;background:#fff;padding:6px 4px;font-size:.78rem;font-weight:700;line-height:1.15;text-align:center;box-shadow:3px 3px 0 var(--line)}
.chip.on{background:var(--sun)}
.chip svg{width:68px;height:auto;border-radius:8px}
.chip .no{height:48px;display:grid;place-items:center;font-size:1.6rem;color:var(--soft)}

@media (max-width:700px){
  .hero{grid-template-columns:1fr;padding-bottom:130px}
  .stagebox{align-items:flex-start}
  .herochar{margin:0}
  .card{padding:16px}
  .stagecard{grid-template-columns:1fr}
  .bigpv{max-width:220px;margin:0 auto}
}
@media (prefers-reduced-motion:reduce){
  .sky.two,.herochar,.bob,.pill.pulse,.hopper.hop svg{animation:none}
  .tile,.opt,.btn,.meter i{transition:none}
  .hopper{transition:none}
  .spark{display:none}
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div class="sky two" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gStar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2b0"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
    <symbol id="star" viewBox="0 0 24 24"><path d="M12 1.8l2.9 6.6 7.1.7-5.4 4.8 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.1l7.1-.7z" fill="url(#gStar)" stroke="#b97800" stroke-width="1" stroke-linejoin="round"/></symbol>
    <symbol id="starOff" viewBox="0 0 24 24"><path d="M12 1.8l2.9 6.6 7.1.7-5.4 4.8 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.1l7.1-.7z" fill="#d9ceb0" stroke="#b9ad88" stroke-width="1" stroke-linejoin="round"/></symbol>
    <symbol id="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#e0a21b" stroke="#9a6a00" stroke-width="1.5"/><circle cx="12" cy="12" r="7" fill="#ffd166"/><path d="M12 7l1.5 3.2 3.4.4-2.5 2.3.7 3.4L12 14.6 8.9 16.3l.7-3.4-2.5-2.3 3.4-.4z" fill="#e0a21b"/></symbol>
    <symbol id="fairy" viewBox="0 0 100 100">
      <ellipse cx="22" cy="46" rx="16" ry="9" fill="#c9f1ff" opacity=".85" transform="rotate(-25 22 46)"/>
      <ellipse cx="78" cy="46" rx="16" ry="9" fill="#c9f1ff" opacity=".85" transform="rotate(25 78 46)"/>
      <path d="M50 6l11.5 25.5 27.5 3-20.5 18.5 6 27.5L50 67.500 25.500 80.500l6-27.500L11 34.500l27.500-3z" fill="url(#gStar)" stroke="#b97800" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="42" cy="46" r="3.600" fill="#3a2600"/><circle cx="58" cy="46" r="3.600" fill="#3a2600"/>
      <circle cx="37" cy="54" r="3.500" fill="#ff9ec4" opacity=".8"/><circle cx="63" cy="54" r="3.500" fill="#ff9ec4" opacity=".8"/>
      <path d="M43 55q7 7 14 0" fill="none" stroke="#3a2600" stroke-width="2.600" stroke-linecap="round"/>
      <path d="M72 14l14-10M86 4l2 7 7 2" fill="none" stroke="#7b5be0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>
<main class="wrap" id="app"></main>
<nav class="nav" id="nav" aria-label="Разделы" hidden></nav>
<script>
const TOPICS=[];
/* Блочные (воксельные) герои, питомцы и наряды. Всё нарисовано прямоугольниками с лёгкой «объёмной» тенью. */
var GOLD="#ffd166";
function box(x,y,w,h,c,flat){
  var s='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>';
  if(!flat){
    var t=Math.min(.35,h/3),r=Math.min(.45,w/3);
    s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+t+'" fill="#fff" opacity=".26"/>';
    s+='<rect x="'+(x+w-r)+'" y="'+y+'" width="'+r+'" height="'+h+'" fill="#000" opacity=".15"/>';
  }
  return s;
}
function flat(x,y,w,h,c,op){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"'+(op?' opacity="'+op+'"':'')+'/>';}
function poly(p,c,op){return '<polygon points="'+p+'" fill="'+c+'"'+(op?' opacity="'+op+'"':'')+'/>';}
function ell(cx,cy,rx,ry,c,op,rot){return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+c+'"'+(op?' opacity="'+op+'"':'')+(rot?' transform="rotate('+rot+' '+cx+' '+cy+')"':'')+'/>';}
function eyes(c){c=c||"#2a1a3a";return flat(5.9,5,1.1,1.6,c)+flat(9,5,1.1,1.6,c)+flat(6.1,5.1,.4,.5,"#fff")+flat(9.2,5.1,.4,.5,"#fff");}
function smile(c){return flat(7,7.4,2,.5,c||"#b04a4a");}
function blush(){return flat(4.8,6.6,1.2,.8,"#ff8fa8",.6)+flat(10,6.6,1.2,.8,"#ff8fa8",.6);}
function legs(c,shoe){return box(5,14.6,2.5,3,c)+box(8.5,14.6,2.5,3,c)+box(4.8,17.1,3,1,shoe)+box(8.2,17.1,3,1,shoe);}
function torso(c){return box(4.5,9,7,5.8,c);}
function arms(sleeve,hand){return box(2.9,9.4,1.6,4,sleeve)+box(11.5,9.4,1.6,4,sleeve)+box(2.9,13.2,1.6,1.3,hand)+box(11.5,13.2,1.6,1.3,hand);}
function head(c){return box(4,2,8,7,c);}

/* ---------- герои ---------- */
function drawPrincess(){
  var hair="#7a4a2a",skin="#f6cfa8",d="#5aa9ff";
  return box(3.6,2,8.8,10,hair)
   +box(3.4,12.6,9.2,5,d)+flat(3.4,16.6,9.2,.9,GOLD)+box(5,17.5,2.4,.8,"#ff9ec4")+box(8.6,17.5,2.4,.8,"#ff9ec4")

function findIn(list,id){for(var i=0;i<list.length;i++){if(list[i].id===id)return list[i];}return null;}
function slotItem(key,id){for(var i=0;i<SLOTS.length;i++){if(SLOTS[i].key===key)return findIn(SLOTS[i].items,id);}return null;}

/* Рисует героя целиком: тень, питомец, спина, герой, шляпа, лицо, предмет в руке */
function charSVG(eq,o){
  o=o||{};
  var c=findIn(CHARS,eq.char)||CHARS[0],s="";
  s+=ell(8,18.3,6.2,1.1,"#000",.3);
  if(eq.pet&&!o.nopet){var p=findIn(PETS,eq.pet);if(p)s+=p.draw();}
  if(eq.back){var b=slotItem("back",eq.back);if(b)s+=b.draw();}
  s+=c.draw();
  var hid=eq.hat||c.hat;
  if(hid){var h=eq.hat?slotItem("hat",eq.hat):null;s+=h?h.draw():HAT_DRAW[hid]();}
  if(eq.face){var f=slotItem("face",eq.face);if(f)s+=f.draw();}
  if(eq.hand){var hd=slotItem("hand",eq.hand);if(hd)s+=hd.draw();}
  return '<svg class="'+(o.cls||"chr")+'" viewBox="'+(o.view||"-7 -5.5 23.5 25.5")+'" role="img" aria-label="'+c.name+'" shape-rendering="crispEdges">'+s+'</svg>';
}

    "Разряды и классы. Многозначное число делится на классы по три разряда справа налево: единицы, тысячи, миллионы. В каждом классе есть единицы, десятки и сотни. Всего цифр у числа столько, сколько в нём разрядов; первая цифра не может быть нулём.",

    "Округление. Чтобы округлить число до нужного разряда, смотрят на цифру справа от него: если она 0–4, разряд не меняется, если 5–9, разряд увеличивается на 1. Все цифры правее заменяют нулями. Округляют всегда исходное число, а не уже округлённое.",
    "Признаки делимости. На 2 делятся числа, оканчивающиеся чётной цифрой; на 5 — оканчивающиеся на 0 или 5; на 10 — на 0. На 3 делится число, у которого сумма цифр делится на 3, на 9 — сумма цифр делится на 9. Если число делится на 2 и на 5, оно делится и на 10."
  ],
  tasks:[
    {q:"В типографии напечатали сказочную книгу тиражом 48 650 экземпляров. В газете тираж округлили до тысяч, а на сайте издательства — до сотен. На сколько экземпляров различаются два округлённых числа?",
     o:["350 экземпляров","400 экземпляров","300 экземпляров","700 экземпляров"], a:2,
     e:["350 — это разность между округлением до тысяч (49 000) и точным тиражом 48 650. Но сравнивать нужно два округлённых числа, а не округлённое с точным.",
        "Так получится, если 48 650 округлить до сотен вниз (48 600). В разряде десятков стоит 5, а при цифре 5 разряд сотен увеличивается: получается 48 700.",
        "",
        "Здесь тираж до тысяч взят как 48 000: цифры справа просто отброшены. Но в разряде сотен стоит 6, поэтому тысячи увеличиваются: получается 49 000."],
     h:["Округли тираж отдельно до тысяч и отдельно до сотен, каждый раз глядя на цифру справа от нужного разряда.",
        "Получатся два числа, оба оканчиваются нулями. Остаётся найти их разность."],
     s:"До тысяч: 48 650 — смотрим на сотни, там 6, значит тысячи увеличиваем: 49 000. До сотен: смотрим на десятки, там 5, значит сотни увеличиваем: 48 700. Разность: 49 000 − 48 700 = 300 экземпляров. Проверка: 48 700 + 300 = 49 000."},

    {q:"Волшебник запирает сундук кодом из четырёх разных цифр, взятых из набора 0, 3, 5, 8. Код сундука — наибольшее четырёхзначное число из этих цифр, а ключ от двери — наименьшее четырёхзначное число из тех же цифр без повторов. На сколько код сундука больше ключа?",
     o:["5472","8172","11588","5445"], a:0,
     e:["",
        "Так получится, если наименьшее число записать как 0358 и считать его равным 358. Но число не может начинаться с нуля, иначе оно не четырёхзначное. Проверь: 8530 − 358 = 8172.",
        "Здесь числа сложены, а в вопросе спрашивается, на сколько одно больше другого. Нужно вычитать: 8530 + 3058 = 11588 — это сумма.",
        "Так получится, если после 3 и 0 поставлены цифры 8 и 5 в таком порядке: 3085. Но 3058 меньше, чем 3085: при одинаковых 3 и 0 меньшей должна стоять цифра 5 в разряде десятков."],
     h:["Наибольшее число получается, если цифры расставить по убыванию. Для наименьшего старшая цифра должна быть не нулём.",
        "Наименьшее число: на первое место — наименьшая ненулевая цифра, затем остальные по возрастанию, начиная с нуля."],
     s:"Наибольшее число: цифры по убыванию — 8530. Наименьшее: 0 ставить первым нельзя, значит первая цифра 3, остальные по возрастанию: 3058. Разность: 8530 − 3058 = 5472. Проверка: 3058 + 5472 = 8530."},

    {q:"Корабль отплыл из порта в понедельник в 22 ч 40 мин и находился в пути 53 ч 35 мин. Известно, что в пути он ни разу не останавливался. В какой день недели и во сколько он прибыл в порт назначения?",
     o:["вторник, 04:15","среда, 04:15","четверг, 03:15","четверг, 04:15"], a:3,
     e:["Так получится, если прибавить только 5 ч 35 мин, а 2 суток (48 ч) из 53 часов потерять. Но 53 ч = 2 суток и 5 ч, поэтому дни недели нужно сдвинуть ещё на два.",
        "Здесь двое суток учтены, а переход через полночь не замечен: 22 ч 40 мин + 5 ч 35 мин = 28 ч 15 мин, то есть время уже следующих суток. Поэтому после среды нужно сдвинуться ещё на один день.",
        "Так получится, если при сложении минут 40 + 35 = 75 минут потерян час: 75 мин = 1 ч 15 мин. Тогда к часам нужно добавить ещё 1: 22 + 5 + 1 = 28 ч.",
        ""],
     h:["Раздели 53 часа на целые сутки и остаток часов. Двое суток сдвигают день недели, но не время.",
        "К 22:40 нужно добавить оставшиеся 5 ч 35 мин. Не забудь, что 60 минут — это час и что полночь переводит на следующий день."],
     s:"53 ч = 2 суток + 5 ч, значит день недели сдвигается на 2: понедельник → среда, время остаётся 22:40. Прибавим 5 ч 35 мин: 22 ч 40 мин + 5 ч 35 мин = 27 ч 75 мин = 28 ч 15 мин = 1 сутки 4 ч 15 мин. Среда + 1 день = четверг, время 04:15. Ответ: четверг, 04:15. Проверка: от понедельника 22:40 до четверга 04:15 — 2 суток 5 ч 35 мин, то есть 53 ч 35 мин."},

    {q:"Принцесса Лена запомнила код от замка: четырёхзначное число 4□7□, у которого две цифры стёрлись. Известно, что число делится и на 5, и на 9. Какой самый большой код возможен?",
     o:["4275","4770","4575","4470"], a:1,
     e:["4275 тоже подходит (оно делится на 5 и на 9), но это наименьший код. В вопросе нужен самый большой: нужно сравнить оба найденных варианта.",
        "",
        "Здесь сумма цифр 4 + 5 + 7 + 5 = 21: она делится на 3, но не на 9, поэтому число на 9 не делится. Для 9 нужна сумма цифр 18 или 27.",
        "Здесь сумма цифр 4 + 4 + 7 + 0 = 15: она делится на 3, но не на 9. Число делится на 5, но признак делимости на 9 не выполняется."],
     h:["Сначала подумай о последней цифре: на что должно оканчиваться число, делящееся на 5? Потом используй сумму цифр для признака делимости на 9.",
        "Для каждой возможной последней цифры найди, какая цифра на месте второго квадратика даст сумму цифр, делящуюся на 9. Затем выбери большее число."],
     s:"Делится на 5 — значит, последняя цифра 0 или 5. Сумма цифр должна делиться на 9. Если последняя цифра 0: 4 + □ + 7 + 0 = 11 + □, до 18 не хватает 7, получаем 4770. Если последняя 5: 4 + □ + 7 + 5 = 16 + □, до 18 не хватает 2, получаем 4275. Других цифр нет. Наибольший код — 4770. Проверка: 4770 : 9 = 530, 4770 : 5 = 954."},

    {q:"Миша нумерует страницы в альбоме для марок числами от 1 до 128 включительно. Каждую цифру он пишет отдельно. Сколько цифр ему придётся написать всего? Ответ запиши числом.",
     n:276, m:{"384":"Так получится, если считать, что все 128 страниц имеют по три цифры (128 · 3). Но трёхзначные только страницы с 100 по 128, а до этого есть однозначные и двузначные.",
               "128":"Здесь посчитано только количество страниц, а нужно количество цифр. На каждой двузначной странице пишется две цифры, на трёхзначной — три.",
               "273":"Так получится, если страниц с номерами 100–128 принято 28. Их на самом деле 29: 128 − 100 + 1. Не учтена страница с номером 100."},
     w:"Нужно отдельно посчитать цифры в однозначных, двузначных и трёхзначных номерах и сложить.",
     h:["Раздели номера страниц на три группы по количеству цифр: однозначные, двузначные, трёхзначные. Сколько номеров в каждой группе?",
        "Однозначных 9, двузначных 90. Сколько трёхзначных от 100 до 128? Не забудь про границы: считать нужно включительно."],
     s:"Однозначные номера 1–9: 9 страниц · 1 цифра = 9 цифр. Двузначные 10–99: 90 страниц · 2 цифры = 180 цифр. Трёхзначные 100–128: 128 − 100 + 1 = 29 страниц · 3 цифры = 87 цифр. Всего: 9 + 180 + 87 = 276 цифр."},

    {q:"Туристы шли три дня. В первый день они прошли 18 км 500 м, во второй — на 2 км 750 м меньше, чем в первый, а в третий — столько, сколько за первые два дня вместе, но без 12 км 300 м. Сколько всего прошли туристы за три дня?",
     o:["57 км 200 м","34 км 250 м","56 км 200 м","68 км 500 м"], a:2,
     e:["Так получится, если в метрах вместо 500 − 750 вычтено наоборот 750 − 500 = 250 м, и во второй день окажется 16 км 250 м. Но из 500 м нельзя вычесть 750 м: нужно занять километр, 1500 м − 750 м = 750 м, значит 15 км 750 м.",
        "Здесь учтены только первые два дня: 18 км 500 м + 15 км 750 м = 34 км 250 м. Но третий день тоже входит в путь.",
        "",
        "Так получится, если в третий день пройдено столько же, сколько за первые два дня, и забыто вычесть 12 км 300 м. Проверь третий день: сумма двух дней, уменьшенная на 12 км 300 м."],
     h:["Переведи всё в метры: так удобнее вычитать. Найди пути второго и третьего дня по порядку.",
        "Путь в третий день: (первый + второй) − 12 300 м. Затем сложи три дня и переведи в километры и метры."],
     s:"Первый день: 18 500 м. Второй: 18 500 − 2 750 = 15 750 м. За два дня: 18 500 + 15 750 = 34 250 м. Третий день: 34 250 − 12 300 = 21 950 м. Всего: 34 250 + 21 950 = 56 200 м = 56 км 200 м. Проверка: 18 500 + 15 750 + 21 950 = 56 200."},

    {q:"В трёх сёлах живёт 3 480, 5 725 и 2 960 человек. Староста округлил каждое число до сотен и сложил округлённые числа. На сколько человек эта сумма отличается от точной суммы жителей?",
     o:["35 человек","165 человек","135 человек","12 200 человек"], a:0,
     e:["",
        "Так получится, если числа не округлять, а просто отбросить десятки и единицы: 3400 + 5700 + 2900 = 12 000, и разность с 12 165 равна 165. Но 3 480 нужно округлить до 3 500, а 2 960 — до 3 000: цифра десятков 5 и больше увеличивает сотни.",
        "Здесь 5 725 округлено до 5 800: взгляд упал на цифру единиц 5. Округляя до сотен, смотрят только на цифру десятков, там 2, значит остаётся 5 700.",
        "12 200 — это сумма округлённых чисел, а спрашивается, на сколько она отличается от точной суммы. Нужно ещё найти точную сумму и вычесть."],
     h:["Округли каждое из трёх чисел до сотен, глядя только на цифру десятков. Найди сумму округлённых чисел.",
        "Теперь найди точную сумму трёх чисел и вычти из большего числа меньшее."],
     s:"3 480 → 3 500 (десятков 8), 5 725 → 5 700 (десятков 2), 2 960 → 3 000 (десятков 6). Сумма округлённых: 3 500 + 5 700 + 3 000 = 12 200. Точная сумма: 3 480 + 5 725 + 2 960 = 12 165. Разность: 12 200 − 12 165 = 35 человек."},

    {q:"Старинный замок заложили в 1475 году. Через 2 столетия и 3 десятилетия после закладки в нём случился большой пожар, а восстановление замка после пожара заняло ещё 98 лет. В каком веке закончилось восстановление?",
     o:["XVIII век","XVII век","XV век","XIX век"], a:3,
     e:["Так получится, если век определён по первым двум цифрам года окончания 1803: 18 → XVIII. Но века считают с первого года: 1801–1900 годы — уже XIX век.",
        "Так получится, если остановиться на годе пожара (1705) и определить век по первым цифрам 17. Но восстановление ещё шло 98 лет, и год окончания — 1803; кроме того, 1705 год — это уже XVIII век.",
        "XV век — это век закладки замка. Нужен век окончания восстановления, а не начала строительства.",
        ""],
     h:["Найди год пожара: 2 столетия — это 200 лет, 3 десятилетия — это 30 лет. Потом прибавь время восстановления.",
        "Определи век по правилу: годы 1–100 — I век, 101–200 — II век, и так далее. Для года 1801–1900 какой век?"],
     s:"Год пожара: 1475 + 200 + 30 = 1705. Год окончания восстановления: 1705 + 98 = 1803. Век считают так: 1801–1900 годы — XIX век. Ответ: XIX век. Проверка: 1803 − 1475 = 328 лет прошло от закладки замка."},

    {q:"Дракон разложил на столе карточки с числами от 1 до 100. Сначала он унёс все карточки, числа на которых делятся на 2, а потом унёс из оставшихся все карточки, числа на которых делятся на 5. Сколько карточек осталось на столе? Ответ запиши числом.",
     n:40, m:{"30":"Так получится, если из 100 вычесть 50 (делятся на 2) и 20 (делятся на 5). Но 10 из этих 20 карточек (10, 20, 30, …, 100) уже унесены, потому что они чётные. Их вычитают дважды.",
              "50":"Здесь учтено только первое действие: унесены чётные. Но потом дракон унёс ещё и карточки с числами, делящимися на 5, и среди оставшихся нечётных такие есть (5, 15, 25, …).",
              "80":"Здесь убраны только карточки, делящиеся на 5 (их 20), а чётные не учтены. Дракон же унёс карточки с числами, которые делятся на 2, их 50."},
     w:"Нужно понять, что остались только нечётные числа, не делящиеся на 5, то есть не оканчивающиеся на 5.",
     h:["Сначала посчитай, сколько осталось после первого шага. Какие числа остались: чётные или нечётные?",
        "Среди оставшихся нечётных чисел найди те, что делятся на 5: на какую цифру они оканчиваются? Сколько таких в первой сотне?"],
     s:"Чётных чисел от 1 до 100 ровно 50, после первого шага осталось 100 − 50 = 50 нечётных карточек. Среди нечётных на 5 делятся числа, оканчивающиеся на 5: 5, 15, 25, …, 95 — всего 10. После второго шага: 50 − 10 = 40 карточек. Проверка: оставшиеся числа оканчиваются на 1, 3, 7 или 9, в каждом десятке таких 4, а десятков 10: 4 · 10 = 40."},

    {q:"Дракон складывает золото в сундуки: в первый положил 7 монет, во второй 12, в третий 17, и так далее — в каждый следующий на 5 монет больше, чем в предыдущий. Сколько монет лежит во всех 20 сундуках вместе? Ответ запиши числом.",
     n:1090, m:{"1140":"Так получится, если в двадцатом сундуке принято 7 + 20 · 5 = 107 монет. Но от первого сундука до двадцатого только 19 шагов по 5 монет: 7 + 19 · 5 = 102.",
                "2040":"Здесь число монет двадцатого сундука (102) умножено на 20, как будто во всех сундуках монет поровну. Но в первом всего 7, а во втором 12: количество растёт постепенно.",
                "102":"102 — это число монет только в двадцатом сундуке. Нужно сложить количество монет во всех двадцати сундуках."},
     w:"Найди число монет в последнем сундуке, затем сложи пары: первый и последний, второй и предпоследний и так далее, и посчитай, сколько таких пар.",
     h:["Сначала найди, сколько монет в двадцатом сундуке: от первого до двадцатого сколько раз добавляли по 5?",
        "Сложи первый сундук с двадцатым, второй с девятнадцатым. Что можно сказать о суммах всех таких пар? Сколько пар получится?"],
     s:"От первого до двадцатого сундука 19 шагов по 5 монет: 7 + 19 · 5 = 102 монеты в двадцатом сундуке. Пары: 7 + 102 = 109; 12 + 97 = 109; 17 + 92 = 109, и так далее — сумма каждой пары одна и та же. Пар: 20 : 2 = 10. Всего: 109 · 10 = 1090 монет."},

    {q:"В лагере отдыхают 84 человека. На каждый обед повар берёт по 350 г картофеля на человека. Картофель продают только целыми мешками по 25 кг, один мешок стоит 460 рублей. Сколько рублей повар потратит на картофель для одного обеда, если купит столько мешков, чтобы хватило всем?",
     o:["460 рублей","920 рублей","1 840 рублей","5 520 рублей"], a:1,
     e:["Так получится, если 29 кг 400 г : 25 кг ≈ 1,18 округлить по обычному правилу до 1 мешка. Но одного мешка (25 кг) не хватит на 29 кг 400 г: покупают целые мешки, значит, округляют вверх.",
        "",
        "Здесь на каждого человека учтён 1 кг картофеля вместо 350 г: 84 кг требуют 4 мешка. Но нужно использовать точную норму: 84 · 350 г = 29 400 г.",
        "Так получится, если 29 400 г перевести в килограммы неверно: 29 400 г принято за 294 кг (100 г = 1 кг). Но в 1 кг 1000 г, поэтому 29 400 г = 29 кг 400 г."],
     h:["Найди, сколько граммов картофеля нужно на всех, и переведи в килограммы: 1 кг = 1000 г.",
        "Сравни с массой одного мешка. Мешки целые: если одного мало, придётся купить ещё. Сколько мешков, и сколько они стоят?"],
     s:"Нужно картофеля: 84 · 350 = 29 400 г = 29 кг 400 г. Один мешок — 25 кг, этого мало, а двух мешков (50 кг) хватит с запасом. Стоимость: 2 · 460 = 920 рублей."},

    {q:"Волшебник заколдовал 900 сундуков с номерами от 100 до 999. Открыть можно только тот сундук, номер которого делится на 2, на 3 и на 5 одновременно. Сколько сундуков можно открыть? Ответ запиши числом.",
     n:30, m:{"33":"Так получится, если 999 : 30 округлить вниз до 33. Но в это число входят числа 30, 60, 90 — они меньше 100 и номерами сундуков не являются.",
              "29":"Здесь при подсчёте шагов от 120 до 990 забыт сам первый номер. Если шаг 30, то от 120 до 990 будет (990 − 120) : 30 + 1 = 30 номеров.",
              "90":"Так получится, если считать только числа, делящиеся на 10 (оканчивающиеся на 0). Но нужно ещё и деление на 3: нужна сумма цифр, кратная 3."},
     w:"Число делится на 2, 3 и 5 одновременно, значит оно делится на 30. Остаётся посчитать, сколько трёхзначных чисел делятся на 30.",
     h:["Какому одному числу равносильно условие «делится на 2, на 3 и на 5 одновременно»? Найди его.",
        "Выпиши первое и последнее трёхзначные числа, кратные этому числу, и посчитай, сколько шагов между ними."],
     s:"Числа 2, 3 и 5 не имеют общих делителей, поэтому число делится на все три тогда и только тогда, когда оно делится на 2 · 3 · 5 = 30. Первое трёхзначное кратное 30: 120 (30 · 4), последнее: 990 (30 · 33). Кратные 30: от 30 · 4 до 30 · 33, их 33 − 4 + 1 = 30. Ответ: 30 сундуков."},

    {q:"На почте лежат четыре посылки для школьного кружка: 3 кг 40 г, 3 400 г, 3 кг 4 г и 3 кг 14 г. Почтальон должен первым рейсом отправить две самые лёгкие посылки. Какова общая масса этих двух посылок?",
     o:["6 кг 18 г","6 кг 54 г","6 кг 44 г","6 кг 440 г"], a:0,
     e:["",
        "Так получится, если 3 кг 4 г прочитать как 3 кг 40 г (цифра 4 принята за 40). Тогда лёгкими окажутся 3 кг 14 г и 3 кг 40 г: 3014 + 3040 = 6054. Но 4 г — это 3004 г.",
        "Так получится, если выбраны посылки 3 кг 4 г и 3 кг 40 г, а 3 кг 14 г пропущена. Но 14 г меньше 40 г, поэтому третья по весу, 3 кг 14 г, легче, чем 3 кг 40 г.",
        "Здесь сложены первые две посылки из списка (3 кг 40 г и 3 400 г), хотя они не самые лёгкие. Нужно сначала выразить массы в одинаковых единицах и сравнить."],
     h:["Переведи все четыре массы в граммы, чтобы сравнивать было удобно: 3 кг 40 г — это сколько граммов?",
        "Расставь числа по возрастанию, возьми два наименьших, сложи и снова запиши в килограммах и граммах."],

    {q:"Артём выписал в одну строку все натуральные числа от 1 до 200: 1, 2, 3, …, 199, 200. Сколько раз в этой записи встретилась цифра 1? Считай каждую написанную цифру, например в числе 111 её три. Ответ запиши числом.",
     n:140, m:{"119":"Так получится, если считать числа, содержащие хотя бы одну единицу. Но в числе 11 цифра 1 встречается дважды, а в 111 — трижды: считать нужно цифры, а не числа.",
               "120":"Так получится, если учесть единицы только в первых 99 числах (20 штук) и 100 единиц сотен в числах 100–199. Но в числах 100–199 есть ещё единицы в разряде десятков и единиц: ещё 20 штук.",
               "100":"Здесь посчитаны только единицы в разряде сотен (числа 100–199). Ещё есть единицы в разряде десятков и единиц."},
     w:"Надо отдельно посчитать единицы в разряде единиц, десятков и сотен и сложить.",
     h:["Посчитай отдельно, сколько раз цифра 1 стоит в разряде единиц, в разряде десятков и в разряде сотен.",
        "В разряде единиц: числа 1, 11, 21, … Сколько их до 200? В десятках: числа 10–19 и 110–119. В сотнях: все числа от 100 до 199."],
     s:"Разряд единиц: цифра 1 в числах 1, 11, 21, …, 191 — в каждом десятке по разу, десятков 20: 20 раз. Разряд десятков: числа 10–19 и 110–119: 10 + 10 = 20 раз. Разряд сотен: числа 100–199: 100 раз. Всего: 20 + 20 + 100 = 140."},

    {q:"Для замка Лена придумывает пароли — трёхзначные числа, у которых сумма цифр равна 25. Она выписала все такие числа и сложила их между собой. Чему равна получившаяся сумма? Ответ запиши числом.",
     n:5550, m:{"6":"6 — это количество найденных паролей. А в задаче спрашивается их сумма.",
                "1796":"Так получится, если сложены только наибольший (997) и наименьший (799) из паролей. Но складывать нужно все пароли.",
                "4661":"Так получится, если в списке пропущен один из шести паролей (889): 5550 − 889 = 4661. Всего паролей ровно шесть, ни один пропускать нельзя."},
     w:"Сначала найди, из каких цифр составляются числа с суммой 25 (две девятки и 7, или одна девятка и две восьмёрки), выпиши все перестановки и сложи.",
     h:["Наибольшая сумма трёх цифр — 27. Какие тройки цифр дают сумму 25? Ищи, на сколько нужно уменьшить 9 + 9 + 9.",
        "Для каждой тройки цифр выпиши все различные числа, которые из неё получаются. Сколько всего паролей? Затем сложи парами."],
     s:"Тройки цифр с суммой 25: (9, 9, 7) и (9, 8, 8). Из первой тройки получаются числа 997, 979, 799, из второй — 988, 898, 889. Всего 6 паролей. Сумма: 997 + 979 + 799 = 2775 и 988 + 898 + 889 = 2775. Всего 2775 + 2775 = 5550. Проверка: в каждой тройке каждая цифра стоит на каждом разряде по одному разу, значит сумма равна 111 · 25 = 2775."},

    {q:"Волшебник хранит в башне золотые монеты. Если монеты раскладывать в стопки по 2, по 3, по 4, по 5 или по 6, то каждый раз остаётся 1 монета, а в стопки по 7 монеты раскладываются без остатка. Какое наименьшее число монет может быть у волшебника?",
     o:["61","421","301","721"], a:2,
     e:["61 даёт остаток 1 при делении на 2, 3, 4, 5 и 6, но 61 : 7 = 8 (остаток 5), то есть на 7 не делится. Условие про стопки по 7 не выполнено.",
        "421 = 420 + 1, где 420 — наименьшее число, делящееся на 2, 3, 4, 5, 6 и 7. Тогда 421 даёт остаток 1 и при делении на 7, а нужно, чтобы делилось без остатка.",
        "",
        "721 подходит под условие (721 = 60 · 12 + 1, 721 = 7 · 103), но это не самое маленькое число. Меньшее, 301, тоже подходит."],
     h:["Число минус 1 делится на 2, 3, 4, 5 и 6 одновременно. Найди наименьшее такое число и все его кратные.",
        "Подходят числа вида 60k + 1. Подставляй k = 1, 2, 3, … и проверяй, делится ли число на 7."],
     s:"Если при делении на 2, 3, 4, 5, 6 остаток 1, то число минус 1 делится на все эти числа, а значит, на 60 (НОК равен 60). Значит, число имеет вид 60k + 1: 61, 121, 181, 241, 301. Проверка на 7: 61 : 7 — остаток 5, 121 — остаток 2, 181 — остаток 6, 241 — остаток 3, 301 = 7 · 43. Наименьшее число: 301."},

    {q:"О населении старинного города сказано: «округлённо до тысяч — 56 000 жителей, а округлённо до десятков тысяч — 60 000 жителей». Найди разность между наибольшим и наименьшим числом жителей, которое возможно при этих условиях. Округление обычное: 5 и больше — вверх.",
     o:["1000 жителей","9999 жителей","500 жителей","999 жителей"], a:3,
     e:["Так получится, если верхней границей считать 56 500, а нижней 55 500. Но 56 500 при округлении до тысяч даёт 57 000, поэтому наибольшее число жителей 56 499, и разность 999.",
        "Здесь учтено только округление до десятков тысяч: числа от 55 000 до 64 999 дают 60 000. Но ещё нужно, чтобы при округлении до тысяч получалось 56 000.",
        "Так получится, если считать, что до 56 000 доходят только числа от 55 500 до 56 000, а выше нельзя. Но числа 56 001–56 499 тоже округляются до 56 000.",
        ""],
     h:["Какие числа округляются до 56 000, если округлять до тысяч? Найди наименьшее и наибольшее из них.",
        "Проверь, что все эти числа при округлении до десятков тысяч дают 60 000. Затем найди разность между наибольшим и наименьшим."],
     s:"При округлении до тысяч получается 56 000 у чисел от 55 500 до 56 499 (56 500 уже даёт 57 000). Все они при округлении до десятков тысяч дают 60 000, потому что лежат между 55 000 и 64 999. Значит, жителей может быть от 55 500 до 56 499. Разность: 56 499 − 55 500 = 999 жителей."},

    {q:"В школьном лагере Лена заметила, что в этом месяце ровно три воскресенья пришлись на чётные числа. Месяц был не короче 30 дней. Каким днём недели было 20-е число этого месяца?",
     o:["среда","четверг","пятница","суббота"], a:1,
     e:["Так получится при воскресеньях 3, 10, 17, 24, 31: среди них чётных только 10 и 24, а должно быть три чётных воскресенья.",
        "",
        "Так получится при воскресеньях 1, 8, 15, 22, 29: среди них чётных только 8 и 22. А по условию их должно быть три.",
        "Так получится при воскресеньях 7, 14, 21, 28: чётных среди них только 14 и 28. Не хватает третьего чётного воскресенья."],
     h:["Воскресенья идут через 7 дней, и чётность чисел чередуется: чётное, нечётное, чётное, … Сколько воскресений должно быть в месяце, чтобы три из них были чётными?",
        "Должно быть пять воскресений: чётное, нечётное, чётное, нечётное, чётное. Найди, какими числами они могут быть, и посчитай дни до 20-го."],
     s:"Воскресенья идут с интервалом 7 дней, чётность чисел чередуется. Три чётных воскресенья возможны, только когда их пять, и первое чётное: 2, 9, 16, 23, 30. Чётные: 2, 16, 30. Воскресенье было 16-го, значит 20-е число на 4 дня позже: понедельник 17, вторник 18, среда 19, четверг 20. Ответ: четверг. Проверка: 30-е — воскресенье, 20-е на 10 дней раньше, а это неделя и ещё 3 дня назад; три дня до воскресенья — четверг."},

    {q:"Волшебные часы отстают на 3 минуты за каждые 2 часа. Их поставили точно в полночь с воскресенья на понедельник. В среду в 18:00 по правильным часам Лена взглянула на них: они показывали 16 ч и ещё несколько минут. Сколько минут показывали волшебные часы? Ответ запиши числом.",
     n:21, m:{"99":"99 минут — это отставание часов, а не их показание. Часы отстают на 99 минут, то есть показывают на 1 ч 39 мин меньше 18:00.",
              "42":"Так получится, если считать отставание 3 минуты за каждый час: 66 · 3 = 198 минут = 3 ч 18 мин, и часы покажут 14:42. Но 3 минуты часы отстают за каждые 2 часа, а не за каждый час.",
              "27":"Здесь число двухчасовых промежутков (33) принято за отставание в минутах: 18:00 − 33 мин = 17:27. Но за каждый промежуток часы отстают на 3 минуты, значит, 33 · 3 минут."},
     w:"Найди время от полуночи понедельника до 18:00 среды, раздели на двухчасовые промежутки, умножь на 3 минуты и вычти из 18:00.",
     h:["Сколько часов прошло от полуночи с воскресенья на понедельник до 18:00 среды? Сколько двухчасовых промежутков в этом времени?",
        "За каждый промежуток часы отстают на 3 минуты. Найди общее отставание, переведи в часы и минуты и вычти из 18:00."],
     s:"От полуночи понедельника до 18:00 среды: 2 суток 18 ч = 48 + 18 = 66 ч. Двухчасовых промежутков: 66 : 2 = 33. Отставание: 33 · 3 = 99 минут = 1 ч 39 мин. Часы показывают: 18:00 − 1 ч 39 мин = 16:21. Ответ: 21 минута. Проверка: правильное время 16:21 + 1:39 = 18:00."},

    {q:"Волшебник придумал код для сейфа: наименьшее натуральное число, сумма цифр которого равна 40. Какой код у сейфа?",
     o:["49999","4999","94999","58999"], a:0,
     e:["",
        "Здесь цифр на одну меньше: 4 + 9 + 9 + 9 = 31, а нужно 40. Четырёх цифр не хватает: даже четыре девятки дают только 36.",
        "Сумма цифр у 94999 верна (9 + 4 + 9 + 9 + 9 = 40), но число большое: в старшем разряде стоит 9. Чтобы число стало наименьшим, девятки нужно ставить в младшие разряды, а меньшую цифру — в старший.",
        "Сумма цифр верна: 5 + 8 + 9 + 9 + 9 = 40, и число пятизначное. Но можно взять старшую цифру меньше: 4, а остальные четыре — девятки. Тогда число 49999 меньше."],
     h:["Чем меньше цифр в числе, тем число меньше. Сколько цифр нужно как минимум, если каждая не больше 9?",
        "Сделай все младшие цифры как можно больше (то есть девятками), а старшую — как можно меньше, чтобы набрать нужную сумму 40."],
     s:"Одной цифрой 9 хватает максимум 9, поэтому четырёх цифр мало: 4 · 9 = 36 < 40. Значит, цифр не меньше пяти. Пятизначное число будет наименьшим, если старшая цифра минимальна, а остальные максимальны: четыре девятки дают 36, на старшую остаётся 40 − 36 = 4. Код: 49999. Проверка: 4 + 9 + 9 + 9 + 9 = 40."}

    {q:"Миша собрал в лесу 48 грибов. Лена собрала на 15 грибов меньше, чем Миша, а Артём — на 9 грибов больше, чем Лена. Сколько грибов собрали все трое вместе?",

        "Здесь Артёму отдано на 9 грибов больше, чем Мише (57), хотя «на 9 больше» сказано про Лену: 48 + 33 + 57 = 138. Сравнивать нужно с Леной.",

    {q:"Корабль с волшебником плыл три дня. В первый день он прошёл 128 км, во второй — на 34 км больше, чем в первый, а в третий — на 47 км меньше, чем за первые два дня вместе. Сколько километров прошёл корабль за все три дня?",

    {q:"Лена пошла в магазин с купюрой 500 рублей. Она купила 4 тетради по 37 рублей, набор ручек за 95 рублей и альбом. Сдачи ей дали 117 рублей. Сколько рублей стоил альбом? Ответ запиши в рублях.",
     n:140, m:{"257":"Так получится, если из 500 вычесть только тетради и ручки: 500 − 148 − 95 = 257. Не учтена сдача: она тоже не потрачена, поэтому на альбом ушло меньше.",
               "374":"Здесь сдача 117 прибавлена к 257, хотя её нужно вычесть: сдача — это деньги, которые остались у Лены, а не потрачены.",
               "235":"Так получится, если вычесть сдачу и тетради, но не вычесть ручки: 500 − 117 − 148 = 235. Набор ручек за 95 рублей тоже входит в покупки.",
               "251":"Здесь четыре тетради посчитаны как одна (37 рублей): 500 − 37 − 95 − 117 = 251. Тетрадей 4, значит 4 × 37 = 148 рублей."},
     w:"Сначала нужно найти, сколько денег потрачено: из 500 рублей вычесть сдачу. Затем вычесть стоимость тетрадей (4 × 37) и ручек, остаток — цена альбома.",
     h:["Сколько рублей Лена потратила всего? Подумай, как связаны 500 рублей, сдача и потраченная сумма.",
        "Потрачено: 500 − 117. Тетради стоят 4 × 37. Из потраченной суммы вычти тетради и ручки."],
     s:"1) Потрачено всего: 500 − 117 = 383 рубля. 2) Тетради: 4 × 37 = 148 рублей. 3) Тетради и ручки: 148 + 95 = 243 рубля. 4) Альбом: 383 − 243 = 140 рублей. Ответ: 140. Проверка: 148 + 95 + 140 = 383, 383 + 117 = 500."},
    {q:"Сейчас Мише 12 лет, его маме на 26 лет больше, а бабушка старше мамы на 28 лет. Сколько лет будет бабушке, когда Мише исполнится 20 лет?",
     o:["66","74","86","48"], a:1,
     e:["Это возраст бабушки сейчас: 12 + 26 + 28 = 66. Но вопрос про момент, когда Мише будет 20 лет, то есть через 8 лет.",
        "",
        "Здесь к 66 годам прибавлены 20 лет: 66 + 20 = 86. Но пройдёт не 20 лет, а 20 − 12 = 8 лет, ведь Мише уже 12.",
        "Здесь к 20 прибавлено только 28: 20 + 28 = 48. Бабушка старше мамы на 28, а мама старше Миши на 26, значит бабушка старше Миши на 54."],
     h:["Найди возраст бабушки сейчас. Потом подумай, сколько лет пройдёт, пока Мише будет 20.",
        "Мама: 12 + 26. Бабушка: возраст мамы + 28. Пройдёт 20 − 12 лет, и каждому прибавится столько же лет."],
     s:"1) Маме: 12 + 26 = 38 лет. 2) Бабушке сейчас: 38 + 28 = 66 лет. 3) До 20 лет Мише ждать 20 − 12 = 8 лет. 4) Бабушке будет 66 + 8 = 74 года. Ответ: 74. Проверка: разница между бабушкой и Мишей 26 + 28 = 54, и 20 + 54 = 74."},
    {q:"Бригада строила стену из 300 кирпичей. В первый день выложили 112 кирпичей, во второй — на 28 кирпичей меньше, чем в первый. Остальные кирпичи выложили в третий день. Сколько кирпичей выложили в третий день?",
     o:["48","104","188","216"], a:1,
     e:["Так получится, если во второй день взять на 28 кирпичей больше, чем в первый (140): 300 − 112 − 140 = 48. Но «на 28 меньше» значит вычитать.",
        "",
        "Это остаток после первого дня: 300 − 112 = 188. Второй день не вычтен, а в третий день выложили то, что осталось после двух дней.",
        "Это остаток после второго дня без первого: 300 − 84 = 216. Первый день тоже вычитается из общего числа кирпичей."],
     h:["Сначала найди, сколько кирпичей выложили во второй день. Потом — сколько выложили за два дня.",
        "Второй день: 112 − 28. За два дня: сумма первых двух чисел. Остаток считается вычитанием из 300."],
     s:"1) Второй день: 112 − 28 = 84 кирпича. 2) За два дня: 112 + 84 = 196. 3) Третий день: 300 − 196 = 104 кирпича. Ответ: 104. Проверка: 112 + 84 + 104 = 300."},
    {q:"У Ани, Бори и Веры вместе 90 конфет. Аня отдала Боре 8 конфет, потом Боря отдал Вере 5 конфет, и после этого у всех троих стало поровну. Сколько конфет было у Бори вначале?",
     o:["27","22","35","33"], a:0,
     e:["",
        "Здесь учтено только, что Боря получил 8 конфет (30 − 8 = 22). Не учтено, что потом он отдал 5 конфет Вере.",
        "Здесь учтено только, что Боря отдал 5 конфет (30 + 5 = 35). Не учтено, что до этого он получил 8 конфет от Ани.",
        "Так получится, если действия Бори выполнить прямо: 30 + 8 − 5 = 33. Нужно идти от конца к началу и делать обратные действия: убрать полученные 8 и вернуть отданные 5."],
     h:["Сколько конфет у каждого в конце? Ведь у всех поровну, а всего 90.",
        "Боря в конце имеет 90 ÷ 3. Он получил 8 и отдал 5, значит вначале у него было число, которое после этих двух действий стало равно концу."],
     s:"1) В конце у каждого: 90 ÷ 3 = 30 конфет. 2) Боря: сначала получил 8, потом отдал 5, итого прибавилось 8 − 5 = 3 конфеты. 3) Было вначале: 30 − 3 = 27. Ответ: 27. Проверка: 27 + 8 = 35, 35 − 5 = 30. У Ани было 30 + 8 = 38, у Веры 30 − 5 = 25, и 38 + 27 + 25 = 90."},
    {q:"В трёх ящиках лежит 123 кг картофеля. В первом ящике на 18 кг больше, чем во втором, а в третьем — на 12 кг меньше, чем во втором. Сколько килограммов картофеля в первом ящике? Ответ запиши в килограммах.",
     n:57, m:{"59":"Здесь 123 разделено поровну на три ящика (41) и прибавлено 18. Но ящики не равны: во втором ящике не 41 кг, а меньше, ведь первый больше второго, а третий меньше.",
              "49":"Здесь 18 и 12 вычтены из общей суммы: 123 − 18 − 12 = 93. Но у третьего ящика на 12 кг меньше, поэтому его недостаток надо прибавить, а не вычитать.",
              "39":"Это масса картофеля во втором ящике, а в вопросе спрашивают про первый. К 39 нужно прибавить ещё 18.",
              "41":"Это просто 123 ÷ 3. Ящики разные: первый на 18 кг больше второго, третий на 12 кг меньше, так что поровну не поделить."},
     w:"Сравни все три ящика со вторым. Если в первом убрать лишние 18 кг, а в третий добавить недостающие 12 кг, во всех ящиках станет поровну, как во втором.",
     h:["Возьми второй ящик за основу. Подумай, как выровнять все три ящика с ним.",
        "Первый больше на 18, третий меньше на 12. Если лишние 18 убрать, а недостающие 12 добавить, общая масса изменится на 12 − 18. Потом дели на три."],
     s:"1) Если из первого убрать 18 кг, а к третьему добавить 12 кг, во всех ящиках будет по столько же, сколько во втором. 2) Всего станет: 123 − 18 + 12 = 117 кг. 3) Во втором ящике: 117 ÷ 3 = 39 кг. 4) В первом: 39 + 18 = 57 кг. Ответ: 57. Проверка: в третьем 39 − 12 = 27, и 57 + 39 + 27 = 123."},
    {q:"В магазине было 500 кг яблок. В понедельник продали 137 кг, во вторник — на 45 кг больше, чем в понедельник, а в среду — вдвое меньше, чем во вторник. Сколько килограммов яблок осталось после среды?",
     o:["410","225","90","181"], a:2,
     e:["Это сколько килограммов яблок продано за три дня: 137 + 182 + 91 = 410. В вопросе спрашивают, сколько осталось, значит нужно вычесть продажи из 500.",
        "Так получится, если во вторник взять на 45 кг меньше (92), а в среду — половину от этого (46): 500 − 137 − 92 − 46 = 225. Но «на 45 больше» значит прибавлять.",
        "",
        "Здесь не учтена среда: 500 − 137 − 182 = 181. Но продажи в среду тоже уменьшают остаток."],
     h:["Найди продажи за каждый день: понедельник дан, вторник и среду надо вычислить по очереди.",
        "Вторник: 137 + 45. Среда: половина от вторника. Затем сложи три дня и вычти из 500."],
     s:"1) Вторник: 137 + 45 = 182 кг. 2) Среда: 182 ÷ 2 = 91 кг. 3) Продано всего: 137 + 182 + 91 = 410 кг. 4) Осталось: 500 − 410 = 90 кг. Ответ: 90 кг. Проверка: 90 + 410 = 500."},
    {q:"У Ани и Бори вместе 74 наклейки. Аня отдала Боре 9 наклеек, и после этого у Бори стало на 6 наклеек больше, чем у Ани. Сколько наклеек было у Ани сначала?",
     o:["34","31","25","43"], a:3,
     e:["Это число наклеек, которое осталось у Ани после того, как она отдала 9: (74 − 6) ÷ 2 = 34. В вопросе нужно число наклеек до передачи.",
        "Это число наклеек Бори сначала: после передачи у него 40, а до неё — на 9 меньше, 40 − 9 = 31. Спрашивают про Аню.",
        "Здесь 9 наклеек вычтены из 34, хотя Аня их отдала, и вначале у неё было больше: 34 + 9.",
        ""],
     h:["Всего наклеек не изменилось: 74. Найди, сколько стало у Ани и у Бори после передачи, используя сумму и разность.",
        "После передачи: сумма 74, у Бори на 6 больше. Меньшее число равно (74 − 6) ÷ 2. Затем вернись назад к началу."],
     s:"1) После передачи сумма 74, разность 6. 2) У Ани стало: (74 − 6) ÷ 2 = 34. У Бори: 34 + 6 = 40. 3) Аня отдала 9, значит вначале у неё было 34 + 9 = 43. Ответ: 43. Проверка: у Бори было 40 − 9 = 31, и 43 + 31 = 74."},
    {q:"Поезд отправился в 9:45. До первой станции он ехал 2 ч 50 мин, потом стоял 25 мин, до второй станции ехал 1 ч 35 мин, стоял там 15 мин, а затем ехал ещё 2 ч 20 мин до конечной. Во сколько поезд прибыл на конечную станцию?",
     o:["17:10","16:30","15:50","17:30"], a:0,
     e:["",
        "Так получится, если не учитывать стоянки: 9:45 + 2:50 + 1:35 + 2:20 = 16:30. Но поезд стоял всего 25 + 15 = 40 мин, и это время тоже проходит.",
        "Здесь 40 мин стоянок вычтены из времени прибытия: 16:30 − 0:40 = 15:50. Но стоянки время добавляют, поезд приходит позже.",
        "Здесь стоянки 25 мин и 15 мин округлены до целого часа: 16:30 + 1:00 = 17:30. Нужно прибавить ровно 40 мин."],
     h:["Время в пути и время стоянок складывай по частям: сначала часы, потом минуты, помня, что 60 мин = 1 ч.",
        "В движении: 2:50 + 1:35 + 2:20. Стоянки: 25 мин + 15 мин. Всё это прибавь к 9:45."],
     s:"1) В движении: 2 ч 50 мин + 1 ч 35 мин + 2 ч 20 мин = 5 ч 105 мин = 6 ч 45 мин. 2) Стоянки: 25 + 15 = 40 мин. 3) Всего в пути: 6 ч 45 мин + 40 мин = 7 ч 25 мин. 4) 9:45 + 7 ч = 16:45, и ещё 25 мин: 17:10. Ответ: 17:10. Проверка: 17:10 − 7:25 = 9:45."},
    {q:"Турист прошёл маршрут за три дня, всего 65 км. В первый день он прошёл 23 км, а в третий — на 6 км больше, чем во второй. Сколько километров турист прошёл в третий день? Ответ запиши в километрах.",
     n:24, m:{"21":"Здесь 42 км, оставшихся на два дня, разделены поровну: 42 ÷ 2 = 21. Но в третий день прошли на 6 км больше, чем во второй, так что дни не равны.",
              "18":"Это путь за второй день: (42 − 6) ÷ 2 = 18. В вопросе про третий день, а он на 6 км длиннее.",
              "42":"Это путь за второй и третий день вместе: 65 − 23 = 42. Нужно ещё разделить этот путь на две неравные части.",
              "36":"Здесь из 42 км вычтено 6 и не разделено пополам: 42 − 6 = 36. Это удвоенный путь второго дня, а не третьего."},
     w:"Сначала найди, сколько километров прошли за второй и третий день вместе. Затем используй сумму и разность: сумма этих двух дней и их разность 6 км.",
     h:["Сколько километров осталось на второй и третий день вместе? Это сумма двух неизвестных чисел.",
        "Сумма этих чисел известна, а разность равна 6. Если убрать лишние 6 км у третьего дня, получатся два равных числа."],
     s:"1) Второй и третий день вместе: 65 − 23 = 42 км. 2) Уберём лишние 6 км у третьего дня: 42 − 6 = 36 км, это два равных дня. 3) Второй день: 36 ÷ 2 = 18 км. 4) Третий день: 18 + 6 = 24 км. Ответ: 24. Проверка: 23 + 18 + 24 = 65."},
    {q:"Сумма двух чисел равна 156, а их разность равна 38. Из большего числа вычли 17, а к меньшему прибавили 17. Чему равна разность новых чисел?",
     n:4, m:{"21":"Здесь разность уменьшена только на 17: 38 − 17 = 21. Но большее число уменьшилось на 17, а меньшее ещё и увеличилось на 17, значит разность изменилась дважды.",
             "55":"Здесь разность увеличена: 38 + 17 = 55. Но большее число уменьшили, а меньшее увеличили, числа сблизились, и разность стала меньше.",
             "72":"Здесь 17 прибавлено дважды: 38 + 34 = 72. Числа сближаются, поэтому разность уменьшается: 38 − 34.",
             "38":"Это старая разность. Она изменилась: большее число уменьшили, меньшее увеличили, и расстояние между ними сократилось."},
     w:"Найди сами числа: большее (156 + 38) ÷ 2, меньшее (156 − 38) ÷ 2. Затем выполни указанные действия и найди разность новых чисел. Или заметь, что разность уменьшилась на 17 + 17.",
     h:["Найди сами числа по сумме и разности. Или подумай, как меняется расстояние между числами, если большее уменьшить, а меньшее увеличить на одно и то же число.",
        "Большее число: (156 + 38) ÷ 2. Меньшее: (156 − 38) ÷ 2. Потом измени их на 17 и вычти."],
     s:"1) Большее число: (156 + 38) ÷ 2 = 97. Меньшее: 156 − 97 = 59. 2) После изменений: 97 − 17 = 80 и 59 + 17 = 76. 3) Новая разность: 80 − 76 = 4. Ответ: 4. Быстрее: разность уменьшилась на 17 + 17 = 34, и 38 − 34 = 4."},
    {q:"Найди значение выражения: 100 − 99 + 98 − 97 + 96 − 95 + … + 4 − 3 + 2 − 1.",
     o:["49","50","100","25"], a:1,
     e:["Здесь неверно посчитано число пар: всего 100 чисел, значит пар 100 ÷ 2 = 50, а не 49.",
        "",
        "Здесь взято число пар (100 − 99, 98 − 97, …) вместо суммы. Каждая пара равна 1, а пар 50, а не 100: числа в парах разные.",
        "Здесь выражение разбито на четвёрки: 100 − 99 + 98 − 97 = 2, и четвёрок 25, но каждая четвёрка принята за 1, а она равна 2."],
     h:["Сгруппируй числа попарно: первое с вторым, третье с четвёртым и так далее. Чему равна каждая пара?",
        "Каждая пара вида 100 − 99 даёт одно и то же число. Осталось посчитать, сколько пар: всего чисел 100."],
     s:"1) Сгруппируем: (100 − 99) + (98 − 97) + … + (2 − 1). 2) Каждая скобка равна 1. 3) Всего чисел 100, значит скобок 100 ÷ 2 = 50. 4) Сумма: 50 × 1 = 50. Ответ: 50. Проверка на малом примере: 4 − 3 + 2 − 1 = 2, то есть две пары дают 2."},
    {q:"Через 5 лет сумма возрастов Ани и её брата будет равна 31 год, а сейчас Аня старше брата на 5 лет. Сколько лет будет брату, когда Ане исполнится столько лет, сколько сейчас им обоим вместе?",
     o:["26","29","16","21"], a:2,
     e:["Так получится, если 31 принять за сумму возрастов сейчас: тогда Ане 18, брату 13, сумма 31, и через 13 лет брату будет 26. Но 31 — это сумма через 5 лет, сейчас она на 10 лет меньше.",
        "Здесь к возрасту брата (8 лет) прибавлено 21 — число лет, которое будет Ане, а не прошедший срок: 8 + 21 = 29. Пройдёт 21 − 13 = 8 лет.",
        "",
        "Это возраст Ани в нужный момент и сумма возрастов сейчас, а в вопросе спрашивают про брата. Брат моложе Ани на 5 лет."],
     h:["Через 5 лет каждому прибавится по 5 лет, значит сумма возрастов сейчас на 10 лет меньше. Найди её.",
        "Сумма сейчас и разность 5 дают возрасты. Потом найди, через сколько лет Ане исполнится столько, сколько сейчас обоим вместе."],
     s:"1) Сумма сейчас: 31 − 5 − 5 = 21. 2) Аня: (21 + 5) ÷ 2 = 13 лет, брат: 21 − 13 = 8 лет. 3) Ане будет 21, пройдёт 21 − 13 = 8 лет. 4) Брату будет 8 + 8 = 16 лет. Ответ: 16. Проверка: 21 − 16 = 5, разница в возрасте сохранилась."},
    {q:"Дракон хранил в пещере золотые монеты. В понедельник он отдал 45 монет, во вторник нашёл 120 монет, в среду отдал на 30 монет больше, чем в понедельник, а в четверг нашёл втрое меньше монет, чем во вторник. После четверга в пещере стало 210 монет. Сколько монет было вначале?",
     o:["250","110","125","170"], a:3,
     e:["Здесь обратные действия выполнены не в ту сторону: за четыре дня монет стало больше на 40, поэтому вначале их было меньше: 210 − 40, а не 210 + 40.",
        "Здесь в среду отдано 45 − 30 = 15 монет, но «на 30 больше» значит 45 + 30 = 75. Тогда общее изменение другое, и ответ 110 неверен.",
        "Здесь в среду отдано только 30 монет, а нужно 45 + 30 = 75: «на 30 больше, чем в понедельник».",
        ""],
     h:["Найди, сколько монет дракон отдал в среду и сколько нашёл в четверг. Затем подумай, на сколько монет изменилось их число за четыре дня.",
        "Среда: 45 + 30. Четверг: 120 ÷ 3. Подсчитай все добавки и все потери, получишь общее изменение, и от 210 вернись назад."],
     s:"1) Среда: 45 + 30 = 75 монет отдал. 2) Четверг: 120 ÷ 3 = 40 монет нашёл. 3) Нашёл всего: 120 + 40 = 160, отдал всего: 45 + 75 = 120. Стало больше на 160 − 120 = 40. 4) Вначале было: 210 − 40 = 170. Ответ: 170. Проверка: 170 − 45 = 125, + 120 = 245, − 75 = 170, + 40 = 210."},
    {q:"Сумма двух чисел равна 140. Если большее число уменьшить на 25, а меньшее увеличить на 15, то числа станут равными. Найди большее из этих чисел.",
     n:90, m:{"70":"Это половина суммы: 140 ÷ 2. Но сумма 140 относится к исходным числам, которые не равны, а равенство наступает только после изменений.",
              "75":"Здесь разность принята равной 25 − 15 = 10: (140 + 10) ÷ 2 = 75. Но числа сближаются на 25 + 15 = 40, это и есть их разность.",
              "50":"Это меньшее число. В вопросе нужно найти большее, к 50 надо прибавить разность 40.",
              "65":"Здесь разность принята равной 15: (140 − 15) ÷ 2 ≈ 62,5 округлено. Числа сближаются на 25 + 15 = 40, это и есть их разность."},
     w:"Большее число уменьшили на 25, меньшее увеличили на 15, и они сравнялись. Значит, разность между ними была 25 + 15. Дальше используй сумму и разность.",

    {q:"Путешественники шли из города А в город Г через города Б и В. Известно, что от А до В 48 км, от Б до Г 55 км, а участки А—Б и В—Г вместе составляют 47 км. Найди длину участка Б—В.",

  id:"mul", title:"Лес Умножения и Деления", sub:"Умножение, деление, порядок действий, остатки", glyph:"× ÷", color:"#59d5e3",
  theory:[

        "Здесь цены сложены без учёта массы: 85 + 120 = 205, 1000 − 205 = 795. Цена дана за 1 кг, поэтому сначала цену нужно умножить на число килограммов.",

    {q:"В школьной библиотеке 360 книг по математике. Книг по истории в 4 раза меньше, чем по математике, а по литературе — в 3 раза больше, чем по истории. Сколько всего книг по этим трём предметам? Ответ запиши числом.",
     n:720, m:{"450":"Так получится, если сложить только математику и историю: 360 + 90. Книги по литературе (90 · 3 = 270) в сумму тоже входят.",
               "1530":"Здесь литература найдена от математики: 360 · 3 = 1080. По условию «в 3 раза больше» сравнивают с историей: 90 · 3 = 270.",

    {q:"В кондитерской испекли 250 пирожных. Ещё до упаковки 14 пирожных разобрали сотрудники, а остальные уложили в коробки по 12 штук. Сколько коробок потребовалось, если неполная коробка тоже считается?",

        "Здесь не вычтены 14 разобранных пирожных: 250 : 12 = 20 (ост. 10), и добавлена коробка для остатка. В коробки укладывали только 250 − 14 = 236 пирожных.",

    {q:"По рецепту торта на 8 человек нужно 240 г муки. Повар готовит торты на 20 человек. Мука продаётся пачками по 500 г по 35 рублей за пачку, но только целыми пачками. Сколько рублей надо заплатить за муку?",

        "Здесь взяты 600 : 500 = 1,2 пачки по 35 рублей. По условию пачки продают только целиком, поэтому 1,2 пачки надо округлить до 2.",

    {q:"Мальчик вышел из лагеря в посёлок со скоростью 4 км/ч. Через 3 часа вслед за ним выехал вожатый на велосипеде со скоростью 10 км/ч. Через сколько часов после своего выезда вожатый догонит мальчика?",

    {q:"Автобус отправляется от остановки каждые 25 минут: первый рейс в 6:10, затем в 6:35 и так далее. Миша пришёл на остановку в 9:00. Сколько минут ему ждать ближайшего автобуса? Ответ запиши числом минут.",

    {q:"Пятеро рабочих выкладывают плиткой площадку и закончили бы работу за 12 дней. Проработав 3 дня, они получили в помощь ещё 4 рабочих, и все трудились с той же производительностью. За сколько дней всего была выложена площадка?",
