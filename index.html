        "Оставшуюся работу в рабочих днях раздели на число рабочих после прихода помощников (5 + 4). Потом прибавь первые 3 дня."],
     s:"1) Вся работа: 5 · 12 = 60 рабочих дней. 2) За 3 дня сделано: 5 · 3 = 15. 3) Осталось: 60 − 15 = 45. 4) Рабочих стало 5 + 4 = 9, на остаток уйдёт 45 : 9 = 5 дней. 5) Всего: 3 + 5 = 8 дней. Ответ: 8 дней."},

    {q:"Замки рыцаря и принцессы стоят на одной дороге на расстоянии 150 км. Рыцарь выехал из своего замка в 8:00 со скоростью 10 км/ч. В 11:00 навстречу ему выехала принцесса в карете со скоростью 20 км/ч. На каком расстоянии от замка рыцаря они встретятся?",
     o:["40 км","80 км","50 км","70 км"], a:3,
     e:["Это путь рыцаря только за 4 часа после выезда принцессы (4 · 10). Но рыцарь ехал ещё 3 часа до её выезда и проехал 30 км.",
        "Число 80 — расстояние от замка принцессы (4 · 20). Спрашивается расстояние от замка рыцаря: 150 − 80 = 70.",
        "Здесь 150 : 30 = 5 часов, будто оба выехали одновременно. Но рыцарь выехал на 3 часа раньше, поэтому до выезда принцессы сократилось 30 км.",
        ""],
     h:["Узнай, сколько километров рыцарь проехал один, пока принцесса ещё не выехала.",
        "Оставшееся расстояние раздели на скорость сближения (сумму скоростей). Получится время после выезда принцессы. Сколько всего ехал рыцарь?"],
     s:"1) С 8:00 до 11:00 рыцарь проехал 10 · 3 = 30 км. 2) Осталось: 150 − 30 = 120 км. 3) Скорость сближения: 10 + 20 = 30 км/ч. 4) Время до встречи: 120 : 30 = 4 ч. 5) Рыцарь ехал всего 3 + 4 = 7 ч и проехал 10 · 7 = 70 км. Ответ: 70 км. Проверка: принцесса проехала 20 · 4 = 80 км, 70 + 80 = 150."},

    {q:"Сегодня вторник. Через 100 дней начнутся каникулы, а олимпиада состоится ещё через 45 дней после начала каникул. В какой день недели будет олимпиада?",
     o:["Воскресенье","Пятница","Четверг","Суббота"], a:0,
     e:["",
        "Так получится, если прибавить ко вторнику только 45 дней (45 = 7 · 6 + 3). Но от сегодняшнего дня до олимпиады проходит 100 + 45 = 145 дней.",
        "Это день начала каникул: 100 = 7 · 14 + 2, вторник + 2 = четверг. Олимпиада — ещё через 45 дней.",
        "Так получится, если прибавить 144 дня вместо 145, то есть на один день меньше. День недели повторяется через 7 дней, значит, надо найти остаток от деления именно 145 на 7."],
     h:["Сколько всего дней пройдёт от сегодняшнего дня до олимпиады?",
        "День недели повторяется через каждые 7 дней. Раздели это число на 7 с остатком, и остаток покажет сдвиг от вторника."],
     s:"1) Всего дней: 100 + 45 = 145. 2) 145 : 7 = 20 (ост. 5), так как 7 · 20 = 140. 3) 20 полных недель дают тот же день недели, значит, сдвиг на 5 дней вперёд от вторника: среда, четверг, пятница, суббота, воскресенье. Ответ: воскресенье."},

    {q:"На ярмарке принцесса купила 3 одинаковых шарфа и 2 одинаковые шляпы. Одна шляпа стоит в 2 раза дороже одного шарфа. За всю покупку заплачено 560 рублей. Сколько рублей стоит один шарф? Ответ запиши числом.",
     n:80, m:{"112":"Так получится, если считать все 5 предметов одинаково дорогими: 560 : 5. Шляпа дороже шарфа в 2 раза, поэтому 2 шляпы стоят как 4 шарфа.",
              "160":"Число 160 — цена одной шляпы (80 · 2). Спрашивается цена шарфа, то есть меньшая из двух цен.",
              "70":"Здесь шарф принят вдвое дороже шляпы: 3 · 2 + 2 = 8 частей, 560 : 8 = 70. По условию дороже шляпа, поэтому в шляпе 2 части, а в шарфе 1."},
     w:"Примем цену шарфа за 1 часть. Тогда шляпа стоит 2 части. 3 шарфа — это 3 части, 2 шляпы — 4 части, всего 7 частей. 560 : 7 = 80 рублей — цена шарфа.",
     h:["Цену шарфа удобно принять за одну часть. Сколько частей стоит одна шляпа?",
        "Подсчитай, сколько всего частей стоит вся покупка (3 шарфа и 2 шляпы), и раздели 560 рублей на это число."],
     s:"1) Шарф — 1 часть, шляпа — 2 части. 2) 3 шарфа = 3 части, 2 шляпы = 2 · 2 = 4 части. 3) Всего: 3 + 4 = 7 частей. 4) Одна часть: 560 : 7 = 80 рублей. Ответ: 80 рублей. Проверка: шляпа 160, 3 · 80 + 2 · 160 = 240 + 320 = 560."},

    {q:"Турист 3 часа шёл пешком со скоростью 6 км/ч, а потом 2 часа ехал на автобусе со скоростью 36 км/ч. Какова средняя скорость туриста на всём пути?",
     o:["21 км/ч","18 км/ч","90 км/ч","30 км/ч"], a:1,
     e:["Так получится, если сложить скорости и разделить пополам: (6 + 36) : 2. Но туриста шёл и ехал разное время, поэтому среднее арифметическое скоростей не подходит.",
        "",
        "Число 90 — весь путь (18 + 72), а не скорость. Средняя скорость равна всему пути, делённому на всё время.",
        "Здесь весь путь 90 км разделён только на 3 часа ходьбы. Делить нужно на всё время: 3 + 2 = 5 часов."],
     h:["Средняя скорость = весь путь : всё время. Найди путь, пройденный пешком, и путь, пройденный на автобусе.",
        "Сложи оба пути и раздели на общее время в пути (сумма времени ходьбы и поездки)."],
     s:"1) Пешком: 6 · 3 = 18 км. 2) На автобусе: 36 · 2 = 72 км. 3) Весь путь: 18 + 72 = 90 км. 4) Всё время: 3 + 2 = 5 ч. 5) Средняя скорость: 90 : 5 = 18 км/ч. Ответ: 18 км/ч. Проверка: 18 · 5 = 90."},

    {q:"Артём вычисляет в уме выражение 25 · 99 · 8 · 4, группируя множители удобным образом. Какой результат должен получиться?",
     o:["80000","7920","79200","79992"], a:2,
     e:["Так получится, если 99 принято за 100: 25 · 4 · 100 · 8 = 80 000. Но множитель 99 на единицу меньше, и 99 · 8 = 792, а не 800.",
        "Здесь потерян один нуль. 25 · 4 = 100, 99 · 8 = 792, и 792 · 100 = 79 200, а не 7 920.",
        "",
        "Так получится, если из 80 000 вычесть только 8. Но 99 · 8 = 800 − 8 = 792, а потом всё умножается на 100, поэтому вычитаются 800."],
     h:["Переставь множители так, чтобы получились круглые числа: 25 · 4 и 99 · 8.",
        "99 · 8 удобно считать как 100 · 8 − 8. Потом умножь результат на круглое число, полученное из 25 · 4."],
     s:"1) Группируем: (25 · 4) · (99 · 8). 2) 25 · 4 = 100. 3) 99 · 8 = 100 · 8 − 8 = 800 − 8 = 792. 4) 792 · 100 = 79 200. Ответ: 79 200."},

    {q:"Маляр покрасил бы весь забор один за 6 часов, а его помощник один — за 12 часов. Они начали красить вместе, но через 2 часа помощник ушёл, и остаток забора маляр докрашивал один. За сколько часов от начала работы был покрашен весь забор?",
     o:["4 ч","8 ч","6 ч","5 ч"], a:3,
     e:["Так получится, если всю работу делали вместе: 1 часть в 12 : (2 + 1) = 4 часа. Но помощник ушёл через 2 часа, и дальше маляр работал один.",
        "Число 8 — это 2 + 6: так считают, будто после ухода помощника маляр красит весь забор заново. Но за первые 2 часа уже покрашена часть.",
        "Здесь учтён только маляр, будто помощник не помогал. Но за первые 2 часа вдвоём они красили быстрее, чем маляр один.",
        ""],
     h:["Примите весь забор за 12 частей: сколько частей в час красит маляр и сколько помощник?",
        "Найди, сколько частей покрашено за 2 часа вдвоём, сколько осталось, и за какое время маляр докрасит остаток один."],
     s:"1) Весь забор — 12 частей. Маляр красит 12 : 6 = 2 части в час, помощник 12 : 12 = 1 часть в час. 2) Вдвоём: 2 + 1 = 3 части в час, за 2 часа: 3 · 2 = 6 частей. 3) Осталось: 12 − 6 = 6 частей. 4) Маляр один: 6 : 2 = 3 часа. 5) Всего: 2 + 3 = 5 часов. Ответ: 5 часов."},

    {q:"Пятеро друзей решили скинуться на подарок. Когда к ним присоединились ещё двое, доля каждого уменьшилась на 30 рублей. Сколько рублей стоит подарок? Ответ запиши числом.",
     n:525, m:{"150":"Так получится, если 30 рублей умножить на 5 друзей. Но разница 30 рублей — это разница долей одного человека, она не равна стоимости подарка и не умножается просто на число друзей.",
               "210":"Здесь 30 рублей умножены на 7 друзей. Это не учитывает, что доли в двух случаях разные: у пятерых каждый платит больше, чем у семерых, и разность долей 30 рублей.",
               "60":"Число 60 получено как 30 · 2 (число новых друзей). Но 30 рублей — на сколько уменьшился взнос каждого, а не общий вклад двоих."},
     w:"Пусть подарок разбит на 35 равных частей (5 · 7). Тогда при 5 друзьях каждый платит 7 частей, при 7 друзьях — 5 частей. Разница 2 части равна 30 рублям, значит, часть — 15 рублей. Подарок: 35 · 15 = 525.",
     h:["Раздели подарок на 35 равных частей (5 · 7). Сколько частей платит каждый, когда друзей 5, а сколько, когда 7?",
        "Найди, сколько частей составляют 30 рублей (это разница долей). Узнай стоимость одной части и умножь на 35."],
     s:"1) Подарок — 35 равных частей. 2) Пятеро: каждый платит 35 : 5 = 7 частей. Семеро: каждый платит 35 : 7 = 5 частей. 3) Разница долей: 7 − 5 = 2 части = 30 рублей, значит, 1 часть = 15 рублей. 4) Подарок: 35 · 15 = 525 рублей. Ответ: 525. Проверка: 525 : 5 = 105, 525 : 7 = 75, 105 − 75 = 30."},

    {q:"Два путника находятся на расстоянии 60 км друг от друга и одновременно выходят навстречу друг другу: один со скоростью 4 км/ч, другой со скоростью 6 км/ч. Вместе с первым выбегает собака со скоростью 12 км/ч. Она добегает до второго путника, сразу поворачивает к первому, и так бегает туда-обратно до тех пор, пока путники не встретятся. Сколько километров всего пробежит собака?",
     n:72, m:{"6":"Число 6 — это время в часах до встречи путников (60 : 10). Спрашивается путь собаки, поэтому время нужно умножить на скорость собаки.",
              "60":"Это расстояние между путниками. Собака бегает туда-обратно с большой скоростью и пробежит больше 60 км.",
              "120":"Здесь расстояние умножено на 2, будто собака пробежит по 60 км туда и обратно один раз. Но собака бегает столько времени, сколько идут путники."},
     w:"Путники сближаются со скоростью 4 + 6 = 10 км/ч, значит, встретятся через 60 : 10 = 6 часов. Всё это время собака бежит со скоростью 12 км/ч: 12 · 6 = 72 км. Количество поворотов считать не нужно.",
     h:["Не пытайся считать каждый пробег собаки. Подумай: как долго она бегает?",
        "Собака бегает ровно столько, сколько идут путники до встречи. Найди это время и умножь на скорость собаки."],
     s:"1) Скорость сближения путников: 4 + 6 = 10 км/ч. 2) Время до встречи: 60 : 10 = 6 ч. 3) Собака бежит всё это время: 12 · 6 = 72 км. Ответ: 72. Проверка: путники пройдут 4 · 6 = 24 и 6 · 6 = 36 км, 24 + 36 = 60."},

    {q:"На какую цифру оканчивается произведение, в котором записано 19 одинаковых множителей, каждый из которых равен 7: 7 · 7 · 7 · … · 7?",
     o:["3","7","9","1"], a:0,
     e:["",
        "Так получится, если решить, что любое нечётное число множителей даёт цифру 7. Последние цифры степеней семёрки повторяются через четыре: 7, 9, 3, 1, 7, 9, 3, 1, … Нужно найти положение 19-го множителя в этом цикле.",
        "Цифру 9 даёт 2-й множитель в цикле (7 · 7 = 49) и 6-й, 10-й и т. д. Остаток от деления 19 на 4 равен 3, а не 2.",
        "Цифру 1 даёт 4-й множитель, а также 8-й, 12-й, 16-й, 20-й. 19 не делится на 4: остаток от деления 19 на 4 равен 3, значит, это третья цифра цикла."],
     h:["Выпиши последние цифры произведений 7, 7 · 7, 7 · 7 · 7 и так далее. Какое правило повторяется?",
        "Цикл повторяется через 4 множителя. Раздели 19 на 4 с остатком: остаток покажет, какая цифра цикла нужна."],
     s:"1) Последние цифры: 7 · 7 = 49 → 9, 49 · 7 = 343 → 3, 343 · 7 = 2401 → 1, дальше снова 7. Цикл: 7, 9, 3, 1 (длина 4). 2) 19 : 4 = 4 (ост. 3): после четырёх полных циклов ещё три множителя. 3) Третья цифра цикла — 3. Ответ: 3."},

    {q:"Волшебник запирает сундук трёхзначным кодом из цифр от 0 до 9 (код может начинаться с любой цифры, в том числе с нуля). Он выбирает коды, у которых произведение цифр равно 12. Сколько существует таких кодов? Ответ запиши числом.",
     n:15, m:{"12":"Так получится, если учесть только наборы цифр 1, 2, 6 и 1, 3, 4 (по 6 кодов каждый) и пропустить набор 2, 2, 3. Он тоже даёт произведение 12 (2 · 2 · 3) и ещё 3 кода: 223, 232, 322.",
              "18":"Здесь для набора 2, 2, 3 взяты 6 перестановок. Но две двойки одинаковы: перестановка двоек местами даёт тот же код, поэтому кодов из этого набора только 3 (223, 232, 322).",
              "3":"Число 3 — количество наборов цифр (1, 2, 6; 1, 3, 4; 2, 2, 3), а не количество кодов. Из каждого набора можно составить несколько кодов, переставляя цифры."},
     w:"Разложим 12 на три цифры-множителя: 1 · 2 · 6, 1 · 3 · 4, 2 · 2 · 3. Из трёх разных цифр получается 6 перестановок, из набора 2, 2, 3 — только 3 кода. Итого 6 + 6 + 3 = 15.",
     h:["Найди все наборы из трёх цифр (от 1 до 9), произведение которых равно 12. Например, 1 · 2 · 6.",
        "Для каждого набора посчитай, сколькими способами можно расставить цифры. У трёх разных цифр 6 перестановок, а у набора с двумя одинаковыми цифрами меньше."],
     s:"1) Наборы цифр: 1, 2, 6; 1, 3, 4; 2, 2, 3 (набора с цифрой 0 нет, потому что произведение было бы 0, а набора 1, 1, 12 нет, потому что 12 не цифра). 2) 1, 2, 6: 126, 162, 216, 261, 612, 621 — 6 кодов. 3) 1, 3, 4: тоже 6 кодов. 4) 2, 2, 3: 223, 232, 322 — 3 кода. 5) Всего: 6 + 6 + 3 = 15. Ответ: 15."},

    {q:"Огород прямоугольной формы имеет площадь 144 м². Длины его сторон — целые числа метров, причём длинная сторона на 7 м больше короткой. Сколько метров изгороди нужно, чтобы обнести огород кругом? Ответ запиши числом.",
     n:50, m:{"48":"Так получится, если огород принят за квадрат 12 м на 12 м (12 · 12 = 144). Но по условию стороны отличаются на 7 м, а у квадрата они равны.",
              "52":"Это периметр прямоугольника 8 м на 18 м: его площадь 144 м², но стороны отличаются на 10 м, а не на 7 м.",
              "25":"Число 25 — полупериметр (9 + 16). Изгородь идёт вокруг всего огорода, поэтому нужны обе длины и обе ширины: периметр в 2 раза больше."},
     w:"Раскладываем 144 на два целых множителя: 1 · 144, 2 · 72, 3 · 48, 4 · 36, 6 · 24, 8 · 18, 9 · 16, 12 · 12. Разность 7 только у пары 9 и 16. Периметр: 2 · (9 + 16) = 50 м.",
     h:["Выпиши все пары целых чисел, произведение которых равно 144 (1 и 144, 2 и 72, 3 и 48 и так далее).",
        "Найди среди пар ту, у которой числа отличаются ровно на 7. Затем сложи две стороны и удвой сумму."],
     s:"1) Пары множителей числа 144: 1·144, 2·72, 3·48, 4·36, 6·24, 8·18, 9·16, 12·12. 2) Разности: 143, 70, 45, 32, 18, 10, 7, 0. Разность 7 у пары 9 и 16. 3) Периметр: 2 · (9 + 16) = 50 м. Ответ: 50. Проверка: 9 · 16 = 144, 16 − 9 = 7."}
  ]
});

        "Здесь на 4 разделено всё число 63, но в него входит и ручка: 63 : 4 = 15,75. Сначала нужно вычесть 15 рублей за ручку."],
     h:["Покупку можно разбить на две части: тетради и ручка. Что известно про часть, которая приходится на ручку?","Найди, сколько рублей заплачено за 4 тетради вместе, а затем раздели эту сумму на число тетрадей."],
     s:"Пусть тетрадь стоит x рублей. Тогда 4·x + 15 = 63. Тетради вместе стоят 63 − 15 = 48 рублей. Одна тетрадь: 48 : 4 = 12 рублей. Ответ: 12 руб. Проверка: 4·12 + 15 = 48 + 15 = 63."},

    {q:"Забор у дачи состоит из двух частей. Первая часть на 14 м длиннее второй, а весь забор имеет длину 60 м. Сколько метров во второй части? Ответ запиши в метрах.",
     n:23, m:{"37":"37 — это длина первой части (23 + 14), а спрашивается про вторую часть.",
              "46":"Так получится, если из 60 вычесть 14 и не разделить пополам: 46 м — это удвоенная вторая часть (2·x), а не одна часть.",
              "30":"Деление 60 пополам верно, только когда части равны, а здесь первая часть длиннее на 14 м."},
     w:"Пусть вторая часть x м, тогда первая x + 14 м и x + x + 14 = 60. Сначала уберите лишние 14 м из общей длины, затем разделите остаток пополам. Проверка: сумма обеих частей должна быть 60 м.",
     h:["Обозначь длину второй части буквой x и выскажи через x длину первой части.","Составь уравнение x + (x + 14) = 60. Сначала убери «лишние» 14 м из общей длины: останется удвоенная вторая часть."],
     s:"Пусть вторая часть x м, тогда первая x + 14 м. x + x + 14 = 60, 2·x = 60 − 14 = 46, x = 46 : 2 = 23. Ответ: 23. Проверка: 23 + (23 + 14) = 23 + 37 = 60."},

    {q:"Волшебник загадал число: «Если из него вычесть 8, результат умножить на 3 и прибавить 5, получится 38». Какое число загадал волшебник?",
     o:["19","11","41","3"], a:0,
     e:["",
        "Так получится, если остановиться раньше времени: 38 − 5 = 33, 33 : 3 = 11 — это число после вычитания 8. Загаданное число ещё на 8 больше.",
        "Здесь пропущено деление на 3: 38 − 5 = 33, 33 + 8 = 41. Но 33 получилось после умножения на 3, его нужно сначала разделить на 3.",
        "Здесь 8 вычтено ещё раз вместо прибавления: 33 : 3 = 11, 11 − 8 = 3. Обратное действие к «вычесть 8» — прибавить 8."],
     h:["Над числом выполнили действия по порядку: −8, ·3, +5. Чтобы найти исходное число, нужно пройти цепочку с конца, выполняя обратные действия.","Начни с 38: сначала отмени последнее действие (+5), затем умножение на 3, затем вычитание 8."],
     s:"(x − 8)·3 + 5 = 38. Идём с конца обратными действиями: 38 − 5 = 33; 33 : 3 = 11; 11 + 8 = 19. Ответ: 19. Проверка: (19 − 8)·3 + 5 = 33 + 5 = 38."},

    {q:"На левую чашу весов положили 3 одинаковые дыни и гирю в 2 кг, на правую — одну такую же дыню и гири общей массой 10 кг. Весы в равновесии. Сколько килограммов весит одна дыня?",
     o:["8 кг","6 кг","2 кг","4 кг"], a:3,
     e:["Число 8 получается как 10 − 2, но это масса двух дынь (после снятия одной дыни с каждой чаши и гири 2 кг), а не одной.",
        "Здесь гиря 2 кг прибавлена к 10 кг: 12 : 2 = 6. Но гиря лежит на левой чаше, поэтому при её снятии справа нужно вычесть: 10 − 2 = 8.",
        "Так получится, если дыни складывать, а не вычитать: 8 : (3 + 1) = 2. После снятия с каждой чаши по одной дыне слева остаются 2 дыни, а не 4.",
        ""],
     h:["Если снять с обеих чаш одно и то же, равновесие сохранится. Что можно снять в первую очередь?","Сними с каждой чаши по одной дыне и гирю 2 кг. Сколько дынь осталось слева и сколько килограммов справа?"],
     s:"3·x + 2 = x + 10. Снимем с обеих чаш по одной дыне: 2·x + 2 = 10. Снимем гирю 2 кг: 2·x = 8, x = 4. Ответ: 4 кг. Проверка: слева 3·4 + 2 = 14, справа 4 + 10 = 14."},

    {q:"В кладовой замка стоят 3 мешка с мукой и 2 мешка с сахаром. Все мешки весят одинаково, а вместе они весят 75 кг. На сколько килограммов вся мука тяжелее всего сахара?",
     o:["30 кг","15 кг","45 кг","25 кг"], a:1,
     e:["30 кг — это масса сахара (2 мешка по 15 кг), а не разность масс муки и сахара.",
        "",
        "45 кг — это масса муки (3 мешка по 15 кг). Разность находят вычитанием: 45 − 30.",
        "Так получится при делении 75 на 3: 75 : 3 = 25. Но 75 кг — это все 5 мешков, а не 3, поэтому делить нужно на 5."],
     h:["Все 5 мешков одинаковые. Сначала найди массу одного мешка.","Мука — 3 мешка, сахар — 2 мешка. Найди массу каждой части и вычти меньшую из большей."],
     s:"Пусть мешок весит x кг. 3·x + 2·x = 5·x = 75, x = 75 : 5 = 15 кг. Мука: 3·15 = 45 кг, сахар: 2·15 = 30 кг. 45 − 30 = 15. Ответ: 15 кг. Проверка: 45 + 30 = 75."},

    {q:"На склад в понедельник привезли 5 одинаковых ящиков яблок, а во вторник — 2 таких же ящика. В понедельник привезли на 51 кг яблок больше, чем во вторник. Сколько килограммов яблок в одном ящике? Ответ запиши в килограммах.",
     n:17, m:{"153":"Так получится, если 51 умножить на 3. Но 51 кг — это масса трёх ящиков (5 − 2 = 3), поэтому на один ящик приходится 51 : 3, а не 51·3.",
              "25.5":"Здесь 51 разделено на 2 (число ящиков во вторник). Но 51 кг — разница между 5 и 2 ящиками, то есть масса 3 ящиков.",
              "10.2":"Здесь 51 разделено на 5 (число ящиков в понедельник). Но 51 кг — это разница 5·x − 2·x = 3·x, то есть масса 3 ящиков."},
     w:"Пусть в ящике x кг: 5·x − 2·x = 51, то есть 3·x = 51. Найдите x и проверьте: 5·x − 2·x должно получиться 51.",
     h:["Выскажи массу яблок в каждый из двух дней через массу одного ящика x.","Разность 5·x − 2·x — это сколько ящиков? Именно такая масса равна 51 кг."],
     s:"Пусть в одном ящике x кг. В понедельник 5·x, во вторник 2·x. 5·x − 2·x = 51, 3·x = 51, x = 51 : 3 = 17. Ответ: 17. Проверка: 5·17 = 85, 2·17 = 34, 85 − 34 = 51."},

    {q:"Сейчас Артёму 9 лет, а его отцу 39 лет. Артём заметил, что сейчас сумма их возрастов равна 48. Через сколько лет эта сумма станет равна 70?",
     o:["22","31","11","61"], a:2,
     e:["Так получится, если не разделить на 2: 70 − 48 = 22 — это общий прирост суммы. Но за каждый год прибавляется по году и Артёму, и отцу, поэтому сумма растёт на 2 в год.",
        "Здесь из 70 вычтен только возраст отца: 70 − 39 = 31. Но в сумму входит и возраст Артёма, а за каждый год к сумме прибавляется сразу 2 года.",
        "",
        "Здесь из 70 вычтен только возраст Артёма: 70 − 9 = 61. Но возраст отца тоже растёт, и за один год сумма увеличивается сразу на 2."],
     h:["Каждый год возраст Артёма и возраст отца растут на 1. На сколько за год увеличивается их сумма?","Найди, на сколько нужно увеличить сумму 48, чтобы получить 70, и раздели на прирост суммы за один год."],
     s:"Сумма сейчас 9 + 39 = 48. Она должна вырасти на 70 − 48 = 22. За каждый год сумма растёт на 2 (по 1 году у отца и у Артёма): 22 : 2 = 11. Ответ: через 11 лет. Проверка: Артёму 20, отцу 50, 20 + 50 = 70."},

    {q:"Чтобы открыть сундук, принцесса должна решить уравнение 96 : (x + 4) − 5 = 7 и набрать на замке найденное число x. Какое число нужно набрать?",
     n:4, m:{"8":"Так получится, если остановиться на x + 4 = 8: это значение скобки. Само x на 4 меньше (8 − 4).",
             "12":"12 — значение выражения 96 : (x + 4). Но надо ещё найти делитель (96 : 12 = 8) и затем x.",
             "44":"Здесь 5 вычтено, а не прибавлено: 7 − 5 = 2, 96 : 2 = 48, 48 − 4 = 44. Вычитаемое 5 восстанавливают сложением: 7 + 5 = 12."},
     w:"Распутывайте уравнение с конца: уменьшаемое = разность + вычитаемое, делитель = делимое : частное. Проверьте найденное x подстановкой в 96 : (x + 4) − 5.",
     h:["Распутывай уравнение с конца. Сначала найди уменьшаемое 96 : (x + 4) — число, из которого вычли 5 и получили 7.","Когда значение выражения 96 : (x + 4) известно, найди делитель x + 4 как делимое : частное, а затем само x."],
     s:"96 : (x + 4) − 5 = 7. Уменьшаемое: 96 : (x + 4) = 7 + 5 = 12. Делитель: x + 4 = 96 : 12 = 8. Тогда x = 8 − 4 = 4. Ответ: 4. Проверка: 96 : (4 + 4) − 5 = 12 − 5 = 7."},

    {q:"Три друга ходили за грибами и собрали вместе 89 грибов. Миша собрал на 12 грибов больше, чем Аня, а Артём — на 7 грибов меньше, чем Миша. Сколько грибов собрал Артём?",
     o:["29","24","36","21"], a:0,
     e:["",
        "24 — это число грибов Ани (x), а спрашивается про Артёма. Артём собрал на 12 − 7 = 5 грибов больше Ани.",
        "36 — число грибов Миши (24 + 12). Артём собрал на 7 грибов меньше Миши.",
        "Здесь «на 7 меньше» отсчитано от Ани, а не от Миши. Тогда сумма была бы 3·x + 5 = 89 и x = 28; но Артём на 7 меньше Миши, то есть на 5 больше Ани."],
     h:["Обозначь число грибов Ани через x. Выскажи через x грибы Миши, а затем грибы Артёма.","Артём собрал на 12 − 7 = 5 грибов больше Ани. Составь сумму трёх количеств и найди x."],
     s:"Пусть у Ани x грибов. У Миши x + 12, у Артёма (x + 12) − 7 = x + 5. Всего: x + (x + 12) + (x + 5) = 3·x + 17 = 89. 3·x = 89 − 17 = 72, x = 24. Артём собрал 24 + 5 = 29. Ответ: 29. Проверка: 24 + 36 + 29 = 89."},

    {q:"Прямоугольный огород отгородили забором. Длина огорода на 3 м больше ширины, а площадь равна 70 м². Ширина — целое число метров. Найди подбором ширину и вычисли, сколько метров забора нужно, чтобы обойти огород по периметру.",
     o:["17 м","24 м","20 м","34 м"], a:3,
     e:["17 м — это полупериметр (7 + 10). Периметр — сумма всех четырёх сторон, то есть вдвое больше.",
        "Так получится, если сложить три стороны: 7 + 10 + 7 = 24. Периметр включает все четыре стороны: 2·(7 + 10).",
        "Так получится, если учесть только две длинные стороны: 2·10 = 20. Нужно ещё две ширины по 7 м.",
        ""],
     h:["Ищи два числа, которые отличаются на 3 и дают в произведении 70. Перебирай пары множителей числа 70.","Когда найдёшь пару (ширина, длина), вспомни: периметр — сумма всех четырёх сторон прямоугольника."],
     s:"Пары множителей числа 70: 1·70, 2·35, 5·14, 7·10. Разность 3 только у пары 7 и 10. Значит, ширина 7 м, длина 10 м; проверка: 7·10 = 70 и 10 − 7 = 3. Периметр: 2·(7 + 10) = 34 м. Ответ: 34 м."},

    {q:"На каждой из 4 клумб посадили по 6 тюльпанов и по несколько роз, причём роз на всех клумбах одинаково. Потом 10 цветков пересадили на другой участок, и на клумбах осталось 70 цветков. Сколько роз посадили на каждой клумбе?",
     o:["20","14","11,5","9"], a:1,
     e:["20 — это число цветков на одной клумбе до пересадки (80 : 4). Но в них входят и 6 тюльпанов, поэтому роз 20 − 6 = 14.",
        "",
        "Здесь не учтены пересаженные 10 цветков: 70 : 4 − 6 = 11,5. До пересадки цветов было на 10 больше: 70 + 10 = 80.",
        "Здесь 10 пересаженных цветков вычтены ещё раз вместо прибавления: (70 − 10) : 4 − 6 = 9. До пересадки цветов было больше, чем 70: 70 + 10 = 80."],
     h:["Сколько цветков было на всех клумбах до пересадки? Ведь 10 из них потом забрали.","Раздели это число на 4, чтобы получить цветки на одной клумбе, и вычти тюльпаны."],
     s:"Пусть на клумбе x роз: (x + 6)·4 − 10 = 70. До пересадки было 70 + 10 = 80 цветков. На одной клумбе: 80 : 4 = 20 цветков. Роз: 20 − 6 = 14. Ответ: 14. Проверка: (14 + 6)·4 − 10 = 80 − 10 = 70."},

    {q:"На огородных весах взвешивали тыквы. Одна большая тыква весит столько же, сколько 2 маленькие тыквы и гиря 3 кг. А две большие тыквы весят столько же, сколько 5 маленьких. Сколько килограммов весит большая тыква?",
     o:["6 кг","12 кг","15 кг","30 кг"], a:2,
     e:["6 кг — это масса маленькой тыквы, а спрашивается про большую: 2·6 + 3 = 15.",
        "12 кг — это только две маленькие тыквы (2·6), без гири 3 кг. Большая тыква весит 12 + 3.",
        "",
        "30 кг — это масса двух больших тыкв (она равна массе 5 маленьких). Одна большая тыква весит вдвое меньше."],
     h:["В равенстве «две большие тыквы = 5 маленьких» замени каждую большую тыкву на «2 маленькие и гиря 3 кг».","Тогда слева окажутся 4 маленькие тыквы и гиря 6 кг, а справа 5 маленьких. Сколько весит одна маленькая?"],
     s:"Пусть маленькая тыква весит m кг. Большая весит 2·m + 3. Две большие: 4·m + 6. Они равны 5 маленьким: 4·m + 6 = 5·m, значит, m = 6 кг. Большая: 2·6 + 3 = 15 кг. Ответ: 15 кг. Проверка: 2·15 = 30 и 5·6 = 30."},

    {q:"Турист за три дня прошёл 80 км. Во второй день он прошёл на 4 км больше, чем в первый, а в третий — вдвое больше, чем во второй. Сколько километров он прошёл в третий день?",
     o:["42 км","38 км","21 км","17 км"], a:0,
     e:["",
        "Так получится, если «вдвое больше, чем во второй» понять как удвоенный первый день: тогда 4·x + 4 = 80, x = 19, 2·19 = 38. Но удвоение относится ко второму дню (x + 4).",
        "21 км — путь во второй день (17 + 4). В третий день он прошёл вдвое больше: 21·2.",
        "17 км — путь в первый день. В третий день путь вдвое больше, чем во второй день, а не равен первому."],
     h:["Пусть в первый день турист прошёл x км. Выскажи через x путь во второй день, а затем в третий.","Всего: x + (x + 4) + 2·(x + 4) = 80. Сколько получилось «иксов» и сколько отдельных километров?"],
     s:"Пусть в первый день x км, во второй x + 4 км, в третий 2·(x + 4) = 2·x + 8 км. Всего: x + x + 4 + 2·x + 8 = 4·x + 12 = 80, 4·x = 68, x = 17. Второй день: 21 км, третий: 42 км. Ответ: 42 км. Проверка: 17 + 21 + 42 = 80."},

    {q:"Мама старше дочери Лены на 28 лет. Лена подсчитала, что через 6 лет мама будет старше неё ровно в 3 раза. Сколько лет Лене сейчас? Ответ запиши числом.",
     n:8, m:{"14":"Так получится, если найти возраст Лены через 6 лет (28 : 2 = 14) и не вычесть эти 6 лет. Вопрос про возраст сейчас.",
             "16":"Здесь не выполнено деление на 2: из уравнения x + 34 = 3·x + 18 получается 2·x = 16, а x = 8.",
             "36":"36 — возраст мамы сейчас (8 + 28). Вопрос про Лену."},
     w:"Разность возрастов не меняется и равна 28 лет. Через 6 лет она составляет 2 части (3 − 1). Найдите одну часть, а затем вернитесь на 6 лет назад.",
     h:["Разность возрастов со временем не меняется. Через 6 лет мама втрое старше: сколько «частей» составляет разность 28 лет?","Если 28 лет — это 2 части, найди возраст Лены через 6 лет, а затем вернись на 6 лет назад."],
     s:"Разность возрастов всегда равна 28 лет. Через 6 лет у Лены 1 часть, у мамы 3 части, разность — 2 части. 2 части = 28 лет, значит, 1 часть = 14: через 6 лет Лене будет 14. Сейчас Лене 14 − 6 = 8 лет. Ответ: 8. Проверка: сейчас маме 36; через 6 лет им 42 и 14, и 42 = 3·14."},

    {q:"Лена купила 3 одинаковых блокнота и 2 одинаковых альбома и заплатила за всё 330 рублей. Альбом на 15 рублей дороже блокнота. Сколько рублей стоит блокнот? Ответ запиши в рублях.",
     n:60, m:{"75":"75 рублей — цена альбома (60 + 15). Спрашивается про блокнот.",
              "66":"Так получится при делении 330 на 5 покупок поровну. Но альбом дороже на 15 рублей, поэтому цены разные и делить поровну нельзя.",
              "63":"Здесь 15 рублей вычтено только один раз: (330 − 15) : 5 = 63. Но «на 15 рублей дороже» относится к каждому из двух альбомов — нужно вычесть 2·15 = 30."},
     w:"Пусть блокнот стоит x рублей, альбом x + 15. Тогда 3·x + 2·(x + 15) = 330. Раскройте скобку, уберите лишние рубли и разделите на число «иксов».",
     h:["Обозначь цену блокнота через x, тогда альбом стоит x + 15. Запиши стоимость 3 блокнотов и 2 альбомов.","Два альбома стоят 2·x + 30. Сколько «иксов» получится вместе и сколько отдельных рублей?"],
     s:"Пусть блокнот стоит x руб., альбом x + 15 руб. 3·x + 2·(x + 15) = 330, 5·x + 30 = 330, 5·x = 300, x = 60. Альбом стоит 75 руб. Ответ: 60. Проверка: 3·60 + 2·75 = 180 + 150 = 330."},

    {q:"В автобусе ехало несколько пассажиров. На остановке вышла треть всех пассажиров, а вошло 6 человек, и в автобусе стало 30 человек. Сколько пассажиров ехало сначала?",
     n:36, m:{"54":"Так получится, если 6 вошедших не вычесть, а прибавить: 30 + 6 = 36 — это {2/3} пассажиров, и 36 : 2·3 = 54. Но 6 человек вошли уже после выхода трети, их нужно убрать.",
              "24":"24 — число пассажиров, оставшихся после выхода трети (30 − 6), то есть {2/3} от начального числа. Нужно найти всё число пассажиров.",
              "48":"Здесь 24 удвоено, хотя 24 — это 2 трети. Сначала найдите одну треть (24 : 2 = 12), затем все три трети."},
     w:"Пусть пассажиров было x. Осталось {2/3}·x, потом вошло 6: {2/3}·x + 6 = 30. Уберите 6, найдите одну треть и умножьте на 3.",
     h:["Если вышла треть пассажиров, какая часть осталась? Обозначь исходное число пассажиров через x.","Сначала убери 6 вошедших: останется {2/3} от x. Раздели это число на 2, чтобы узнать одну треть, и найди все три трети."],
     s:"Осталось {2/3} пассажиров, затем вошло 6: {2/3}·x + 6 = 30. {2/3}·x = 30 − 6 = 24. Одна треть: 24 : 2 = 12, всё число: 12·3 = 36. Ответ: 36. Проверка: вышло 12, осталось 24, вошло 6 — стало 30."},

    {q:"В двух бидонах было поровну молока. Из первого бидона отлили 8 л, а во второй долили 14 л, и во втором бидоне стало втрое больше молока, чем в первом. Сколько литров молока было в каждом бидоне сначала?",
     o:["38","33","11","19"], a:3,
     e:["38 — это значение 2·x: уравнение 2·x = 38 решено не до конца, нужно ещё разделить на 2.",
        "33 л — столько молока стало во втором бидоне (19 + 14), а не было сначала.",
        "11 л — столько молока осталось в первом бидоне (19 − 8), а не было сначала.",
        ""],
     h:["Обозначь первоначальное количество молока в каждом бидоне через x. Сколько стало в первом и сколько во втором?","Во втором втрое больше: x + 14 = 3·(x − 8). Раскрой скобку и сравни «иксы» и отдельные литры."],
     s:"Пусть было по x литров. Стало: в первом x − 8, во втором x + 14. x + 14 = 3·(x − 8) = 3·x − 24. Значит, 3·x − x = 14 + 24, 2·x = 38, x = 19. Ответ: 19 л. Проверка: 19 − 8 = 11, 19 + 14 = 33, 33 = 3·11."},

    {q:"Задумали число. К нему прибавили его утроенное значение, из суммы вычли 8 и результат разделили на 4. Получилось 13. Какое число задумали?",
     o:["60","15","52","11"], a:1,
     e:["60 — это значение суммы «число + утроенное число», то есть четыре одинаковых числа. Осталось разделить 60 на 4.",
        "",
        "52 = 13·4 — результат до деления на 4, но в нём ещё вычтено 8. Сначала нужно отменить вычитание: 52 + 8 = 60.",
        "Здесь 8 вычтено вместо прибавления: (52 − 8) : 4 = 11. Обратное действие к «вычесть 8» — прибавить 8."],
     h:["Число плюс утроенное число — это сколько таких чисел вместе? Распутывай цепочку с конца: сначала отмени деление на 4.","Умножь 13 на 4 и прибавь 8 — получится значение суммы «число + утроенное число». Сколько одинаковых чисел в этой сумме?"],
     s:"Пусть число x. (x + 3·x − 8) : 4 = 13. Идём с конца: 13·4 = 52; 52 + 8 = 60 — это x + 3·x = 4·x. x = 60 : 4 = 15. Ответ: 15. Проверка: 15 + 45 = 60, 60 − 8 = 52, 52 : 4 = 13."},

    {q:"В двух корзинах вместе 90 яблок. Когда из первой корзины переложили во вторую 15 яблок, в первой корзине стало вдвое больше яблок, чем во второй. Сколько яблок было во второй корзине сначала?",
     n:15, m:{"30":"30 — число яблок во второй корзине после перекладывания. Сначала там было на 15 яблок меньше.",
              "75":"75 — число яблок в первой корзине сначала (60 + 15). Вопрос про вторую корзину.",
              "45":"Так получится при делении 90 пополам. Но после перекладывания яблок не поровну: в первой вдвое больше, чем во второй, то есть всего 3 равные части."},
     w:"После перекладывания в первой корзине 2 части, во второй 1 часть, всего 3 части по 90 : 3 яблок. Затем верните 15 яблок обратно: у второй корзины они были лишними.",
     h:["После перекладывания в первой корзине вдвое больше, чем во второй, — значит, всего 3 равные части. Сколько яблок в одной части?","Найди число яблок во второй корзине после перекладывания, а затем «верни» 15 яблок обратно."],
     s:"Всего 90 яблок. После перекладывания в первой 2 части, во второй 1 часть, всего 3 части. Одна часть: 90 : 3 = 30 — столько стало во второй корзине (в первой 60). Во вторую переложили 15 яблок, значит, сначала там было 30 − 15 = 15. Ответ: 15. Проверка: сначала 75 и 15 (всего 90); после перекладывания 60 и 30, и 60 = 2·30."},

    {q:"У трёх братьев вместе 156 монет. Старший отдал среднему 10 монет, потом средний отдал младшему 6 монет, и после этого у всех братьев стало поровну. Сколько монет было у среднего брата сначала?",

        "52 — столько монет у каждого брата стало в конце (156 : 3). Но средний получил 10 и отдал 6, поэтому сначала у него было другое число.",
        "Здесь 4 монеты (10 − 6) прибавлены к 52, а нужно вычесть: у среднего в итоге на 4 монеты больше, чем было сначала, значит, сначала меньше.",
        "62 — столько монет было у старшего (52 + 10), а спрашивается про среднего брата."],
     h:["Поровну стало у всех — сколько монет у каждого в конце? Затем иди назад, отменяя передачи монет.","Средний получил 10 и отдал 6. На сколько в итоге изменилось число его монет и в какую сторону?"],
     s:"В конце у каждого брата 156 : 3 = 52 монеты. Средний получил 10 и отдал 6, то есть в итоге получил на 10 − 6 = 4 монеты больше, чем было. Значит, сначала у него 52 − 4 = 48 монет. Проверка: у старшего было 52 + 10 = 62, у младшего 52 − 6 = 46, 62 + 48 + 46 = 156. Ответ: 48."}

TOPICS.push({
  id:"frac", title:"Дворец Дробей", sub:"Обыкновенные дроби и задачи на части", glyph:"{1/2}", color:"#ffa94d",
  theory:[
    "Дробь {a/b} показывает, что целое разделили на b равных долей и взяли a таких долей. Чтобы найти {a/b} от числа, число делят на b и результат умножают на a: {3/4} от 20 = 20 ÷ 4 × 3 = 15.",
    "Чтобы найти число по его дроби, сначала находят одну долю, а потом всё число: если {3/4} числа равны 15, то одна доля 15 ÷ 3 = 5, а всё число 5 × 4 = 20. Слова «часть остатка» означают, что дробь берут от того, что осталось, а не от целого.",
    "Дроби с одинаковыми знаменателями складывают и вычитают по числителям: {3/8} + {4/8} = {7/8}. Если числитель не меньше знаменателя, дробь неправильная и равна 1 или больше: {7/4} = 1{3/4}. При умножении смешанного числа на число умножают отдельно целую и дробную части.",
    "Сравнение: при равных знаменателях больше дробь с большим числителем, при равных числителях больше дробь с меньшим знаменателем. Полезно сравнивать с 1 и с {1/2}. В 1 часе 60 минут, поэтому {3/4} часа = 45 минут."
  ],
  tasks:[
    {q:"Туристы шли по маршруту длиной 36 км. В первый день они прошли {1/4} всего маршрута, во второй день — {1/3} всего маршрута. Сколько километров им осталось пройти до конца маршрута?",
     o:["21 км","27 км","15 км","24 км"], a:2,
     e:["Так получится, если найти, сколько пройдено за два дня: 9 + 12 = 21 км. Но спрашивается, сколько осталось, поэтому это число нужно вычесть из 36 км.",
        "Здесь вычтена только часть первого дня: 36 − 9 = 27 км. Не учтено, что во второй день пройдено ещё {1/3} маршрута, то есть 12 км.",
        "",
        "Здесь вычтена только часть второго дня: 36 − 12 = 24 км. Не учтено, что в первый день пройдена {1/4} маршрута, то есть 9 км."],
     h:["Найди, сколько километров прошли в первый день ({1/4} от 36 км) и сколько во второй день ({1/3} от 36 км).",
        "Обе дроби берутся от всего маршрута, то есть от 36 км. Сложи пройденное за два дня и вычти эту сумму из длины всего маршрута."],
     s:"1) {1/4} от 36 = 36 ÷ 4 = 9 км. 2) {1/3} от 36 = 36 ÷ 3 = 12 км. 3) За два дня пройдено 9 + 12 = 21 км. 4) Осталось 36 − 21 = 15 км. Ответ: 15 км. Проверка: 9 + 12 + 15 = 36 км."},

    {q:"В классе 24 ученика. {1/3} класса ходят на кружок рисования, {3/8} класса — в бассейн. Никто из учеников не посещает сразу и кружок, и бассейн. Сколько учеников не ходят ни на кружок, ни в бассейн?",
     n:7,
     m:{"17":"Так получится, если найти число учеников, которые ходят на кружок или в бассейн: 8 + 9 = 17. Но спрашивается про тех, кто не ходит никуда, поэтому 17 нужно вычесть из 24.",
        "16":"Здесь из 24 вычтены только кружковцы (8 человек). Не учтено, что ещё 9 учеников ходят в бассейн.",
        "15":"Здесь из 24 вычтены только пловцы (9 человек). Не учтено, что ещё 8 учеников ходят на кружок рисования."},
     w:"Нужно найти {1/3} от 24 (это 8 учеников) и {3/8} от 24 (это 9 учеников), сложить результаты (17 человек) и вычесть сумму из 24.",
     h:["Найди отдельно число кружковцев ({1/3} от 24) и число пловцов ({3/8} от 24). Дробь от числа: разделить на знаменатель и умножить на числитель.",
        "Так как никто не ходит в обе секции, числа кружковцев и пловцов можно просто сложить. Сколько останется от 24 учеников, если вычесть эту сумму?"],
     s:"1) {1/3} от 24 = 24 ÷ 3 = 8 учеников. 2) {3/8} от 24 = 24 ÷ 8 × 3 = 9 учеников. 3) Ходят куда-либо: 8 + 9 = 17. 4) Не ходят никуда: 24 − 17 = 7. Ответ: 7. Проверка: 8 + 9 + 7 = 24."},

    {q:"Аня читает толстую книгу сказок. За выходные она прочитала 72 страницы, и это составило {3/8} всей книги. Сколько страниц ей ещё осталось прочитать?",
     o:["120 стр.","192 стр.","27 стр.","48 стр."], a:0,
     e:["",
        "Это число страниц во всей книге (72 ÷ 3 × 8 = 192). Но спрашивается, сколько страниц осталось, поэтому прочитанные 72 страницы нужно ещё вычесть.",
        "Так получится, если {3/8} взять от 72 (72 ÷ 8 × 3 = 27). Но 72 страницы — это сама часть {3/8} книги, а не целое: нужно искать целое, а не часть от части.",
        "Так получится, если из 72 вычесть только одну долю книги (24 страницы). Но прочитано три доли из восьми, и осталось пять долей."],
     h:["{3/8} книги — это 3 доли из 8 одинаковых. Узнай, сколько страниц приходится на одну долю.",
        "Когда найдена одна доля, можно найти всю книгу и вычесть прочитанное. Или сразу посчитать, сколько долей осталось дочитать."],
     s:"1) 3 доли — это 72 стр., значит, 1 доля = 72 ÷ 3 = 24 стр. 2) Вся книга: 24 × 8 = 192 стр. 3) Осталось: 192 − 72 = 120 стр. (или 5 долей: 24 × 5 = 120). Ответ: 120 стр. Проверка: {3/8} + {5/8} = 1, а 72 + 120 = 192."},

    {q:"Бригада красила забор. В понедельник покрасили {3/10} всего забора, во вторник — ещё {4/10}. Остаток забора, 9 метров, докрасили в среду. Какова длина всего забора?",
     o:["21 м","30 м","90 м","27 м"], a:1,
     e:["Это длина забора, покрашенная за понедельник и вторник ({7/10} забора: 9 ÷ 3 × 7 = 21 м). Но спрашивается длина всего забора.",
        "",
        "Так получится, если принять 9 м за одну десятую часть забора (9 × 10). Но остаток составляет {10/10} − {3/10} − {4/10} = {3/10}, то есть 9 м — это три десятых.",
        "Так получится, если 9 умножить на числитель (9 × 3). Но 9 м — это три доли, поэтому сначала находят одну долю: 9 ÷ 3 = 3 м, а потом умножают на 10."],
     h:["Сложи части забора, покрашенные в понедельник и во вторник, и найди, какую часть забора составляет остаток.",
        "Остаток — несколько десятых долей забора, и он равен 9 м. Найди длину одной десятой, а затем всего забора."],
     s:"1) Покрашено за два дня: {3/10} + {4/10} = {7/10} забора. 2) Остаток: {10/10} − {7/10} = {3/10} забора. 3) {3/10} забора — это 9 м, значит, {1/10} — это 9 ÷ 3 = 3 м. 4) Весь забор: 3 × 10 = 30 м. Ответ: 30 м. Проверка: 30 ÷ 10 × 3 = 9 м, 30 ÷ 10 × 4 = 12 м, 9 + 12 + 9 = 30 м."},

    {q:"Хозяйка купила на рынке 2{3/5} кг яблок. Груш она купила на 1{4/5} кг больше, чем яблок, а слив — на 2{2/5} кг меньше, чем груш. Сколько килограммов фруктов купила хозяйка? Ответ запиши в килограммах.",
     n:9,
     m:{"7":"Так получится, если сложить только яблоки и груши: 2{3/5} + 4{2/5} = 7 кг. Не учтены сливы, а они тоже входят в фрукты.",
        "13.8":"Так получится, если массу слив найти прибавлением: 4{2/5} + 2{2/5} = 6{4/5} кг. Но слив на 2{2/5} кг меньше, чем груш, значит, это нужно вычитать.",
        "4.4":"Так найдена только масса груш: 2{3/5} + 1{4/5} = 4{2/5} кг. Но спрашивается про все фрукты вместе: ещё нужно найти сливы и сложить три массы."},
     w:"Груши: 2{3/5} + 1{4/5} = 4{2/5} кг. Сливы: 4{2/5} − 2{2/5} = 2 кг. Всего: 2{3/5} + 4{2/5} + 2 = 9 кг.",
     h:["Найди по очереди массу груш (на 1{4/5} кг больше яблок) и массу слив (на 2{2/5} кг меньше груш). Целые части и дробные считай отдельно.",
        "Когда складываешь {3/5} + {4/5}, получится неправильная дробь {7/5} — выдели из неё целое. После этого сложи массы яблок, груш и слив."],
     s:"1) Груши: 2{3/5} + 1{4/5} = 3{7/5} = 4{2/5} кг. 2) Сливы: 4{2/5} − 2{2/5} = 2 кг. 3) Всего: 2{3/5} + 4{2/5} + 2 = 6{5/5} + 2 = 7 + 2 = 9 кг. Ответ: 9. Проверка в десятичных дробях: 2,6 + 4,4 + 2 = 9."},

    {q:"Четыре друга бежали вдоль озера. Аня пробежала {5/8} км, Миша — {5/6} км, Лена — {3/8} км, а Артём — 1{1/6} км. Расставь друзей в порядке убывания: от пробежавшего больше всех до пробежавшего меньше всех.",
     o:["Артём, Аня, Миша, Лена","Миша, Аня, Лена, Артём","Лена, Аня, Миша, Артём","Артём, Миша, Аня, Лена"], a:3,
     e:["Так получится, если считать, что при равных числителях больше та дробь, у которой больше знаменатель ({5/8} > {5/6}). На самом деле чем больше знаменатель, тем мельче доли, и {5/6} больше {5/8}.",
        "У Артёма учтена только дробная часть {1/6}, а целый километр потерян. Но 1{1/6} км — это больше 1 км, то есть больше любой из остальных дробей.",
        "Здесь порядок обратный: от меньшего к большему. В задаче нужно идти от пробежавшего больше всех к пробежавшему меньше всех.",
        ""],
     h:["Сначала найди число больше 1 (смешанное число). Остальные три дроби — правильные, то есть меньше 1; их сравнивай попарно.",
        "У {5/8} и {5/6} одинаковые числители, а у {5/8} и {3/8} — одинаковые знаменатели. Подумай, на сколько частей разделён километр в каждом случае и сколько таких частей взято."],
     s:"1) 1{1/6} км больше 1 км, а три остальные дроби меньше 1 км, поэтому Артём пробежал больше всех. 2) {5/6} и {5/8}: числители равны, а доли {1/6} крупнее долей {1/8}, поэтому {5/6} > {5/8}. 3) {5/8} и {3/8}: знаменатели равны, числитель 5 больше 3, поэтому {5/8} > {3/8}. 4) Порядок убывания: Артём, Миша, Аня, Лена. Ответ: Артём, Миша, Аня, Лена. Проверка в десятичных дробях: 1,17 > 0,83 > 0,63 > 0,38."},

    {q:"Корабль шёл из порта к острову с замком, расстояние до которого 120 км. В первый день он прошёл {1/4} всего пути. Во второй день — {1/3} оставшегося пути, а в третий — {2/5} того, что осталось после второго дня. Сколько километров осталось до острова после третьего дня?",
     o:["36 км","60 км","24 км","2 км"], a:0,
     e:["",
        "Так получится, если учесть только первые два дня. Путь третьего дня ({2/5} от 60 км, то есть 24 км) тоже нужно вычесть.",
        "Это только путь, пройденный в третий день: 60 ÷ 5 × 2 = 24 км. Спрашивается, сколько осталось, поэтому эти 24 км нужно вычесть из 60 км.",
        "Так получится, если все дроби считать от всего пути (30 + 40 + 48 = 118 км, 120 − 118 = 2 км). Но во второй и третий день дроби берутся от остатка, а не от 120 км."],
     h:["Считай день за днём и после каждого дня записывай новый остаток. Во второй день {1/3} берётся от остатка после первого дня, в третий — {2/5} от остатка после второго дня.",
        "Первый день: 120 ÷ 4. Вычти это из 120 — получится остаток, от которого нужно брать {1/3}. Затем повтори то же самое для третьего дня."],
     s:"1) Первый день: 120 ÷ 4 = 30 км, осталось 120 − 30 = 90 км. 2) Второй день: 90 ÷ 3 = 30 км, осталось 90 − 30 = 60 км. 3) Третий день: 60 ÷ 5 × 2 = 24 км, осталось 60 − 24 = 36 км. Ответ: 36 км. Проверка: 30 + 30 + 24 + 36 = 120 км."},

    {q:"В школьном лагере отдыхают 60 детей. {2/5} из них — мальчики, остальные — девочки. В поход пошли {3/4} всех мальчиков и {5/12} всех девочек. Сколько детей остались в лагере?",
     n:27,
     m:{"33":"Так найдено число детей, которые ушли в поход (18 + 15 = 33). Но спрашивается, сколько осталось в лагере, поэтому 33 нужно вычесть из 60.",
        "21":"Здесь учтены только девочки: 36 − 15 = 21. Не учтены мальчики, оставшиеся в лагере (24 − 18 = 6).",
        "23":"Так получится, если {2/5} принять за долю девочек, а не мальчиков. В условии {2/5} всех детей — мальчики (24 человека), девочек 36."},
     w:"Мальчиков 60 ÷ 5 × 2 = 24, девочек 36. В поход ушли 24 ÷ 4 × 3 = 18 мальчиков и 36 ÷ 12 × 5 = 15 девочек, всего 33. В лагере 60 − 33 = 27 детей.",
     h:["Найди отдельно число мальчиков и число девочек. Затем отдельно вычисли, сколько мальчиков и сколько девочек ушли в поход.",
        "Дробь {3/4} берётся от числа мальчиков, а {5/12} — от числа девочек, а не от 60. Найди, сколько детей ушло в поход, и вычти это число из 60."],
     s:"1) Мальчиков: 60 ÷ 5 × 2 = 24, девочек: 60 − 24 = 36. 2) В поход пошли мальчики: 24 ÷ 4 × 3 = 18, и девочки: 36 ÷ 12 × 5 = 15. 3) Всего ушли: 18 + 15 = 33 ребёнка. 4) В лагере остались: 60 − 33 = 27 детей. Ответ: 27. Проверка: остались 6 мальчиков и 21 девочка, 6 + 21 = 27."},

    {q:"В кувшине 12 л морса, в котором {1/4} объёма составляет клюквенный сок, а остальное — вода. Повар отлил из кувшина {1/3} морса, а затем долил в кувшин столько же литров чистой воды. Какую часть морса теперь составляет клюквенный сок?",
     o:["{1/4}","{1/12}","{1/3}","{1/6}"], a:3,
     e:["Так получится, если считать, что доля сока не изменилась. Но вместе с морсом отлита и часть сока (1 л), а долита чистая вода, поэтому доля сока уменьшилась.",
        "Так получится, если считать, что сока осталось 1 л, ведь столько его было в отлитом морсе. Но в кувшине остались 3 − 1 = 2 л сока.",
        "Здесь доля отлитого морса ({1/3}) принята за долю сока. Это разные величины: {1/3} показывает, сколько отлили, а количество сока нужно найти в литрах.",
        ""],
     h:["Найди, сколько литров сока было в кувшине вначале. Затем выясни, сколько литров морса отлили и сколько сока в нём было: сока в отлитой порции столько же долей, как и во всём кувшине.",
        "Вычти сок, ушедший с отлитым морсом, из первоначального количества сока. После доливки воды в кувшине снова 12 л морса."],
     s:"1) Сока было 12 ÷ 4 = 3 л. 2) Отлили 12 ÷ 3 = 4 л морса; в нём сока {1/4}, то есть 4 ÷ 4 = 1 л. 3) Сока осталось 3 − 1 = 2 л. 4) После доливки воды в кувшине снова 12 л, и сока в нём 2 л, то есть {2/12} = {1/6}. Ответ: {1/6}. Проверка: сок 2 л, вода 10 л, 2 + 10 = 12 л."},

    {q:"У Артёма на домашние дела отведено ровно 2 часа. Математика заняла {1/3} часа, русский язык — {3/4} часа, чтение — {5/12} часа. Всё остальное время Артём гулял. Сколько минут длилась прогулка? Ответ запиши в минутах.",
     n:30,
     m:{"90":"Так получится, если найти общее время занятий (20 + 45 + 25 = 90 мин). Но спрашивается про прогулку, поэтому это время нужно вычесть из 2 часов (120 мин).",
        "0.5":"Время прогулки найдено верно ({1/2} часа), но записано в часах. В задаче нужны минуты: {1/2} часа = 30 мин."},
     w:"{1/3} часа = 20 мин, {3/4} часа = 45 мин, {5/12} часа = 25 мин, всего 90 мин. 2 часа = 120 мин, значит, прогулка 120 − 90 = 30 мин.",
     h:["Переведи каждую долю часа в минуты: {1/3} часа — это 60 ÷ 3 минут. Так же поступи с двумя другими долями.",
        "Сложи минуты трёх занятий. Затем переведи 2 часа в минуты и вычти сумму."],
     s:"1) {1/3} часа = 60 ÷ 3 = 20 мин; {3/4} часа = 60 ÷ 4 × 3 = 45 мин; {5/12} часа = 60 ÷ 12 × 5 = 25 мин. 2) Занятия: 20 + 45 + 25 = 90 мин. 3) 2 часа = 120 мин. 4) Прогулка: 120 − 90 = 30 мин. Ответ: 30. Проверка: 90 мин = 1{1/2} часа, 2 − 1{1/2} = {1/2} часа = 30 мин."},

    {q:"Аня копила деньги. Часть сбережений, а именно {3/8}, она потратила на книгу. На тетради она потратила {2/5} того, что осталось после покупки книги. Оказалось, что тетради обошлись на 30 руб. дешевле книги. Сколько рублей было у Ани сначала?",
     o:["90 руб.","240 руб.","120 руб.","150 руб."], a:1,
     e:["Так получится, если 30 руб. принять за {1/8} суммы и найти {3/8}: 30 × 3 = 90 руб. Но это лишь цена книги, а не вся сумма.",
        "",
        "Так получится, если 30 руб. принять за {1/4} сбережений (30 × 4). Но разность {3/8} − {2/8} равна {1/8}, а не {1/4}.",
        "Это остаток после покупки книги ({5/8} всей суммы: 240 ÷ 8 × 5 = 150 руб.). Спрашивается про всю сумму, которая была до покупок."],
     h:["Выясни, какую часть всех денег Аня потратила на тетради. Дробь {2/5} берётся не от всей суммы, а от остатка после книги.",
        "После книги осталось {5/8} суммы, то есть 5 долей из 8. {2/5} от этих пяти долей составляют 2 доли. Сравни доли книги и тетрадей, а потом найди, чему равна одна доля."],
     s:"1) После покупки книги осталось {8/8} − {3/8} = {5/8} суммы, то есть 5 долей из 8. 2) {2/5} от этих 5 долей — это 2 доли, значит, тетради стоят {2/8} суммы, а книга {3/8}. 3) Разность {3/8} − {2/8} = {1/8} суммы — это 30 руб. 4) Вся сумма: 30 × 8 = 240 руб. Ответ: 240 руб. Проверка: книга 90 руб., остаток 150 руб., тетради 150 ÷ 5 × 2 = 60 руб., и 90 − 60 = 30 руб."},

    {q:"Правильные дроби со знаменателем 12 записаны в ряд: {1/12}, {2/12}, {3/12} и так далее до {11/12}. Сколько среди них дробей, которые больше {1/3}, но меньше {3/4}?",
     n:4,
     m:{"6":"Так получится, если включить границы: {4/12} = {1/3} и {9/12} = {3/4}. Но по условию дробь должна быть строго больше {1/3} и строго меньше {3/4}.",
        "5":"Здесь учтена одна из границ: {4/12} равна {1/3}, а {9/12} равна {3/4}. Нужны дроби строго между ними, ни одна граница не подходит.",
        "7":"Так получится, если учтено только условие «больше {1/3}» (числители от 5 до 11). Условие «меньше {3/4}» тоже нужно выполнить."},
     w:"{1/3} = {4/12}, {3/4} = {9/12}. Подходят дроби с числителями 5, 6, 7, 8, то есть 4 дроби.",
     h:["Запиши {1/3} и {3/4} в виде дробей со знаменателем 12: сколько двенадцатых долей в каждой из них?",
        "При равных знаменателях сравнивают числители. Нужны числители, которые больше числителя первой границы и меньше числителя второй; сами границы не входят. Выпиши подходящие числители списком."],
     s:"1) {1/3} = {4/12} (12 ÷ 3 = 4), {3/4} = {9/12} (12 ÷ 4 × 3 = 9). 2) У дробей с одинаковыми знаменателями больше та, у которой числитель больше. Значит, числитель должен быть больше 4 и меньше 9. 3) Подходят 5, 6, 7, 8, то есть дроби {5/12}, {6/12}, {7/12}, {8/12}. Ответ: 4. Проверка: {4/12} = {1/3} и {9/12} = {3/4} не подходят, потому что неравенства строгие."},

    {q:"У Миши был моток верёвки длиной 12 м. Он отрезал от него 3 куска, каждый длиной 2{3/4} м, а потом из того, что осталось, отрезал ещё {3/4} м на узел. Сколько метров верёвки осталось?",
     o:["3{3/4} м","4{1/2} м","3 м","5{1/4} м"], a:2,
     e:["Так получится, если не вычесть последний отрезок на узел: 12 − 8{1/4} = 3{3/4} м. После трёх кусков осталось именно столько, но потом отрезали ещё {3/4} м.",
        "Так получится при ошибке в умножении: 3 × {3/4} записано как {9/12} = {3/4} (умножены и числитель, и знаменатель), и три куска получились длиной 6{3/4} м. При умножении дроби на число умножается только числитель: 3 × {3/4} = {9/4} = 2{1/4}.",
        "",
        "Так получится, если умножить на 3 только целую часть (3 × 2 = 6) и забыть про дробную часть {3/4}: она есть в каждом куске. Тогда 12 − 6 = 6, а 6 − {3/4} = 5{1/4}."],
     h:["Найди, сколько метров верёвки ушло на три куска. Для этого умножь на 3 отдельно целую и дробную части числа 2{3/4}, а потом сложи результаты.",
        "3 × {3/4} = {9/4} — неправильная дробь, выдели из неё целую часть. Потом вычти из 12 всё отрезанное, включая узел."],
     s:"1) Три куска: 3 × 2{3/4} = 6 + {9/4} = 6 + 2{1/4} = 8{1/4} м. 2) После трёх кусков осталось 12 − 8{1/4} = 3{3/4} м. 3) На узел отрезали {3/4} м: 3{3/4} − {3/4} = 3 м. Ответ: 3 м. Проверка: 8{1/4} + {3/4} + 3 = 9 + 3 = 12 м."},

    {q:"В саду растут 48 деревьев. {3/8} из них — яблони. Из остальных деревьев {2/5} — груши, а все остальные — вишни. Какую часть всех деревьев сада составляют вишни?",
     o:["{3/5}","{1/4}","{5/8}","{3/8}"], a:3,
     e:["Вишни составляют {3/5} остальных деревьев (18 из 30), но спрашивается про все деревья сада, то есть про 48.",
        "Так получится, если найти долю груш: их 12 из 48, то есть {1/4}. Вишни — другие деревья.",
        "Это доля всех деревьев, которые не являются яблонями (30 из 48). Но среди них есть и груши, которые нужно исключить.",
        ""],
     h:["Найди, сколько в саду яблонь, сколько остальных деревьев, а затем сколько из остальных груш и вишен.",
        "Когда найдёшь число вишен, запиши, какая часть всех 48 деревьев приходится на них, и сократи дробь так, чтобы знаменатель оказался не больше 12."],
     s:"1) Яблони: 48 ÷ 8 × 3 = 18. 2) Остальные деревья: 48 − 18 = 30. 3) Груши: 30 ÷ 5 × 2 = 12, вишни: 30 − 12 = 18. 4) Вишен 18 из 48 деревьев; числитель и знаменатель делятся на 6, поэтому это {3/8} всех деревьев. Ответ: {3/8}. Проверка: {3/8} от 48 = 48 ÷ 8 × 3 = 18."},

    {q:"Принцесса пошла на ярмарку с кошельком золотых монет. Сначала она потратила {1/3} всех монет и ещё 2 монеты. Потом потратила {1/2} оставшихся монет и ещё 2 монеты. После этого в кошельке осталось 6 монет. Сколько монет было в кошельке сначала?",
     n:27,
     m:{"16":"Так получится, если остановиться на полпути: 16 монет было перед второй тратой (6 + 2 = 8, 8 × 2 = 16). Нужно ещё вернуться к началу, перед первой тратой.",
        "18":"Так получится, если после возврата 2 монет принять 18 за всё число монет. Но 18 — это {2/3} от начального числа, ведь {1/3} потрачена: целое равно 18 ÷ 2 × 3.",
        "54":"Здесь 18 монет приняты за {1/3} всех монет, и 18 умножено на 3. Но 18 — это то, что осталось после траты {1/3}, то есть {2/3} от начального числа."},
     w:"Решаем с конца. Перед второй тратой было (6 + 2) × 2 = 16 монет. Перед первой тратой: 16 + 2 = 18 монет — это {2/3} кошелька, значит, всего 18 ÷ 2 × 3 = 27 монет.",
     h:["Решай с конца: последний шаг — «потратила половину оставшихся и ещё 2 монеты, осталось 6». Сколько монет было перед этим шагом?",
        "Остаток 6 — это половина монет минус 2. Вернись на шаг назад: найди число монет перед второй тратой. Дальше так же рассуди про первый шаг, помня, что тогда потрачена {1/3} и ещё 2 монеты."],
     s:"Решаем с конца. 1) После второй траты осталось 6 монет. Это {1/2} минус 2 монеты, значит, {1/2} равна 6 + 2 = 8, и перед второй тратой было 8 × 2 = 16 монет. 2) После первой траты осталось 16 монет. Это {2/3} всех монет минус 2, значит, {2/3} равны 16 + 2 = 18. Одна треть: 18 ÷ 2 = 9, всего 9 × 3 = 27 монет. Ответ: 27. Проверка: 27 ÷ 3 + 2 = 11, осталось 27 − 11 = 16; 16 ÷ 2 + 2 = 10, осталось 16 − 10 = 6."},

    {q:"Волшебник сварил три разных зелья. Объём каждого зелья равен нескольким одиннадцатым долям литра, причём у разных зелий эти числа разные (целые и больше нуля). Вместе зелий получилось ровно 2 л. Каков наибольший возможный объём самого большого зелья?",
     o:["1{9/11} л","1{8/11} л","1{6/11} л","1{10/11} л"], a:1,
     e:["Так получится, если два других зелья взять по {1/11} л (22 − 1 − 1 = 20). Но числа одиннадцатых долей у зелий должны быть разными, поэтому пара 1 и 1 не подходит.",
        "",
        "Так получится, если два других зелья взять по {2/11} л и {3/11} л (22 − 2 − 3 = 17). Но можно взять ещё меньшие различные числа: 1 и 2, и тогда самое большое зелье станет ещё больше.",
        "Так получится, если одно зелье взять с числом долей 0 (0 + 1 + 21 = 22). Но число долей должно быть больше нуля, так что самое маленькое зелье — {1/11} л."],
     h:["2 л — это {22/11} л, то есть всего 22 одиннадцатых доли. Чтобы одно зелье было наибольшим, два других должны быть наименьшими из возможных.",
        "Подбери два наименьших различных натуральных числа долей, вычти их сумму из 22 и запиши результат дробью со знаменателем 11. Неправильную дробь переведи в смешанное число."],
     s:"1) 2 л = {22/11} л, значит, сумма чисел одиннадцатых долей равна 22. 2) Чтобы одно число было наибольшим, два других нужно взять наименьшими различными натуральными: 1 и 2. 3) Наибольшее число долей: 22 − 1 − 2 = 19, это {19/11} л = 1{8/11} л. Ответ: 1{8/11} л. Проверка: {1/11} + {2/11} + {19/11} = {22/11} = 2 л."},

    {q:"Артём готовится к олимпиаде и решает задачи из сборника. В первый день он решил {1/4} всех задач сборника, во второй день — {1/3} задач, оставшихся после первого дня, в третий день — {1/2} задач, оставшихся после второго дня. В четвёртый день он решил оставшиеся 12 задач. Сколько задач в сборнике?",
     n:48,
     m:{"24":"Так получится, если найти только остаток после второго дня: 12 — это половина, значит, перед третьим днём было 24 задачи. Нужно подняться ещё на два шага вверх, к началу.",
        "36":"Так получится, если вернуться только на два шага: 36 задач было после первого дня. Но это {3/4} сборника, ведь в первый день решили {1/4}, поэтому нужно найти целое."},
     w:"Решаем с конца: после второго дня осталось 12 × 2 = 24 задачи; после первого дня 24 ÷ 2 × 3 = 36 задач; в сборнике 36 ÷ 3 × 4 = 48 задач.",
     h:["Иди от конца к началу. Оставшиеся 12 задач — это {1/2} того, что было после второго дня (вторую половину решили в третий день). Найди остаток после второго дня.",
        "Остаток после второго дня — это {2/3} остатка после первого дня (ведь {1/3} решили во второй день). Найди остаток после первого дня, а потом весь сборник: этот остаток составляет {3/4} всего."],
     s:"Рассуждаем с конца. 1) В третий день решили {1/2} остатка, значит, оставшиеся 12 задач тоже составляют {1/2} этого остатка. Остаток после второго дня: 12 × 2 = 24 задачи. 2) Во второй день решили {1/3} остатка после первого дня, значит, 24 задачи — это {2/3} того остатка. Одна треть: 24 ÷ 2 = 12, остаток после первого дня 12 × 3 = 36 задач. 3) После первого дня осталось {3/4} сборника: 3 доли — это 36, 1 доля — 12, весь сборник 12 × 4 = 48 задач. Ответ: 48. Проверка: каждый из четырёх дней решено по 12 задач, 12 × 4 = 48."},

    {q:"Чтобы получить нужный оттенок краски, берут {2/5} голубой краски и {3/5} белой. В мастерской есть 14 л голубой краски и 15 л белой. Какое наибольшее количество литров краски нужного оттенка можно приготовить?",
     o:["25 л","35 л","29 л","21 л"], a:0,
     e:["",
        "Так получится, если ориентироваться только на голубую краску: 14 л — это {2/5}, значит, всего 35 л. Но тогда белой понадобится 21 л, а её только 15 л.",
        "Так получится, если сложить все запасы (14 + 15). Но краски смешивают в определённой пропорции, и часть голубой краски останется неиспользованной.",
        "Это количество белой краски, которое понадобилось бы, чтобы израсходовать всю голубую краску ({3/5} от 35 л). Белой столько нет, и такой объём приготовить нельзя."],
     h:["Проверь по очереди два случая: что получится, если израсходовать всю голубую краску, и что получится, если израсходовать всю белую. Каждый раз выясни, хватит ли второй краски.",
        "Если вся белая краска (15 л) — это {3/5} смеси, найди одну долю, всю смесь и количество голубой краски, а затем сравни его с 14 л."],
     s:"1) Если израсходовать всю белую краску: 15 л — это {3/5} смеси, одна доля 15 ÷ 3 = 5 л, вся смесь 5 × 5 = 25 л. Голубой нужно 5 × 2 = 10 л, а есть 14 л, хватает. 2) Если израсходовать всю голубую: 14 л — это {2/5}, значит, смеси 35 л, а белой нужно 21 л, её только 15 л — не хватает. 3) Значит, ограничивает белая краска, и наибольшее количество смеси — 25 л. Ответ: 25 л. Проверка: 10 л голубой + 15 л белой = 25 л, и 10 л меньше 14 л."},

    {q:"У Лены есть лента длиной 5{1/3} м. Она режет её на одинаковые кусочки по {2/3} м. Для одного браслета нужно 3 таких кусочка. Готовые браслеты Лена продаёт по 45 руб. Сколько рублей она получит, если продаст все браслеты, которые удалось сделать?",
     o:["360 руб.","135 руб.","90 руб.","225 руб."], a:2,
     e:["Так получится, если считать, что на один браслет идёт один кусочек (8 браслетов по 45 руб.). Но по условию на браслет нужно 3 кусочка.",
        "Так получится, если 8 кусочков разделить на 3 и округлить до 3 браслетов. Но неполный браслет (из 2 кусочков) продать нельзя: целых браслетов только 2.",
        "",
        "Здесь число кусочков найдено по {1/3} м (в ленте 16 третей, 16 ÷ 3 = 5 браслетов). Но кусочек равен {2/3} м, то есть двум третям, и таких кусочков всего 8."],
     h:["Узнай, сколько третей метра содержится в 5{1/3} м, и сколько третей в одном кусочке.",
        "Число кусочков равно числу третей в ленте, делённому на число третей в кусочке. Затем выясни, сколько целых браслетов получится: остаток кусочков в дело не идёт."],
     s:"1) 5{1/3} м = 5 × 3 + 1 = 16 третей метра. 2) Один кусочек — {2/3} м, то есть 2 трети. Кусочков: 16 ÷ 2 = 8. 3) На браслет нужно 3 кусочка: 8 ÷ 3 = 2 (остаток 2 кусочка), значит, получится 2 целых браслета. 4) Выручка: 2 × 45 = 90 руб. Ответ: 90 руб. Проверка: 2 браслета используют 6 кусочков, то есть 6 × {2/3} = 4 м ленты; остаток 1{1/3} м даёт два кусочка, этого на ещё один браслет не хватает."},

    {q:"В большой бочке налита вода, она заполнена на {3/5} своей вместимости. Когда в бочку долили 14 л воды, она оказалась заполнена на {4/5}. Сколько литров воды было в бочке до доливания?",
     o:["56 л","70 л","42 л","28 л"], a:2,
     e:["Это количество воды после доливания ({4/5} от 70 л). Спрашивается про то, что было до доливания.",
        "Это вместимость всей бочки (14 × 5 = 70 л). Но вода занимала только {3/5} бочки.",
        "",
        "Это объём пустой части бочки до доливания ({2/5} от 70 л). А воды было {3/5} вместимости."],
     h:["Узнай, какую часть бочки составили 14 литров: сравни {4/5} и {3/5}.",
        "Если 14 л — это одна доля из пяти, найди вместимость бочки, а затем воду до доливания (три доли из пяти)."],
     s:"1) Прибавилось {4/5} − {3/5} = {1/5} вместимости, и это 14 л. 2) Вся бочка: 14 × 5 = 70 л. 3) Воды было {3/5} от 70: 70 ÷ 5 × 3 = 42 л. Ответ: 42 л. Проверка: 42 + 14 = 56 л, и {4/5} от 70 тоже 56 л."}
  ]
});
TOPICS.push({
  id:"dec", title:"Долина Десятичных", sub:"Десятичные дроби, единицы измерения", glyph:"0,5", color:"#7be0b0",
  theory:[
    "Десятичные дроби складывают и вычитают «столбиком», записывая запятую под запятой; недостающие разряды дополняют нулями: 5 − 2,35 = 5,00 − 2,35 = 2,65.",
    "При умножении на 10, 100, 1000 запятая сдвигается вправо на 1, 2, 3 знака, а при делении — влево. Единицы: 1 км = 1 000 м, 1 м = 100 см, 1 кг = 1 000 г, 1 т = 1 000 кг, 1 руб. = 100 коп.",
    "Десятичные дроби сравнивают по разрядам слева направо: сначала целые части, потом десятые, сотые. При округлении смотрят на следующую цифру: 5 и больше — прибавляют единицу, меньше 5 — оставляют как есть.",
    "Среднее арифметическое = сумма ÷ количество, значит, сумма = среднее × количество. Расстояние = скорость × время. Цена деления на шкале = разность отметок ÷ число промежутков (промежутков на 1 больше, чем штрихов между отметками)."
  ],
  tasks:[
    {q:"Аня пришла в канцелярский магазин и купила 3 тетради по 24 руб. 50 коп. и ручку за 18 руб. 75 коп. На кассе она протянула кассиру 100 руб. Сколько сдачи должна получить Аня?",
     o:["26 руб. 50 коп.","7 руб. 75 коп.","56 руб. 75 коп.","92 руб. 25 коп."], a:1,
     e:["Здесь вычтена только стоимость тетрадей (73 руб. 50 коп.): 100 − 73,5 = 26,5. Цена ручки (18 руб. 75 коп.) не учтена.","","Так получится, если считать, что куплена одна тетрадь: 24,5 + 18,75 = 43,25 и 100 − 43,25 = 56,75. Но тетрадей три, поэтому цену тетради нужно умножить на 3.","92 руб. 25 коп. — это стоимость всей покупки (73,5 + 18,75). Вопрос же про сдачу: эту сумму нужно ещё вычесть из 100 руб."],
     h:["Сначала найди стоимость трёх тетрадей, потом прибавь цену ручки — получится стоимость всей покупки. Рубли и копейки удобно записать десятичной дробью: 24 руб. 50 коп. = 24,5 руб.","Сдача — это разность между 100 руб. и стоимостью всей покупки. Вычитай столбиком, записывая запятую под запятой (100 = 100,00)."],
     s:"1) Три тетради: 24,5 × 3 = 73,5 руб. 2) Вся покупка: 73,5 + 18,75 = 92,25 руб. 3) Сдача: 100 − 92,25 = 7,75 руб., то есть 7 руб. 75 коп. Ответ: 7 руб. 75 коп. Проверка: 92,25 + 7,75 = 100."},

    {q:"Туристы шли три дня. В первый день они прошли 12,4 км, во второй — на 1,85 км меньше, чем в первый, а в третий — на 2,3 км больше, чем во второй. Сколько всего километров прошли туристы за три дня? Ответ запиши в километрах.", n:35.8,
     m:{"22.95":"Так получится, если сложить только первые два дня (12,4 + 10,55). Нужно ещё прибавить путь третьего дня.","37.65":"Третий день посчитан от первого дня (12,4 + 2,3 = 14,7), а в условии сказано «на 2,3 км больше, чем во второй»: 10,55 + 2,3 = 12,85.","43.2":"Здесь второй день найден сложением (12,4 + 1,85 = 14,25), а в условии «меньше»: нужно вычитать, 12,4 − 1,85 = 10,55."},
     w:"Нужно найти путь за каждый день: во второй день вычесть 1,85 из 12,4, в третий прибавить 2,3 к пути второго дня, а затем сложить три числа, записывая запятую под запятой.",
     h:["Найди, сколько километров туристы прошли во второй день, потом — в третий. Не путай, от какого дня отсчитывается каждая разница.","Второй день: 12,4 − 1,85. Третий день: путь второго дня + 2,3. После этого сложи все три дня."],
     s:"1) Второй день: 12,4 − 1,85 = 10,55 км. 2) Третий день: 10,55 + 2,3 = 12,85 км. 3) Всего: 12,4 + 10,55 + 12,85 = 35,8 км. Ответ: 35,8. Проверка: 12,4 + 12,85 = 25,25 и 25,25 + 10,55 = 35,8."},

    {q:"Миша готовится к кроссу на 10 км. Утром он пробежал 2 км 350 м, а вечером — 3,1 км. Сколько километров ему осталось пробежать, чтобы выполнить дневную норму в 10 км?",
     o:["6,9 км","5,45 км","4,865 км","4,55 км"], a:3,
     e:["Здесь вычтен только вечерний забег: 10 − 3,1 = 6,9. Утренние 2 км 350 м тоже уже пробежаны и должны быть вычтены.","5,45 км — это то, сколько Миша уже пробежал (2,35 + 3,1). А в вопросе нужно найти, сколько осталось: эту сумму надо вычесть из 10 км.","Так получится, если 350 м записать как 0,035 км и взять 2,035 км вместо 2,35 км. Но 350 м = 0,35 км, потому что 1 км = 1 000 м.",""],
     h:["Переведи утреннюю дистанцию в километры: 350 м — это сколько долей километра? Запиши её десятичной дробью.","Сложи две пробежки, а затем вычти полученную сумму из 10 км. Запятую записывай под запятой."],
     s:"1) 2 км 350 м = 2,35 км (350 м = 0,35 км). 2) Всего пробежано: 2,35 + 3,1 = 5,45 км. 3) Осталось: 10 − 5,45 = 4,55 км. Ответ: 4,55 км. Проверка: 5,45 + 4,55 = 10."},

    {q:"На шкале линейки подписаны две соседние отметки: 2,4 и 3,6. Между ними нарисовано 5 одинаковых штрихов, которые делят промежуток на равные части. Какое число соответствует четвёртому штриху, если считать от отметки 2,4?", n:3.2,
     m:{"3":"Так получится, если отложить три шага по 0,2 (2,4 + 0,6). Четвёртый штрих находится на четыре шага правее 2,4.","3.36":"Разность 3,6 − 2,4 = 1,2 разделена на 5 частей, но 5 штрихов делят промежуток на 6 равных частей. Цена деления: 1,2 ÷ 6 = 0,2, а не 0,24.","3.4":"Здесь отложено 5 шагов по 0,2 (2,4 + 1), то есть найден пятый штрих. Четвёртый штрих находится на 4 шага правее 2,4."},
     w:"Сначала найди цену деления: на сколько равных частей 5 штрихов делят отрезок от 2,4 до 3,6 и чему равна одна такая часть?",
     h:["Найди разность 3,6 − 2,4 и раздели её на число частей. Штрихов 5, а частей на одну больше.","Цена деления равна 0,2. До первого штриха от 2,4 — один шаг, до второго — два шага и так далее. Сколько шагов до четвёртого?"],
     s:"1) Длина промежутка: 3,6 − 2,4 = 1,2. 2) 5 штрихов делят его на 6 равных частей, цена деления: 1,2 ÷ 6 = 0,2. 3) Четвёртый штрих — это 4 шага от 2,4: 2,4 + 4 × 0,2 = 2,4 + 0,8 = 3,2. Ответ: 3,2. Проверка: от 3,2 до 3,6 два шага по 0,2 (0,4), и 3,2 + 0,4 = 3,6."},

    {q:"Мама купила на рынке яблоки и сыр. Весы показали 2,347 кг яблок, но при расчёте вес округляют до сотых долей килограмма. Килограмм яблок стоит 80 руб. Ещё мама взяла 0,6 кг сыра по 450 руб. за килограмм и расплатилась купюрой в 500 руб. Сколько рублей сдачи она получила?",
     o:["42 руб.","42,24 руб.","46 руб.","312 руб."], a:0,
     e:["","Так получится, если считать яблоки по точному весу 2,347 кг (187,76 руб.). Но по условию вес округляют до сотых: 2,347 ≈ 2,35 кг, тогда яблоки стоят 188 руб.","Здесь вес округлён до десятых (2,3 кг), а нужно до сотых. В числе 2,347 в разряде сотых стоит 4, а следующая цифра 7 больше 5, поэтому 2,35.","312 руб. получится, если вычесть из 500 руб. только стоимость яблок (188 руб.). Стоимость сыра (0,6 × 450 = 270 руб.) тоже входит в покупку."],
     h:["Сначала округли вес яблок до сотых: посмотри на цифру в разряде тысячных. Затем найди стоимость яблок и стоимость сыра.","Сложи стоимость яблок и сыра, это сумма покупки. Сдача — разность между 500 руб. и этой суммой."],
     s:"1) Округляем: 2,347 ≈ 2,35 кг (цифра тысячных 7 ≥ 5). 2) Яблоки: 2,35 × 80 = 188 руб. 3) Сыр: 0,6 × 450 = 270 руб. 4) Вся покупка: 188 + 270 = 458 руб. 5) Сдача: 500 − 458 = 42 руб. Ответ: 42 руб. Проверка: 458 + 42 = 500."},

    {q:"Фермер взвесил пять дынь. Средняя масса одной дыни получилась 3,4 кг. Четыре дыни весят 3,2 кг, 3,9 кг, 3,0 кг и 3,1 кг. Сколько килограммов весит пятая дыня?",
     o:["0,4 кг","3,3 кг","3,8 кг","3,4 кг"], a:2,
     e:["Здесь общая масса найдена как 3,4 × 4 = 13,6 кг: среднее умножено на 4. Но среднее считалось по пяти дыням, поэтому умножать нужно на 5.","3,3 кг — это среднее арифметическое четырёх известных дынь (13,2 ÷ 4). А нужна масса пятой дыни, которую находят через общую массу всех пяти.","","3,4 кг — это средняя масса всех пяти дынь, а не масса именно пятой. Пятая дыня может отличаться от средней: нужно найти общую массу и вычесть известные."],
     h:["Среднее арифметическое равно сумме, делённой на количество. Значит, сумма равна среднему, умноженному на количество. Найди общую массу всех пяти дынь.","Общая масса пяти дынь минус масса четырёх известных даст массу пятой. Сначала сложи четыре известные массы."],
     s:"1) Общая масса пяти дынь: 3,4 × 5 = 17 кг. 2) Четыре известные дыни: 3,2 + 3,9 + 3,0 + 3,1 = 13,2 кг. 3) Пятая дыня: 17 − 13,2 = 3,8 кг. Ответ: 3,8 кг. Проверка: (13,2 + 3,8) ÷ 5 = 17 ÷ 5 = 3,4."},

    {q:"Для праздника в пекарне было 12,5 кг муки. На один пирог идёт 250 г муки, а на одну булочку — 25 г. Испекли 18 пирогов и 40 булочек. Сколько граммов муки осталось? Ответ запиши в граммах.", n:7000,
     m:{"7":"Число 7 — это остаток в килограммах (7 кг). В условии просят граммы, а 1 кг = 1 000 г, поэтому 7 кг = 7 000 г.","8000":"Так получится, если не учесть булочки: 12 500 − 4 500 = 8 000. Муку на 40 булочек (40 × 25 = 1 000 г) тоже нужно вычесть.","11500":"Здесь вычтена мука только на булочки (12 500 − 1 000). Муку на пироги (18 × 250 = 4 500 г) тоже нужно вычесть."},
     w:"Переведи всё в граммы: 12,5 кг — это сколько граммов? Затем найди, сколько муки ушло на пироги и сколько на булочки.",
     h:["Умножь запятую вправо на три знака: 12,5 кг = 12 500 г. Затем найди расход муки отдельно на пироги и на булочки.","Сложи оба расхода и вычти их из 12 500 г."],
     s:"1) 12,5 кг = 12 500 г. 2) На пироги: 18 × 250 = 4 500 г. 3) На булочки: 40 × 25 = 1 000 г. 4) Осталось: 12 500 − 4 500 − 1 000 = 7 000 г. Ответ: 7000. Проверка: 7 000 + 4 500 + 1 000 = 12 500 г = 12,5 кг."},

    {q:"Миша купил 4 тетради по 28 руб. 50 коп. и 6 карандашей по 9 руб. 75 коп. и расплатился двумя купюрами по 100 руб. Сколько сдачи он получил?",
     o:["47,00 руб.","76,25 руб.","27,50 руб.","172,50 руб."], a:2,
     e:["Так получится, если считать только 4 карандаша: 4 × 9,75 = 39 руб. Но карандашей куплено 6, и 6 × 9,75 = 58,5 руб.","Здесь вычтена цена всего одного карандаша (9,75 руб.). Карандашей 6, поэтому их стоимость 6 × 9,75 = 58,5 руб.","","172 руб. 50 коп. — это стоимость всей покупки (114 + 58,5). Вопрос про сдачу: эту сумму нужно вычесть из 200 руб."],
     h:["Запиши цены десятичными дробями: 28 руб. 50 коп. = 28,5 руб., 9 руб. 75 коп. = 9,75 руб. Найди стоимость тетрадей и стоимость карандашей отдельно.","Сложи обе стоимости. Уплачено двумя купюрами по 100 руб., то есть 200 руб. Сдача — разность."],
     s:"1) Тетради: 28,5 × 4 = 114 руб. 2) Карандаши: 9,75 × 6 = 58,5 руб. 3) Вся покупка: 114 + 58,5 = 172,5 руб. 4) Уплачено: 100 × 2 = 200 руб. 5) Сдача: 200 − 172,5 = 27,5 руб. Ответ: 27,50 руб. Проверка: 172,5 + 27,5 = 200."},

    {q:"Турист должен добраться до города, до которого 50 км. Сначала 2,5 ч он ехал на велосипеде со скоростью 14,4 км/ч, а потом 1,5 ч шёл пешком со скоростью 4,6 км/ч. Сколько километров ему ещё осталось пройти до города?",
     o:["7,1 км","42,9 км","14 км","2,5 км"], a:0,
     e:["","42,9 км — это путь, который турист уже проделал (36 + 6,9). Вопрос же про оставшийся путь: эту длину нужно вычесть из 50 км.","Здесь вычтен только путь на велосипеде (36 км): 50 − 36 = 14. Путь пешком (4,6 × 1,5 = 6,9 км) тоже уже пройден.","Так получится, если пешую часть считать за 2,5 ч: 4,6 × 2,5 = 11,5 км и 50 − 36 − 11,5 = 2,5. Но пешком турист шёл 1,5 ч, а не 2,5 ч."],
     h:["Путь равен скорости, умноженной на время. Найди отдельно путь на велосипеде и путь пешком, каждый со своим временем.","Сложи два участка пути — получишь, сколько турист уже преодолел. Остаток — разность между 50 км и этой суммой."],
     s:"1) На велосипеде: 14,4 × 2,5 = 36 км. 2) Пешком: 4,6 × 1,5 = 6,9 км. 3) Пройдено всего: 36 + 6,9 = 42,9 км. 4) Осталось: 50 − 42,9 = 7,1 км. Ответ: 7,1 км. Проверка: 42,9 + 7,1 = 50."},

    {q:"Для корабля юнга Артём получил канат длиной 12,6 м. Сначала от него отрезали 2 куска по 1 м 85 см для швартовов, а остаток разделили на 5 одинаковых частей для поручней. Сколько сантиметров в одной такой части?",
     o:["215 см","890 см","1 780 см","178 см"], a:3,
     e:["Так получится, если отрезан только один кусок (12,6 − 1,85 = 10,75 м). По условию отрезали два куска по 1 м 85 см, то есть 3 м 70 см.","890 см — это длина остатка каната (12,6 − 3,7 = 8,9 м), но остаток ещё нужно разделить на 5 одинаковых частей.","Здесь 1,78 м переведено в сантиметры умножением на 1 000. Но в 1 м содержится 100 см, а не 1 000, поэтому 1,78 м = 178 см.",""],
     h:["Сначала найди, сколько метров каната ушло на два куска по 1 м 85 см (запиши 1 м 85 см как 1,85 м). Затем найди остаток.","Остаток раздели на 5 и получи длину одной части в метрах. После этого переведи метры в сантиметры: умножь на 100."],
     s:"1) Два куска: 1,85 × 2 = 3,7 м. 2) Остаток: 12,6 − 3,7 = 8,9 м. 3) Одна часть: 8,9 ÷ 5 = 1,78 м. 4) В сантиметрах: 1,78 × 100 = 178 см. Ответ: 178 см. Проверка: 178 × 5 = 890 см = 8,9 м, и 8,9 + 3,7 = 12,6 м."},

    {q:"Участок земли имеет форму прямоугольника со сторонами 14,6 м и 9,4 м. Его нужно обнести забором из готовых секций длиной 2,5 м каждая (пилить секции нельзя, можно покупать только целые). Какое наименьшее число секций нужно купить?", n:20,
     m:{"10":"Здесь взяты только две соседние стороны: 14,6 + 9,4 = 24 м, и 24 ÷ 2,5 = 9,6 ≈ 10. Забор идёт вокруг всего участка, поэтому нужен периметр, а не сумма двух сторон.","19":"Число 19,2 округлено «по правилам» до 19. Но 19 секций закроют лишь 47,5 м из 48 м, останется 0,5 м без забора. Секции целые, поэтому округлять нужно вверх.","48":"48 м — это длина забора (периметр участка). А вопрос про число секций по 2,5 м, поэтому 48 нужно ещё разделить на 2,5."},
     w:"Забор идёт вокруг всего участка, значит, нужна сумма длин всех четырёх сторон. Найди её.",
     h:["Периметр: (14,6 + 9,4) × 2. Чтобы разделить 48 на 2,5, удвой оба числа: 96 ÷ 5.","Если после деления получилась дробь, подумай: можно ли купить 0,2 секции? Забор должен закрыть участок полностью."],
     s:"1) Периметр: (14,6 + 9,4) × 2 = 24 × 2 = 48 м. 2) Секций: 48 ÷ 2,5 = 96 ÷ 5 = 19,2. 3) Целых секций 19 не хватит (19 × 2,5 = 47,5 м < 48 м), значит, нужно 20. Ответ: 20. Проверка: 20 × 2,5 = 50 м ≥ 48 м."},

    {q:"Артём дошёл от дома до школы за 1 500 шагов, длина каждого шага 65 см. Потом от школы до стадиона он прошёл ещё 0,8 км. Сколько километров Артём прошёл всего?",
     o:["0,975 км","1,775 км","10,55 км","98,3 км"], a:1,
     e:["0,975 км — это только путь от дома до школы (1 500 × 65 см = 975 м). Путь от школы до стадиона (0,8 км) тоже нужно прибавить.","","Здесь 97 500 см переведены в километры делением на 10 000 (получилось 9,75 км). Но в 1 км содержится 100 000 см: 97 500 см = 0,975 км.","Здесь 97 500 см переведены в километры делением на 1 000 (получилось 97,5 км). Но в 1 км содержится 100 000 см, а не 1 000."],
     h:["Найди длину первого участка: 1 500 шагов по 65 см. Затем переведи сантиметры в километры (1 км = 1 000 м = 100 000 см) или сначала в метры.","Переведи в одни единицы: 0,8 км — это сколько метров? Сложи оба участка и запиши ответ в километрах."],
     s:"1) Первый участок: 1 500 × 65 = 97 500 см = 975 м (в 1 м 100 см). 2) Второй участок: 0,8 км = 800 м. 3) Всего: 975 + 800 = 1 775 м = 1,775 км. Ответ: 1,775 км. Проверка: 0,975 км + 0,8 км = 1,775 км."},

    {q:"Принцесса грузит на лодку сокровища: 3 сундука с золотом по 12,45 кг и 2 мешка с жемчугом по 7,3 кг. Лодка выдерживает груз не более 60 кг. Сколько килограммов ещё можно взять на борт?",
     o:["22,65 кг","45,4 кг","8,05 кг","51,95 кг"], a:2,
     e:["Так получится, если учесть только золото: 60 − 37,35 = 22,65. Жемчуг (2 × 7,3 = 14,6 кг) тоже лежит в лодке.","Здесь вычтен только жемчуг: 60 − 14,6 = 45,4. Золото (3 × 12,45 = 37,35 кг) тоже уже погружено.","","51,95 кг — это масса всего погружённого груза (37,35 + 14,6). Вопрос же про то, сколько ещё можно добавить: эту массу нужно вычесть из 60 кг."],
     h:["Найди массу всего золота и массу всего жемчуга: каждую массу умножай на число сундуков или мешков.","Сложи две массы — это уже погруженный груз. Сколько не хватает до 60 кг?"],
     s:"1) Золото: 12,45 × 3 = 37,35 кг. 2) Жемчуг: 7,3 × 2 = 14,6 кг. 3) Уже погружено: 37,35 + 14,6 = 51,95 кг. 4) Можно взять ещё: 60 − 51,95 = 8,05 кг. Ответ: 8,05 кг. Проверка: 51,95 + 8,05 = 60."},

    {q:"Два поезда одновременно отправились навстречу друг другу из двух городов, расстояние между которыми 512,4 км. Скорость первого поезда 78,5 км/ч, скорость второго — 64,3 км/ч. Сколько километров будет между поездами через 3 часа после отправления?", n:84,
